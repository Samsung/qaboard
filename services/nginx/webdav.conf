# WebDAV, e.g. to mount the storage as a network drive. Not enabled by default, include it in a location:
#   location /davs/algo/ {
#     alias /algo/;
#     include /etc/nginx/webdav.conf;
#   }
# Beware: without the auth_basic below, anyone who can reach the server can read, write and delete files there,
# and QA-Board's checks of who can read files (snippets/qaboard-files-auth.conf) don't apply.
# https://tn710617.github.io/buildAWebDavServerWithNginx/

# if (-d $request_filename) { rewrite ^(.*[^/])$ $1/ break; }
# if ($request_method = MKCOL) { rewrite ^(.*[^/])$ $1/ break; }
autoindex               on;

client_body_temp_path /temp;
client_max_body_size 500M;

dav_methods             PUT DELETE MKCOL COPY MOVE;
dav_ext_methods         PROPFIND OPTIONS;
create_full_put_path    on;
dav_access              group:rw  all:r;
# enable creating directories without trailing slash
set $x $uri$request_method;
if ($x ~ [^/]MKCOL$) {
    rewrite ^(.*)$ $1/;
}


