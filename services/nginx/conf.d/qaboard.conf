# Supports several replicas and zero-downtime deploys, see the comments in upstreams/backend.conf
# Signing in, signing up and CLI sign-in codes: a few per minute and per client, against password guessing (429 beyond)
limit_req_zone $binary_remote_addr zone=qaboard_sign_in:10m rate=30r/m;

upstream backend {
    include /etc/nginx/upstreams/backend.conf;
}

server {
  server_name qaboard proxy;
  listen 80 default_server;
  listen [::]:80 ipv6only=on;

  # otherwise accessing qa/s/folder will redirect to qa:whatever/s/folder/
  # https://serverfault.com/questions/905657/nginx-redirects-to-http-after-port-in-redirect-off/905740
  absolute_redirect off;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
    # index.html must be revalidated to pick up new deploys
    add_header Cache-Control "no-cache";
  }

  # The webapp's bundles have a hash of their content in their names
  location /assets/ {
    root /builds;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # the build compressed them (see webapp/Dockerfile): no need to compress them on each request
    gzip_static on;
  }

  location ^~ /api {
    location ~ ^/api/v1/(user/auth|user/signup|auth/device/code|auth/oidc/) {
      limit_req zone=qaboard_sign_in burst=30 nodelay;
      limit_req_status 429;
      include uwsgi_params;
      uwsgi_pass backend;
      include cors;
    }
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;
    # X-Forwarded-* headers for the backend: see uwsgi_params (proxy_set_header doesn't apply to uwsgi_pass)
  }

  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }

  # Generic file serving - mount your output storage at /var/qaboard
  # Browsers opening a folder get QA-Board's file browser, see snippets/qaboard-files.conf
  location ^~ /s/ {
    alias /var/qaboard/;
    include snippets/qaboard-files.conf;
    # To restrict who can read the files of some projects or folders (QABOARD_LOGIN_RESTRICTED_YAML):
    # include snippets/qaboard-files-auth.conf;
    gzip_static on;
    gunzip on;
  }
  include snippets/qaboard-files-server.conf;

  # IIIF Cantaloupe image server
  location /iiif/ {
    include cors;
    proxy_pass http://cantaloupe:8182;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # https://flower.readthedocs.io/en/latest/reverse-proxy.html
  location /flower/ {
    # it can revoke tasks and shut the workers down
    include snippets/qaboard-admins-only.conf;
    proxy_pass http://flower:8888/flower/;
    proxy_set_header Host $host;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
