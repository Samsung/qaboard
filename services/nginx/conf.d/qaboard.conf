upstream backend {
    server backend:3000;
}

server {
  server_name qaboard proxy;
  listen 80 default_server;
  listen [::]:80 ipv6only=on;

  # otherwise accessing qa/s/folder will redirect to qa:whatever/s/folder/
  # https://serverfault.com/questions/905657/nginx-redirects-to-http-after-port-in-redirect-off/905740
  absolute_redirect off;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }

  # Generic file serving - mount your output storage at /var/qaboard
  location ^~ /s/ {
    alias /var/qaboard/;
    autoindex on;
    access_log off;
    include cors;
    gzip_static on;
    gunzip on;
  }

  # IIIF Cantaloupe image server
  location /iiif/ {
    include cors;
    proxy_pass http://cantaloupe:8182;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # https://flower.readthedocs.io/en/latest/reverse-proxy.html
  location /flower/ {
    proxy_pass http://flower:8888/flower/;
    proxy_set_header Host $host;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
