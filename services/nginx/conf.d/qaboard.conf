upstream backend {
    server backend:3000;
}
upstream cantaloupe {
    server cantaloupe:8182;
}


#### SIRC-only
upstream iiif-cde {
    server iiif-cde;
}


server {
  server_name default_server;
  listen 80;
  listen [::]:80 ipv6only=on;

  # otherwise accessing qa/s/folder will redirect to qa:whatever/s/folder/
  # https://serverfault.com/questions/905657/nginx-redirects-to-http-after-port-in-redirect-off/905740
  absolute_redirect off;

  # SIRC SSL CONFIG
  listen 5000;
  listen 5002;
  listen 5003;
  listen 8080;
  listen 443 ssl;
  ssl_certificate_key /ssl/cert.key;
  ssl_certificate /ssl/cert.cer;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  # we disabled service workers to cache the app
  # location ~* (service-worker\.js)$ {
  #   add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  #   expires off;
  #   proxy_no_cache 1;
  #   root /builds;
  #   try_files $uri $uri/index.html $uri.html /index.html;
  # }

  # location ~* \.(?:css|js)$ {
  #   expires 1y;
  #   access_log off;
  #   add_header Cache-Control "public";
  #   root /builds;
  #   try_files $uri $uri/index.html $uri.html /index.html;
  # }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;
  }
  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }

  location ^~ /s/home/ {
    alias /home/;
    autoindex on;
    access_log off;
    include cors;
  }
  location ^~ /s/home/ispq {
    deny all; 
  }

  location ^~ /s/algo/ {
    alias /algo/;
    autoindex on;
    access_log off;
    include cors;
    # let users save precompressed $file.gz
    # using "gzip $file" or https://github.com/google/zopfli
    gzip_static  on;
    # https://stackoverflow.com/questions/33375304/what-are-the-options-for-the-gzip-proxied-directive-for
    # gzip_proxied expired no-cache no-store private auth;
    # for clients that don't support gzip if only that version is available
    gunzip       on;
  }

  location ^~ /s/stage/ {
    alias /stage/;
    autoindex on;
    access_log off;
    include cors;

    gzip_static  on;
    gunzip       on;
  }

  location ^~ /s/sim/ {
    alias /sim/;
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/data/ {
    alias /data/;
    autoindex on;
    access_log off;
    include cors;
  }

 # http://nginx.org/en/docs/http/ngx_http_dav_module.html
  location /davs/algo/ {
    alias /algo/;
    include /etc/nginx/webdav.conf;
  }
  # location ^~ /davs/home/ {
  #   alias /home/;
  #   include /etc/nginx/webdav.conf;
  # }

  # IIIF Cantaloupe Server
  location /iiif/ {
      include cors;
      proxy_pass http://cantaloupe$request_uri;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Path /;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      if ($request_method = OPTIONS ) {
        add_header "Access-Control-Allow-Origin"  '*' always;
        return 204;
      }
  }

  # SIRC only: IIIF server using CDE for hex/raw images 
  location /iiif/cde {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Path /;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://iiif-cde/fcgi-bin/iipsrv.fcgi/;
  }

  location /metabase/ {
      proxy_pass http://metabase:3000/;
  }

}


server {
  listen 80;
  listen [::]:80;
  server_name qa-docs;
  return 302 https://qa/docs$request_uri;
}
