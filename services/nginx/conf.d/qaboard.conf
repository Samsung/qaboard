  # }

  # SIRC only: IIIF server using CDE for hex/raw images 
  # location /iiif/cde {
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_set_header X-Forwarded-Host $host:$server_port;
  #     proxy_set_header X-Forwarded-Port $server_port;
  #     proxy_set_header X-Forwarded-Path /;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_pass http://iiif-cde/fcgi-bin/iipsrv.fcgi/;
  # }

  location /metabase/ {
      # proxy_pass http://metabase:3000/;
      proxy_pass http://docker-prod-srv-1:3005/;
      proxy_connect_timeout 600;
      proxy_send_timeout 600;
      proxy_read_timeout 600;
      send_timeout 600;
  }

  location ~ ^/metabase/(https?.*) {
      return 302 $1;
  }

  # https://flower.readthedocs.io/en/latest/reverse-proxy.html
  location /flower/ {
      proxy_pass http://flower:8888/flower/;
      proxy_set_header Host $host;
      proxy_redirect off; 
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  }

}
