# HTTPS dev server on https://localhost:5001/
server {
  listen 5001 ssl;
  listen [::]:5001 ssl;
  ssl_certificate_key /ssl/cert.key;
  ssl_certificate /ssl/cert.cer;
  ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

  location / {
    # proxy_pass  http://frontend:3000/; # enable for dev environment
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;

  }
}

server {
  server_name qa qatools01;
  listen 80 default_server;
  listen [::]:80 ipv6only=on;

  # otherwise accessing qa/s/folder will redirect to qa:whatever/s/folder/
  # https://serverfault.com/questions/905657/nginx-redirects-to-http-after-port-in-redirect-off/905740
  absolute_redirect off;

  # SIRC SSL CONFIG
  listen 5000;
  listen 5002;
  listen 5003;
  listen 8080;
  listen 443 ssl default_server;
  ssl_certificate_key /ssl/cert.key;
  ssl_certificate /ssl/cert.cer;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location /docs/cis_utils/ {
    alias /algo/ws/ispq/docs/cis_utils/build/html;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  # we disabled service workers to cache the app
  # location ~* (service-worker\.js)$ {
  #   add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  #   expires off;
  #   proxy_no_cache 1;
  #   root /builds;
  #   try_files $uri $uri/index.html $uri.html /index.html;
  # }

  # location ~* \.(?:css|js)$ {
  #   expires 1y;
  #   access_log off;
  #   add_header Cache-Control "public";
  #   root /builds;
  #   try_files $uri $uri/index.html $uri.html /index.html;
  # }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;

  }
  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }

  location ^~ /s/home/ {
    alias /home/;
    autoindex on;
    access_log off;
    include cors;
  }
  location ^~ /s/home/ispq {
    deny all; 
  }

  location ^~ /s/algo/ {
    alias /algo/;
    autoindex on;
    access_log off;
    include cors;
    # let users save precompressed $file.gz
    # using "gzip $file" or https://github.com/google/zopfli
    gzip_static  on;
    # https://stackoverflow.com/questions/33375304/what-are-the-options-for-the-gzip-proxied-directive-for
    # gzip_proxied expired no-cache no-store private auth;
    # for clients that don't support gzip if only that version is available
    gunzip       on;
  }

  location ^~ /s/stage/ {
    alias /stage/;
    autoindex on;
    access_log off;
    include cors;

    gzip_static  on;
    gunzip       on;
  }

  location ^~ /s/sim/ {
    alias /sim/;
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/data/ {
    alias /data/;
    autoindex on;
    access_log off;
    include cors;
  }

 # http://nginx.org/en/docs/http/ngx_http_dav_module.html
  location /davs/algo/ {
    alias /algo/;
    include /etc/nginx/webdav.conf;
  }
  # location ^~ /davs/home/ {
  #   alias /home/;
  #   include /etc/nginx/webdav.conf;
  # }

