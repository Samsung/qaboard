upstream backend {
    server backend:3000;
}
upstream cantaloupe {
    server cantaloupe:8182;
}


#### SIRC-only
upstream iiif-cde {
    server iiif-cde;
}


server {
  server_name default_server;
  listen 80;
  listen [::]:80 ipv6only=on;

  # SIRC SSL CONFIG
  listen 5000;
  listen 5002;
  listen 5003;
  listen 443 ssl;
  ssl_certificate_key /ssl/cert.key;
  ssl_certificate /ssl/cert.pem;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  # we disabled service workers to cache the app
  # location ~* (service-worker\.js)$ {
  #   add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  #   expires off;
  #   proxy_no_cache 1;
  #   root /builds;
  #   try_files $uri $uri/index.html $uri.html /index.html;
  # }

  # location ~* \.(?:css|js)$ {
  #   expires 1y;
  #   access_log off;
  #   add_header Cache-Control "public";
  #   root /builds;
  #   try_files $uri $uri/index.html $uri.html /index.html;
  # }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;
  }
  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }


  location ^~ /s/ {
    alias /home/arthurf/ci/;
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/home/ {
    alias /home/;
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/home/arthurf {
    deny all; 
  }

  location ^~ /s/algo_archive/ {
    alias /net/f2/algo_archive/; 
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/algo_data/ {
    alias /stage/algo_data/; 
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/net/f2/algo_archive/ {
    alias /net/f2/algo_archive/; 
    autoindex on;
    access_log off;
    include cors;
  }

  location ^~ /s/stage/algo_data/ {
    alias /stage/algo_data/;
    autoindex on;
    access_log off;
    include cors;
  }


 # http://nginx.org/en/docs/http/ngx_http_dav_module.html
  location /davs/stage/ {
    alias /stage/;
    # if (-d $request_filename) { rewrite ^(.*[^/])$ $1/ break; }
    # if ($request_method = MKCOL) { rewrite ^(.*[^/])$ $1/ break; }

    client_body_temp_path /temp;
    client_max_body_size 500M;
    autoindex               on;
    dav_methods             PUT DELETE MKCOL COPY MOVE;
    # dav_ext_methods         PROPFIND OPTIONS;
    create_full_put_path    on;
    dav_access              group:rw  all:r;
    # enable creating directories without trailing slash
    set $x $uri$request_method;
    if ($x ~ [^/]MKCOL$) {
      rewrite ^(.*)$ $1/;
    }
    # $ sudo mkdir -p /etc/nginx/passwd
    # $ sudo htpasswd -c /etc/nginx/passwd/webdav_pass S1rC
    # auth_basic "Enter Password:";
    # auth_basic_user_file "/etc/nginx/passwd/webdav_pass";
  }
  location /davs/net/f2/ {
    alias /net/f2/;
    # if (-d $request_filename) { rewrite ^(.*[^/])$ $1/ break; }
    # if ($request_method = MKCOL) { rewrite ^(.*[^/])$ $1/ break; }

    # enable creating directories without trailing slash
    set $x $uri$request_method;
    if ($x ~ [^/]MKCOL$) {
      rewrite ^(.*)$ $1/;
    }

    client_body_temp_path /temp;
    client_max_body_size 500M;

    autoindex               on;
    dav_methods             PUT DELETE MKCOL COPY MOVE;
    # dav_ext_methods         PROPFIND OPTIONS;
    create_full_put_path    on;
    dav_access              group:rw  all:r;
  }


  # IIIF Cantaloupe Server
  location /iiif/ {
      include cors;
      proxy_pass http://cantaloupe$request_uri;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Path /;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      if ($request_method = OPTIONS ) {
        add_header "Access-Control-Allow-Origin"  '*' always;
        return 204;
      }
  }

  # SIRC only: IIIF server using CDE for hex/raw images 
  location /iiif/cde {
      include cors;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Path /;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://iiif-cde/fcgi-bin/iipsrv.fcgi/;
  }

  location /metabase/ {
      proxy_pass http://metabase:3000/;
  }

}


server {
  listen 80;
  listen [::]:80;
  server_name qa-docs;
  return 302 https://qa/docs$request_uri;
}
