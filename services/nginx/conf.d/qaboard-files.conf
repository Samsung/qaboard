# Used by snippets/qaboard-files.conf: when they open a folder under /s/,
# browsers get the file browser, which asks for the listing as JSON.
# With ?view=nginx they get nginx's index.
map $http_accept $qaboard_files_accept {
  default "";
  "~*application/json" listing;
  "~*text/html" browser;
}
# No "if" for files: only the last matching "if" applies, e.g. it would lose the "cors" headers
map "$arg_view|$qaboard_files_accept|$uri" $qaboard_files_view {
  default "";
  "~^\|browser\|.*/$" browser;
  "~^\|listing\|.*/$" listing;
}
