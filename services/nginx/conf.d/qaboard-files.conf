# Used by snippets/qaboard-files.conf: when they open a folder under /s/,
# browsers get the file browser, which asks for the listing as JSON.
# With ?view=nginx they get nginx's index.
map $http_accept $qaboard_files_accept {
  default "";
  "~*application/json" listing;
  "~*text/html" browser;
}
# No "if" for files: only the last matching "if" applies, e.g. it would lose the "cors" headers
map "$arg_view|$qaboard_files_accept|$uri" $qaboard_files_view {
  default "";
  "~^\|browser\|.*/$" browser;
  "~^\|listing\|.*/$" listing;
}
# With QABOARD_SANDBOX_HTML (configure.sh sets $qaboard_sandbox_html), users' HTML and SVG files under /s/ can't act
# as whoever opens them (stored XSS). Set in "cors", since its "if" drop the add_header of the locations. Not for
# other files: e.g. browsers don't show PDFs in sandboxed pages.
# - In frames (the web app's viewers): their scripts run, in an origin of their own
# - Opened in a tab: in our origin, so their images load with the session (restricted files), but no scripts.
#   The web app's HTML viewer runs them (sandboxed)
map "$qaboard_sandbox_html|$http_sec_fetch_dest|$uri|$sent_http_content_type" $qaboard_files_csp {
  default "";
  "~*^on\|(iframe|frame)\|/s/[^|]*\|(text/html|application/xhtml\+xml|image/svg\+xml)" "sandbox allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms allow-modals";
  "~*^on\|[^|]*\|/s/[^|]*\|(text/html|application/xhtml\+xml|image/svg\+xml)" "sandbox allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads";
}
