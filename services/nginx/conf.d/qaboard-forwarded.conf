# Used by uwsgi_params: the scheme and host the client used, for the backend (the SAML login builds its URLs from
# them, see prepare_flask_request in backend/backend/api/auth.py). Behind another proxy (TLS termination, an ingress...),
# we keep the X-Forwarded-* headers it sets.
map $http_x_forwarded_proto $qaboard_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
# $http_host has the port the client used, which isn't $server_port when docker publishes another one (e.g. 5151:80)
map $http_x_forwarded_host $qaboard_forwarded_host {
  default $http_x_forwarded_host;
  ""      $http_host;
}
