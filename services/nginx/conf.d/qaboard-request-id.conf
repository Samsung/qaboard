# The id of each request, in the access log (nginx.conf.template) and sent to the backend (uwsgi_params), which logs
# it with what it does for the request and sends it back in X-Request-ID: both logs share ids.
# Behind another proxy that sets X-Request-ID (e.g. ingress-nginx), we keep its id. Clients can send one too: only
# ids made of letters, digits, ".", "_", ":" and "-" are kept (like backend/logs.py REQUEST_ID_RE), so that they can't write anything else in the logs.
map $http_x_request_id $qaboard_request_id {
  "~^[A-Za-z0-9._:-]{1,64}$" $http_x_request_id;
  default                   $request_id;
}
