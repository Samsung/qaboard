# The access log, included by nginx.conf (not in its template: envsubst would empty the $variables).
# Like nginx's "combined" format, without query strings: tokens can be there (GET ...?token=qab_..., the links of
# `qa`, signed URLs), and in the Referer of the requests a page opened with one makes. The backend logs requests too
# (website/docs/backend-admin/logs.mdx), without query strings.
map $request_uri $qaboard_log_path {
  "~^(?<qaboard_path>[^?]*)" $qaboard_path;
  default $request_uri;
}
map $http_referer $qaboard_log_referer {
  "~^(?<qaboard_referer>[^?#]+)" $qaboard_referer;
  default $http_referer;
}
log_format qaboard '$remote_addr - $remote_user [$time_local] "$request_method $qaboard_log_path $server_protocol" '
                   '$status $body_bytes_sent "$qaboard_log_referer" "$http_user_agent"';
access_log /tmp/access.log qaboard;
