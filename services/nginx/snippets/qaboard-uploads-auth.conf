# Before nginx receives a file sent to the server (backend/uploads.py), the backend checks who sends it: without a
# token that can send results, the request is refused before its body is read (it could fill the disk).
# Its project and role are checked with the file. Needs snippets/qaboard-files-server.conf in the server.
# Without snippets/qaboard-files-server.conf in the server, the check's location doesn't exist: nginx would ask the
# web app's index.html instead, which always says yes. Refused rather than let through. With no server including it,
# nginx doesn't start: unknown "qaboard_files_server_included" variable.
if ($qaboard_files_server_included != 1) {
  return 500 "QA-Board's nginx configuration is missing `include snippets/qaboard-files-server.conf;` in this server: requests it would check are refused.\n";
}
auth_request /__qaboard/upload-auth;
# the backend's answer, which says why, rather than nginx's error page
error_page 401 403 = @qaboard_upload_refused;
# The backend refuses files nginx didn't check: it said yes in this header (clients can't set uwsgi params)
auth_request_set $qaboard_upload_checked $upstream_http_x_qaboard_upload_checked;
uwsgi_param QABOARD_UPLOAD_CHECKED $qaboard_upload_checked;
