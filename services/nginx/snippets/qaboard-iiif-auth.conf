# Only the users who can read an image's file (the rules of snippets/qaboard-files-auth.conf: restricted projects and
# folders) get it from the image server. Include it in the image server's locations (/iiif/), next to the files' check.
# nginx asks the backend once a minute per image and user (/__qaboard/iiif-auth, in snippets/qaboard-files-server.conf):
# the images' bytes go from the image server to the browser, as before.
# Without snippets/qaboard-files-server.conf in the server, refused rather than let through (see qaboard-files-auth.conf)
if ($qaboard_files_server_included != 1) {
  return 500 "QA-Board's nginx configuration is missing `include snippets/qaboard-files-server.conf;` in this server: requests it would check are refused.\n";
}
auth_request /__qaboard/iiif-auth;
