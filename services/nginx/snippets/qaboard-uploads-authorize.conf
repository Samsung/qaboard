# The backend's PUT /api/v1/uploads/authorize, without the request's body: see snippets/qaboard-files-server.conf.
# As a PUT: the backend checks that writes with a session come from our origin, and tokens without the "read" scope
# can send files
uwsgi_pass backend;
uwsgi_pass_request_body off;
uwsgi_param REQUEST_METHOD PUT;
uwsgi_param REQUEST_URI /api/v1/uploads/authorize;
uwsgi_param PATH_INFO /api/v1/uploads/authorize;
uwsgi_param QUERY_STRING "";
uwsgi_param CONTENT_LENGTH 0;
uwsgi_param SERVER_PROTOCOL $server_protocol;
uwsgi_param SERVER_NAME $server_name;
uwsgi_param SERVER_PORT $server_port;
uwsgi_param REMOTE_ADDR $remote_addr;
uwsgi_param HTTPS $https if_not_empty;
