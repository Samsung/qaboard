# pgAdmin at /pgadmin4/, signed in as QA-Board's admins: include it in the server, after qaboard-files-server.conf.
# Before proxying, nginx asks the backend (api/admin_services.py) if the user is an admin: others are sent to sign in (401)
# or get a 403. pgAdmin trusts the account in X-Pgadmin-User (AUTHENTICATION_SOURCES=webserver, see deployments/sirc/sirc.yml):
# nginx always replaces the header clients send, so pgAdmin must only be reachable through nginx (no published port).
location /pgadmin4/ {
  auth_request /__qaboard/pgadmin-auth;
  auth_request_set $pgadmin_user $upstream_http_x_pgadmin_user;
  error_page 401 = @qaboard_sign_in;
  proxy_set_header X-Pgadmin-User $pgadmin_user;
  proxy_set_header X-Script-Name /pgadmin4;
  proxy_set_header Host $host;
  proxy_set_header X-Scheme $scheme;
  proxy_pass http://pgadmin:80/;
  proxy_redirect off;
}

location = /pgadmin { return 301 /pgadmin4/; }
location /pgadmin/ { return 301 /pgadmin4/; }

location = /__qaboard/pgadmin-auth {
  internal;
  uwsgi_pass backend;
  uwsgi_pass_request_body off;
  uwsgi_param REQUEST_METHOD GET;
  uwsgi_param REQUEST_URI /api/v1/admin/pgadmin/authorize;
  uwsgi_param PATH_INFO /api/v1/admin/pgadmin/authorize;
  uwsgi_param QUERY_STRING "";
  uwsgi_param SERVER_PROTOCOL $server_protocol;
  uwsgi_param SERVER_NAME $server_name;
  uwsgi_param SERVER_PORT $server_port;
  uwsgi_param REMOTE_ADDR $remote_addr;
  uwsgi_param HTTPS $https if_not_empty;
}
