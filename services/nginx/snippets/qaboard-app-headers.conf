# The web app's own pages (not users' files under /s/, whose HTML reports may frame each other from sandboxed frames):
# - only QA-Board can show them in a frame: other websites can't trick users into clicking its buttons (clickjacking)
# - browsers don't guess the type of the files
# Locations with their own add_header don't inherit the server's: include this in each of them.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
