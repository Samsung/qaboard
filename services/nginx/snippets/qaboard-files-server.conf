# Used by snippets/qaboard-files.conf, include it in the server. The checks the other snippets ask nginx to make
# (qaboard-files-auth.conf, qaboard-uploads-auth.conf, qaboard-admins-only.conf) are its locations: without it, they
# refuse every request (see $qaboard_files_server_included in them)
set $qaboard_files_server_included 1;

# The web app's file browser
location = /__qaboard/files.html {
  internal;
  alias /builds/files.html;
  # must be revalidated to pick up new deploys
  add_header Cache-Control "no-cache";
  # Folders' URLs also serve their listing as JSON (Accept: application/json): browsers must not mix them up,
  # else after opening a file, Back shows the JSON instead of the file browser
  add_header Vary "Accept";
  include snippets/qaboard-app-headers.conf;
}

# Whether the user can read a file (snippets/qaboard-files-auth.conf)
location = /__qaboard/files-auth {
  internal;
  uwsgi_pass backend;
  uwsgi_pass_request_body off;
  uwsgi_param REQUEST_METHOD GET;
  uwsgi_param REQUEST_URI /api/v1/files/authorize;
  uwsgi_param PATH_INFO /api/v1/files/authorize;
  uwsgi_param QUERY_STRING "";
  uwsgi_param SERVER_PROTOCOL $server_protocol;
  uwsgi_param SERVER_NAME $server_name;
  uwsgi_param SERVER_PORT $server_port;
  uwsgi_param REMOTE_ADDR $remote_addr;
  uwsgi_param HTTPS $https if_not_empty;
  uwsgi_param HTTP_X_REQUEST_ID $qaboard_request_id;
  # Clients can't set it: their headers are sent as HTTP_*
  uwsgi_param QABOARD_ORIGINAL_URI $request_uri;
}

# Whether the user can read the image the image server is asked for (snippets/qaboard-iiif-auth.conf). The answer is
# kept a minute per image and credentials (session cookie or token): a viewer asks for dozens of tiles of each image
location = /__qaboard/iiif-auth {
  internal;
  uwsgi_pass backend;
  uwsgi_pass_request_body off;
  uwsgi_param REQUEST_METHOD GET;
  uwsgi_param REQUEST_URI /api/v1/files/authorize;
  uwsgi_param PATH_INFO /api/v1/files/authorize;
  uwsgi_param QUERY_STRING "";
  uwsgi_param SERVER_PROTOCOL $server_protocol;
  uwsgi_param SERVER_NAME $server_name;
  uwsgi_param SERVER_PORT $server_port;
  uwsgi_param REMOTE_ADDR $remote_addr;
  uwsgi_param HTTPS $https if_not_empty;
  uwsgi_param HTTP_X_REQUEST_ID $qaboard_request_id;
  # Clients can't set it: their headers are sent as HTTP_*
  uwsgi_param QABOARD_ORIGINAL_URI $request_uri;
  uwsgi_cache qaboard_iiif_auth;
  uwsgi_cache_key "$qaboard_iiif_identifier|$http_authorization|$http_cookie";
  uwsgi_cache_valid 204 60s;
  uwsgi_cache_valid 401 403 10s;
  # the answer is for these credentials only (the key): the backend's headers don't decide
  uwsgi_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
}

# Whether the request may send files (snippets/qaboard-uploads-auth.conf): the backend reads its token
location = /__qaboard/upload-auth {
  internal;
  include snippets/qaboard-uploads-authorize.conf;
}
# When it refused, its answer (JSON, with why) rather than nginx's error page
location @qaboard_upload_refused {
  include snippets/qaboard-uploads-authorize.conf;
  include cors;
}

# Whether the user is a QA-Board admin (snippets/qaboard-admins-only.conf)
location = /__qaboard/admin-auth {
  internal;
  uwsgi_pass backend;
  uwsgi_pass_request_body off;
  uwsgi_param REQUEST_METHOD GET;
  uwsgi_param REQUEST_URI /api/v1/admin/authorize;
  uwsgi_param PATH_INFO /api/v1/admin/authorize;
  uwsgi_param QUERY_STRING "";
  uwsgi_param SERVER_PROTOCOL $server_protocol;
  uwsgi_param SERVER_NAME $server_name;
  uwsgi_param SERVER_PORT $server_port;
  uwsgi_param REMOTE_ADDR $remote_addr;
  uwsgi_param HTTPS $https if_not_empty;
  uwsgi_param HTTP_X_REQUEST_ID $qaboard_request_id;
}

# Signed-out users of admin services sign in, then come back
location @qaboard_sign_in {
  return 302 /login?next=$request_uri;
}
