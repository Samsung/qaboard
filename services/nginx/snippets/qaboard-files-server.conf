# Used by snippets/qaboard-files.conf, include it in the server

# The web app's file browser
location = /__qaboard/files.html {
  internal;
  alias /builds/files.html;
  # must be revalidated to pick up new deploys
  add_header Cache-Control "no-cache";
  # Folders' URLs also serve their listing as JSON (Accept: application/json): browsers must not mix them up,
  # else after opening a file, Back shows the JSON instead of the file browser
  add_header Vary "Accept";
}

# Whether the user can read a file (snippets/qaboard-files-auth.conf)
location = /__qaboard/files-auth {
  internal;
  uwsgi_pass backend;
  uwsgi_pass_request_body off;
  uwsgi_param REQUEST_METHOD GET;
  uwsgi_param REQUEST_URI /api/v1/files/authorize;
  uwsgi_param PATH_INFO /api/v1/files/authorize;
  uwsgi_param QUERY_STRING "";
  uwsgi_param SERVER_PROTOCOL $server_protocol;
  uwsgi_param SERVER_NAME $server_name;
  uwsgi_param SERVER_PORT $server_port;
  uwsgi_param REMOTE_ADDR $remote_addr;
  uwsgi_param HTTPS $https if_not_empty;
  # Clients can't set it: their headers are sent as HTTP_*
  uwsgi_param QABOARD_ORIGINAL_URI $request_uri;
}
