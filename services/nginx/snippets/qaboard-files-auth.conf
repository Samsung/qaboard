# Only the users allowed by QABOARD_LOGIN_RESTRICTED_YAML can read the files of restricted projects and folders.
# Include it next to snippets/qaboard-files.conf. Before serving a file, nginx asks the backend:
# for public files it answers without querying the database, but if the backend is down, files are not served.
# Needs snippets/qaboard-files-server.conf in the server.
# Without snippets/qaboard-files-server.conf in the server, the check's location doesn't exist: nginx would ask the
# web app's index.html instead, which always says yes. Refused rather than let through. With no server including it,
# nginx doesn't start: unknown "qaboard_files_server_included" variable.
if ($qaboard_files_server_included != 1) {
  return 500 "QA-Board's nginx configuration is missing `include snippets/qaboard-files-server.conf;` in this server: requests it would check are refused.\n";
}
auth_request /__qaboard/files-auth;
