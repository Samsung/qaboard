# Serves files from the storage, in locations like:
#
#   location ^~ /s/algo/ {
#     alias /algo/;
#     include snippets/qaboard-files.conf;
#   }
#
# The server needs: include snippets/qaboard-files-server.conf;
# Browsers opening a folder get QA-Board's file browser (the web app's files.html), which asks the backend for
# the listing with "Accept: application/json". Other clients (curl, wget, scripts...) still get nginx's index,
# and browsers too with ?view=nginx
autoindex on;
access_log off;
include cors;
# only used to send listings to the backend
include uwsgi_params;
# e.g. sign in to read files of restricted projects (snippets/qaboard-files-auth.conf)
error_page 401 403 /__qaboard/files.html;

# see conf.d/qaboard-files.conf
if ($qaboard_files_view = browser) {
  rewrite ^ /__qaboard/files.html last;
}
if ($qaboard_files_view = listing) {
  uwsgi_pass backend;
}
# nginx ignores Range requests (e.g. to tail logs) when it compresses responses
if ($http_range) {
  gzip off;
  # within "if", the add_header from "cors" don't apply
  add_header "Access-Control-Allow-Origin" *;
}
