# QA-Board's PostgreSQL settings: only what differs from PostgreSQL's defaults.
#
# Loaded by services/db/init.sh, the db service's entrypoint in deployments/sirc/sirc.yml: at every start, it copies
# this file to $PGDATA/qaboard.conf and appends `include_if_exists = 'qaboard.conf'` to $PGDATA/postgresql.conf once.
# - Changing a value needs a restart of PostgreSQL: a deploy does NOT restart the database when only this file changed.
#   See deployments/sirc/runbooks/database.md.
# - `ALTER SYSTEM` writes $PGDATA/postgresql.auto.conf, which is read last and wins over this file: don't use it.
#   Check where a value comes from with: SELECT name, setting, source, sourcefile FROM pg_settings WHERE name = '...';
# - Every setting must be valid for PostgreSQL 12 (current) and 18 (planned upgrade): an unknown name or a
#   malformed value and PostgreSQL refuses to start. Check with both versions before adding one.
#
# Sized for SIRC's production host: 8 cores, 31 GB of RAM, shared with other docker stacks (QA-Board's backends,
# cantaloupe, other services), significant IO pressure. Other sites: copy this file and size it for your host.

#------------------------------------------------------------------------------
# Connections
#------------------------------------------------------------------------------
# Docker's network: the backends connect from other containers (the image's postgresql.conf sets it too).
listen_addresses = '*'

# Sized from the clients' pools, at the worst moment: a rolling deploy, while old and new backends run side by side.
# - backend: QABOARD_DB_POOL_SIZE + QABOARD_DB_MAX_OVERFLOW = 4 + 2 = 6 connections per uwsgi process
#   (backend/backend/database.py), + 1 for the uwsgi master (it creates the tables when it loads the app)
#   per replica: 8 processes (QABOARD_UWSGI_PROCESSES, production.env) * 6 + 1 =  49
#   2 replicas (QABOARD_BACKEND_REPLICAS)                                       =  98
#   during a deploy, deploy.py starts 2 new replicas before it stops the old ones: * 2 = 196
# - migrations (deploy.py runs them before the rolling update, not during it)    =   0 more
# - metabase (reads the database; its default pool is 15 connections)            =  15
# - cron-backup-db (pg_dump), staging's seed-db (pg_dump/psql)                    =   4
# - admins: psql, pgadmin, backend/scripts/                                       =  10
# - superuser_reserved_connections (default 3, part of max_connections)           =   3
#                                                                           total = 228, rounded up to 250.
# Per connection: a few MB when idle, up to a few work_mem when busy. flower and celery don't connect to PostgreSQL.
# If you change the pools, processes or replicas, update this.
max_connections = 250

# Detect dead clients (e.g. a backend container killed during a deploy) after 5 minutes instead of ~2 hours.
tcp_keepalives_idle = 300

# Ends sessions left idle inside a transaction (they hold locks and block vacuum). Longer than uwsgi's harakiri
# (300s, backend/uwsgi.ini), so a request that is still running is never cut.
idle_in_transaction_session_timeout = 10min

#------------------------------------------------------------------------------
# Memory
#------------------------------------------------------------------------------
# ~1/8 of the RAM: the host is shared, and the OS page cache also caches the data.
shared_buffers = 4GB
# What the OS page cache can hold for us, roughly: it only steers the planner towards index scans, nothing is allocated.
effective_cache_size = 14GB
# Per sort/hash operation, per connection: QA-Board's JSON-heavy queries sort big rows. 250 connections rarely sort at once.
work_mem = 16MB
# For VACUUM, CREATE INDEX and restores: faster index builds (e.g. CREATE INDEX CONCURRENTLY in migrations).
maintenance_work_mem = 512MB
# Memory for shared_buffers comes from regular pages: no huge pages are configured on the host (avoids a failed
# start, or a silent fallback, on hosts where they are).
huge_pages = off

#------------------------------------------------------------------------------
# WAL and checkpoints
#------------------------------------------------------------------------------
# Fewer checkpoints during bulk writes (saving results, migrations, restores): each one writes all dirty buffers.
max_wal_size = 4GB
# Keep recycled WAL files instead of creating new ones after a burst.
min_wal_size = 1GB
# Spread checkpoint writes over 90% of the interval to smooth the IO (the default since PostgreSQL 14).
checkpoint_completion_target = 0.9

#------------------------------------------------------------------------------
# Planner and IO
#------------------------------------------------------------------------------
# Network/flash storage serves many concurrent reads: prefetch for bitmap heap scans.
effective_io_concurrency = 200
# Random reads cost little more than sequential ones on flash/network storage, and most of the data is cached:
# prefer index scans.
random_page_cost = 1.5

#------------------------------------------------------------------------------
# Statistics and logs (to find slow queries)
#------------------------------------------------------------------------------
# Per-query statistics: SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC (total_time before 13).
# Needs `CREATE EXTENSION pg_stat_statements` in the database (done by init.sh for new databases).
shared_preload_libraries = 'pg_stat_statements'
# Only the statements clients send, not the ones inside functions.
pg_stat_statements.track = top
# Time spent on IO, in pg_stat_statements and EXPLAIN (ANALYZE, BUFFERS): tells IO-bound queries apart.
track_io_timing = on
# Log statements slower than 1s (in milliseconds).
log_min_duration_statement = 1000
# Log checkpoints, with how long they took: to see IO stalls.
log_checkpoints = on
# Log queries that spill more than 10MB to temporary files (in kB): a sign work_mem is too small for them.
log_temp_files = 10240
# Log lock waits longer than deadlock_timeout (1s): to find what blocks what.
log_lock_waits = on
# Log autovacuum runs longer than 60s: to find tables that need per-table autovacuum settings.
log_autovacuum_min_duration = 60s
# Too noisy with connection pools, and the backends reconnect after each deploy.
log_connections = off
log_disconnections = off
