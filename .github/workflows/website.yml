name: Website

# Builds the docs website on pull requests (the build fails on broken links, unknown shot ids, wrong stack tabs and
# missing repository files), and from master deploys it to GitHub Pages, then has the Algolia crawler update the
# search index. Needs Settings > Pages > Source: GitHub Actions, and for the crawl the secrets ALGOLIA_CRAWLER_ID,
# ALGOLIA_CRAWLER_USER_ID and ALGOLIA_CRAWLER_API_KEY (see website/README.md): without them, the site still deploys,
# and the crawler's daily schedule updates the index.
on:
  push:
    branches: [master]
    # with the files the docs show (<RepoFile>) or check
    paths: [website/**, charts/qaboard/**, deployments/quickstart/**, examples/**, docs-media/shots.yaml, docs-media/standins/**, qaboard/schemas/**, .github/workflows/website.yml]
  pull_request:
    paths: [website/**, charts/qaboard/**, deployments/quickstart/**, examples/**, docs-media/shots.yaml, docs-media/standins/**, qaboard/schemas/**, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: website/yarn.lock
      # The GitHub Actions workflows the docs show (no CI of ours runs them)
      - name: Lint the docs' GitHub Actions examples
        run: |
          docs-media/install-tools.sh actionlint
          ~/.cache/qaboard-docs-media/bin/actionlint website/snippets/ci/github-actions*.yml
      - name: Build website
        working-directory: website
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  search-index:
    name: Update the search index
    # After the deploy: the crawler reads the live site
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ALGOLIA_CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
      ALGOLIA_CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
      ALGOLIA_CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
    steps:
      # The crawler also runs on a daily schedule: this only makes the index fresh right after a deploy
      - name: No Algolia crawler secrets
        if: env.ALGOLIA_CRAWLER_ID == '' || env.ALGOLIA_CRAWLER_USER_ID == '' || env.ALGOLIA_CRAWLER_API_KEY == ''
        run: echo "::notice::Some ALGOLIA_CRAWLER_* secrets are missing, no crawl started (the crawler's daily one still runs). See website/README.md"
      # https://www.algolia.com/doc/rest-api/crawler/start-reindex
      - name: Start a crawl
        if: env.ALGOLIA_CRAWLER_ID != '' && env.ALGOLIA_CRAWLER_USER_ID != '' && env.ALGOLIA_CRAWLER_API_KEY != ''
        run: |
          curl --fail-with-body --silent --show-error --retry 3 -X POST \
            --user "$ALGOLIA_CRAWLER_USER_ID:$ALGOLIA_CRAWLER_API_KEY" \
            "https://crawler.algolia.com/api/1/crawlers/$ALGOLIA_CRAWLER_ID/reindex"
