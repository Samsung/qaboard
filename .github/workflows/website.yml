name: Website

# Builds the docs website on pull requests (the build fails on broken links, unknown shot ids, wrong stack tabs and
# missing repository files), and from master deploys it to GitHub Pages and updates its Algolia search index.
# Needs Settings > Pages > Source: GitHub Actions. The index needs the ALGOLIA_WRITE_API_KEY secret, see
# website/search/algolia_index.py: without it, the site still deploys.
on:
  push:
    branches: [master]
    # with the files the docs show (<RepoFile>) or check
    paths: [website/**, charts/qaboard/**, deployments/quickstart/**, examples/**, docs-media/shots.yaml, docs-media/standins/**, qaboard/schemas/**, .github/workflows/website.yml]
  pull_request:
    paths: [website/**, charts/qaboard/**, deployments/quickstart/**, examples/**, docs-media/shots.yaml, docs-media/standins/**, qaboard/schemas/**, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: website/yarn.lock
      - uses: astral-sh/setup-uv@v6
      # The GitHub Actions workflows the docs show (no CI of ours runs them)
      - name: Lint the docs' GitHub Actions examples
        run: |
          docs-media/install-tools.sh actionlint
          ~/.cache/qaboard-docs-media/bin/actionlint website/snippets/ci/github-actions*.yml
      - name: Build website
        working-directory: website
        run: |
          yarn install --frozen-lockfile
          yarn build
      # On every build, so pull requests that break the extraction fail here, not after the deploy
      - name: Extract the search records
        run: uv run website/search/algolia_index.py records website/build --out search-records.json
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build
      - name: Upload the search records
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: search-records
          path: search-records.json
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  search-index:
    name: Update the search index
    # After the deploy: the search results link to the pages that are live
    needs: deploy
    runs-on: ubuntu-latest
    # One update at a time: they replace the same index
    concurrency:
      group: algolia-index
      cancel-in-progress: false
    env:
      ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
    steps:
      - name: No ALGOLIA_WRITE_API_KEY secret
        if: env.ALGOLIA_WRITE_API_KEY == ''
        run: echo "::notice::No ALGOLIA_WRITE_API_KEY secret, the search index isn't updated. See website/search/algolia_index.py"
      - uses: actions/checkout@v4
        if: env.ALGOLIA_WRITE_API_KEY != ''
        with:
          sparse-checkout: website/search
      - uses: astral-sh/setup-uv@v6
        if: env.ALGOLIA_WRITE_API_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.ALGOLIA_WRITE_API_KEY != ''
        with:
          name: search-records
      - name: Replace the index
        if: env.ALGOLIA_WRITE_API_KEY != ''
        run: uv run website/search/algolia_index.py push search-records.json
