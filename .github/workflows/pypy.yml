# Publishes the qaboard CLI to PyPI when a GitHub release is created
# 1. Bump the version in pyproject.toml and qaboard/__init__.py
# 2. Create a release (e.g. tag v1.1.0)
#
# Authentication: PyPI trusted publishing (https://docs.pypi.org/trusted-publishers/),
# configure it on PyPI for this repository and the "pypy.yml" workflow.
# Without it, set a PYPI_API_TOKEN secret (a PyPI API token, starts with "pypi-").
name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for trusted publishing
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.11'
    - name: Check the release tag matches the version
      run: |
        version=$(uv version --short)
        tag="${GITHUB_REF_NAME#v}"
        if [ "$version" != "$tag" ]; then
          echo "::error::The release tag ($GITHUB_REF_NAME) does not match the version in pyproject.toml ($version)"
          exit 1
        fi
    - name: Build
      run: uv build
    - name: Check the wheel installs and runs
      run: |
        uv venv /tmp/venv
        uv pip install --python /tmp/venv dist/*.whl
        QA_NO_CHECK_FOR_UPDATES=1 /tmp/venv/bin/qa --help > /dev/null
    - name: Publish
      env:
        # Empty without the secret: uv then uses trusted publishing
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: uv publish
