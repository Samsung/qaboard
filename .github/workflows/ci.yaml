---
# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
# - python, webapp, docker, helm and helm-e2e run in parallel
# - Docker layers are cached in the GitHub Actions cache: unchanged images build in seconds
# - The images are built once, tested (smoke tests, backend unit tests, a zero-downtime rolling deploy; the helm chart
#   on kind, with a real `qa batch`), and published to the GitHub container registry, ghcr.io/<owner>/qaboard
#   (no secret needed: GITHUB_TOKEN). The official repository publishes to ghcr.io/samsung/qaboard, the default
#   of docker-compose.yml and of the chart; forks publish to their own namespace.
#   - on master: <service>-<commit> once built and tested, then <service> (latest) once every job passed
#   - on releases: <service>-<version> (e.g. backend-1.2.0) once every job passed
#   Docker Hub is an optional mirror (arthurflam/qaboard), when the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are set.
# - Then the helm chart is published to oci://ghcr.io/<owner>/charts/qaboard, see publish-chart
# - Which jobs run (docs/ci.md): the changes job decides, with .github/scripts/ci_changes.py (the mapping of
#   files to jobs). Pushes to master, releases and workflow_dispatch run every job. Branches and pull requests run
#   the jobs whose inputs changed; the end-to-end jobs (quickstart, helm-e2e, kubernetes-runner-e2e) only for changes
#   to what they protect, or with the run-e2e label. Docs alone run none, except the release notes (the web app
#   bundles them). ci-ok is the one check branch protection requires: skipped jobs pass it, failed ones fail it.
name: CI
# Every push to a branch runs CI. Pull requests only do for forks: for our branches it would run twice.
# No `paths:` filter: a workflow that doesn't start never reports ci-ok, and the required check would wait forever
on:
  push:
    # Not tags: releases run CI with the `release` event
    branches: ['**']
  pull_request:
    # labeled: the run-e2e label on a fork's pull request starts its end-to-end jobs (ours: see the changes job)
    types: [opened, synchronize, reopened, labeled]
  # Publishing a GitHub release (tag v1.2.0, see pypy.yml) tests its commit again, then publishes its images
  release:
    types: [published]
  workflow_dispatch:

# A new push cancels the outdated CI of the branch (but every commit on master and every release is published)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.event_name != 'release' }}

permissions:
  contents: read

env:
  # The optional mirror on Docker Hub
  DOCKERHUB_IMAGE: arthurflam/qaboard

jobs:
  # Which jobs this push or pull request needs, and why (in the run's summary): .github/scripts/ci_changes.py.
  # A push to a branch reads the run-e2e label of its pull request when it starts: after adding the label, re-run
  # this workflow (or push again).
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels of the branch's pull request
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      python: ${{ steps.changes.outputs.python }}
      webapp: ${{ steps.changes.outputs.webapp }}
      docker: ${{ steps.changes.outputs.docker }}
      helm: ${{ steps.changes.outputs.helm }}
      quickstart: ${{ steps.changes.outputs.quickstart }}
      helm-e2e: ${{ steps.changes.outputs.helm-e2e }}
      kubernetes-runner-e2e: ${{ steps.changes.outputs.kubernetes-runner-e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
          # the history, without the files' contents: to compare with master
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@v10.3.3
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project .github/scripts/ci_changes.py --github

  python:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.14: the Python of the images (the backend imports qaboard, backend/Dockerfile), 3.11: the oldest qaboard supports
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
          # the history, without the files' contents: to check the migrations against master's
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install dependencies
        # 3.14 also gets the runners' optional dependencies, so their tests run; 3.11 checks qa works without them
        run: uv sync --locked --extra dev ${{ matrix.python == '3.14' && '--extra celery --extra dask --extra kubernetes --extra dask-kubernetes --extra mlflow' || '' }}
      - name: Lint with flake8
        # syntax errors, undefined names, unused imports and variables (see .flake8)
        run: uv run --no-sync flake8 backend qaboard --count --show-source --statistics
      - name: Type Checks with MyPy
        run: uv run --no-sync mypy -p qaboard --ignore-missing-imports
      - name: Release notes
        # valid frontmatter and docs links, and notes being written short enough to read (see CLAUDE.md)
        if: matrix.python == '3.11'
        run: uv run website/release-notes/release_notes.py check --strict
      - name: backend/uv.lock is up to date
        # uv sync --locked above only checks uv.lock; a version bump can leave backend/uv.lock behind
        if: matrix.python == '3.11'
        run: uv lock --check --directory backend
      - name: Merged migrations are never changed
        # databases record the migrations they ran by id: a changed one doesn't run again where it already ran
        if: matrix.python == '3.11' && github.event_name != 'release'
        env:
          # on master, what this push added; elsewhere, what the branch adds to master
          BASE: ${{ github.ref == 'refs/heads/master' && github.event.before || format('origin/{0}', github.base_ref || 'master') }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          .github/scripts/check_migrations.py "$BASE"
      - name: Unit Tests
        run: |
          # git is needed in the tests and setup to fail if not setup
          git config --global user.name "Arthur Flam"
          git config --global user.email "arthur.flam@samsung.com"
          uv run --no-sync green -vvv --quiet-stdout tests
      # Same build as the PyPI publish workflow (pypy.yml)
      - name: Build the package
        if: matrix.python == '3.11'
        run: |
          uv build
          uvx twine check dist/*

  webapp:
    runs-on: ubuntu-24.04 # playwright 1.56 has no chromium for ubuntu 26.04
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      # The docker image builds it again, but this takes seconds and fails faster
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: webapp/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # pushes the images to ghcr.io
    env:
      # Small uwsgi pools: the runner has 4 CPUs
      QABOARD_UWSGI_PROCESSES: "2"
      QABOARD_UWSGI_CHEAPER: "1"
      QABOARD_UWSGI_CHEAPER_INITIAL: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - name: Version
        run: |
          echo "QABOARD_VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          # The image names in docker-compose.yml. They must be lowercase, unlike some owners
          echo "QABOARD_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qaboard" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          # One cache scope per image, or they overwrite each other.
          # The labels link the published images to this repository on GitHub, and to their commit
          # (docs-media/snapshot.py records it as the demo data's app version).
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            website.cache-from=type=gha,scope=website
            website.cache-to=type=gha,scope=website,mode=max
            proxy.cache-from=type=gha,scope=proxy
            proxy.cache-to=type=gha,scope=proxy,mode=max
            cantaloupe.cache-from=type=gha,scope=cantaloupe
            cantaloupe.cache-to=type=gha,scope=cantaloupe,mode=max
      - name: Deploy
        # Silent runs fail after a minute, not 15: the end-to-end test of uploads kills one (.env: see docker-compose.yml).
        # It also starts a batch from the web app: the server runs it in its container only when asked to (local runner)
        run: |
          echo "QABOARD_SILENT_RUN_TIMEOUT_MINUTES=1" >> .env
          echo "QABOARD_TUNING_RUNNER=local" >> .env
          ./deployments/deploy.py deployments/production.env up --no-pull --init
      - name: Smoke Test @app
        run: curl -sSf --retry 10 --retry-all-errors --retry-delay 3 http://localhost:5151/ | grep -q 'id="root"'
      - name: Smoke Test @api
        run: |
          curl -sSf --retry 20 --retry-all-errors --retry-delay 3 http://localhost:5151/api/v1/health
          curl -sSf http://localhost:5151/api/v1/projects > /dev/null
          curl -sSf http://localhost:5151/api/v1/config > /dev/null
          curl -sSf --retry 5 --retry-delay 2 http://localhost:5151/docs/ > /dev/null
      - name: Backend unit tests
        # The database tests (e.g. the metrics' aggregation) use temporary tables in transactions they roll back
        run: >-
          ./deployments/deploy.py deployments/production.env compose exec -T
          -e QABOARD_TEST_DATABASE_URL=postgresql://qaboard:password@db:5432/qaboard
          backend python -m pytest -q -p no:cacheprovider tests
      - name: Backend integration tests
        # The real app, without mocks, in a database the tests create and drop (see backend/integration_tests/conftest.py)
        run: >-
          ./deployments/deploy.py deployments/production.env compose exec -T
          -e BACKEND_TEST_MODE=no-mock
          -e QABOARD_TEST_DATABASE_URL=postgresql://qaboard:password@db:5432/qaboard
          backend python -m pytest -q -p no:cacheprovider integration_tests
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Results sent over HTTP, end to end
        # This server has docker-compose.yml's defaults, no site overlay: it must take uploaded files. `qa upload` and
        # qaboard.start_run() from this checkout send runs, checked through nginx, the backend and the image server
        run: >-
          uv run --frozen python .github/scripts/uploads_e2e.py http://localhost:5151 --silent-runs-after 1
          --create-admin './deployments/deploy.py deployments/production.env compose exec -T backend qaboard-admin create-admin {user} --password'
      - name: Zero-downtime rolling deploy
        run: |
          # A "new version" with the same images: the backend replicas are replaced
          for service in backend frontend website proxy cantaloupe; do
            docker tag "$QABOARD_IMAGE:$service-$QABOARD_VERSION" "$QABOARD_IMAGE:$service-$QABOARD_VERSION-next"
          done
          export STOP_FILE=/tmp/deployed
          .github/scripts/load.py http://localhost:5151/api/v1/health 300 POST 405 &
          load=$!
          sleep 5
          QABOARD_VERSION="$QABOARD_VERSION-next" ./deployments/deploy.py deployments/production.env up --no-pull
          sleep 5 && touch "$STOP_FILE"
          wait $load
      - name: Logs on failure
        if: failure()
        run: |
          ./deployments/deploy.py deployments/production.env status
          ./deployments/deploy.py deployments/production.env compose logs --tail 200 backend proxy
          # nginx logs to files (services/nginx/nginx.conf.template): why requests failed, and which replica they went to
          ./deployments/deploy.py deployments/production.env compose exec -T proxy tail -n 50 /tmp/error.log || true
      # As <service>-<commit>: publish-docker-images tags them as latest, or with the release's version, once every job passed
      - name: Push the images
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose push backend frontend website proxy cantaloupe
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are not set, not mirroring the images to Docker Hub"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for service in backend frontend website proxy cantaloupe; do
            docker tag "$QABOARD_IMAGE:$service-$QABOARD_VERSION" "$DOCKERHUB_IMAGE:$service-$QABOARD_VERSION"
            docker push "$DOCKERHUB_IMAGE:$service-$QABOARD_VERSION"
          done

  # The development setup of CONTRIBUTING.md starts: development.yml isn't used anywhere else in CI (#140).
  # On master only, and not needed to publish the images: a broken dev setup doesn't block a release.
  dev-server:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.mode == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Start the development setup
        run: |
          (cd webapp && npm ci --no-audit --no-fund)
          docker compose -f docker-compose.yml -f development.yml up -d --build db redis rabbitmq backend frontend
      - name: The development backend and frontend answer
        run: |
          curl -sSf --retry 60 --retry-all-errors --retry-delay 5 http://localhost:5152/api/v1/health
          curl -sSf --retry 30 --retry-all-errors --retry-delay 5 http://localhost:3000/ > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f development.yml logs --tail 100 backend frontend

  helm:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Lint and validate the chart
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm lint charts/qaboard -f charts/qaboard/ci/minimal.yaml
          helm lint charts/qaboard -f charts/qaboard/quickstart.yaml
          for values in charts/qaboard/ci/*.yaml charts/qaboard/quickstart.yaml; do
            echo "--- $values"
            helm template qaboard charts/qaboard -f "$values" | ./kubeconform -strict -summary -ignore-missing-schemas
          done

  # The Docker Compose quickstart (deployments/quickstart/compose.yml, website/docs/get-started/quickstart.mdx), with
  # the images of this run. Its demo data is the seeder's test story, built into a demo-data image like the docs' demo
  # snapshot is (that one is in a private bucket: .github/workflows/docs-media.yml tests it the same way).
  quickstart:
    runs-on: ubuntu-24.04 # playwright 1.56 has no chromium for ubuntu 26.04
    needs: changes
    if: needs.changes.outputs.quickstart == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            docs-media/*.py
            .github/scripts/*.py
            uv.lock
      - name: Version
        run: |
          echo "QABOARD_VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "QABOARD_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qaboard" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # The images of the docker job, from its layer cache
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: backend,frontend,proxy,cantaloupe
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            proxy.cache-from=type=gha,scope=proxy
            cantaloupe.cache-from=type=gha,scope=cantaloupe
      - name: Demo data
        run: .github/scripts/demo_data_fixture.sh "$QABOARD_IMAGE:demo-data-$QABOARD_VERSION"
      # The quickstart's commands, with the images built above
      - name: Quickstart
        run: |
          # Users get the official images
          env -u QABOARD_IMAGE -u QABOARD_VERSION docker compose -f deployments/quickstart/compose.yml config --images | tee /tmp/images.txt
          if grep -v -e '^ghcr.io/samsung/qaboard:' -e '^postgres:' -e '^redis:' /tmp/images.txt; then
            echo "::error::deployments/quickstart/compose.yml must use the official images by default"
            exit 1
          fi
          mkdir -p /tmp/qaboard
          cp deployments/quickstart/compose.yml /tmp/compose.yml
          cd /tmp
          start=$SECONDS
          docker compose up -d --wait
          echo "docker compose up took $((SECONDS - start))s"
      - name: Check the demo data
        run: |
          uvx --from playwright==1.56.0 playwright install --with-deps chromium
          uv run .github/scripts/demo_data_e2e.py http://localhost:5151
      - name: Start again
        run: |
          # The demo data is restored once
          cd /tmp
          docker compose down
          docker compose up -d --wait
          docker compose logs demo-data | tee /tmp/demo-data.log
          grep -q "The database already has QA-Board tables" /tmp/demo-data.log
          grep -q "The results are already in" /tmp/demo-data.log
          uv run "$GITHUB_WORKSPACE/.github/scripts/demo_data_e2e.py" http://localhost:5151 --no-browser
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -p qaboard-demo ps -a || true
          docker compose -p qaboard-demo logs --tail 100 backend || true
          cd /tmp
          docker compose ps -a || true
          docker compose logs --tail 200 || true

  # The helm chart installed for real, on a kind cluster, with the images of this run: the quickstart's commands
  # (website/docs/get-started/quickstart.mdx), with demo data (see the quickstart job), a `qa batch` in the cluster,
  # then an upgrade
  helm-e2e:
    runs-on: ubuntu-24.04 # playwright 1.56 has no chromium for ubuntu 26.04
    needs: changes
    if: needs.changes.outputs.helm-e2e == 'true'
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.32.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - name: Version
        run: |
          echo "QABOARD_VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "QABOARD_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qaboard" >> "$GITHUB_ENV"
      - name: Make room on the disk
        # The images are stored up to 3 times at once (docker, kind's archive, the node), the runner's disk is small
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v4
      # The images of the docker job, from its layer cache. The first time a Dockerfile changes, they are built in parallel.
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            website.cache-from=type=gha,scope=website
            proxy.cache-from=type=gha,scope=proxy
            cantaloupe.cache-from=type=gha,scope=cantaloupe
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            docs-media/*.py
            .github/scripts/*.py
            uv.lock
      # quickstart.yaml restores the demo data, from the demo-data image of this version
      - name: Demo data
        run: .github/scripts/demo_data_fixture.sh "$QABOARD_IMAGE:demo-data-$QABOARD_VERSION"
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Install kind
        run: |
          curl -sSfLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          sudo install kind /usr/local/bin/ && rm kind
          kind version && kubectl version --client
      # The quickstart's commands, with the images built above instead of the published ones (no registry: they are
      # loaded in the node, and the chart's image.pullPolicy is IfNotPresent)
      - name: Quickstart
        run: |
          mkdir -p /tmp/qaboard
          kind create cluster --name qaboard --config charts/qaboard/kind.yaml
          docker buildx prune --all --force > /dev/null
          images=()
          for service in backend frontend website proxy cantaloupe demo-data; do images+=("$QABOARD_IMAGE:$service-$QABOARD_VERSION"); done
          kind load docker-image --name qaboard "${images[@]}"
          docker image rm "${images[@]}" > /dev/null
          # Helm 4.2.1 waited out the full --timeout after deleting hooks, then reported success anyway
          # (https://github.com/helm/helm/issues/32214): an install of a few minutes took 30. Fail instead.
          start=$SECONDS
          # helm_e2e.py starts batches from the web app on the backend: the local runner, off by default
          helm install qaboard charts/qaboard -f charts/qaboard/quickstart.yaml --wait --timeout 15m \
            --set image.repository="$QABOARD_IMAGE" --set-string image.version="$QABOARD_VERSION" --set config.QABOARD_TUNING_RUNNER=local
          echo "helm install took $((SECONDS - start))s"
          if [ $((SECONDS - start)) -gt 600 ]; then
            echo "::error::helm install took over 10 minutes: is helm waiting out its timeout (helm/helm#32214)?"
            exit 1
          fi
          kubectl port-forward svc/qaboard-proxy 5151:80 > /tmp/port-forward.log 2>&1 &
      - name: Smoke tests
        run: |
          # The migrations Job ran (helm deletes it once it succeeded)
          for _ in 1 2 3 4 5; do
            kubectl get events --field-selector involvedObject.name=qaboard-migrations > /tmp/migrations.txt
            grep -q Completed /tmp/migrations.txt && break
            sleep 2
          done
          cat /tmp/migrations.txt
          if ! grep -q Completed /tmp/migrations.txt; then
            echo "::error::No event says the migrations Job completed"
            exit 1
          fi
          curl -sSf --retry 10 --retry-all-errors --retry-delay 3 http://localhost:5151/api/v1/health
          curl -sSf http://localhost:5151/api/v1/projects > /dev/null
          curl -sSf http://localhost:5151/ | grep -q 'id="root"'
          curl -sSf http://localhost:5151/docs/ > /dev/null
      - name: Check the demo data
        run: |
          kubectl logs deploy/qaboard-backend -c demo-data
          uvx --from playwright==1.56.0 playwright install --with-deps chromium
          uv run .github/scripts/demo_data_e2e.py http://localhost:5151
      # A CI pipeline's `qa batch` in the cluster, then a batch started from the web app for a project without a shared
      # storage, on the backend: it reaches QA-Board at QABOARD_HOST, its runs send their results with a token
      - name: qa batch in the cluster
        run: uv run --frozen python .github/scripts/helm_e2e.py http://localhost:5151
      # The same release again: the migrations run again (pre-upgrade), nothing else may change
      - name: helm upgrade
        run: |
          revision() { kubectl get deploy qaboard-backend qaboard-proxy -o jsonpath='{.items[*].metadata.annotations.deployment\.kubernetes\.io/revision}'; }
          before=$(revision)
          start=$SECONDS
          helm upgrade qaboard charts/qaboard -f charts/qaboard/quickstart.yaml --wait --timeout 15m \
            --set image.repository="$QABOARD_IMAGE" --set-string image.version="$QABOARD_VERSION" --set config.QABOARD_TUNING_RUNNER=local
          echo "helm upgrade took $((SECONDS - start))s"
          helm history qaboard
          if [ $((SECONDS - start)) -gt 600 ]; then
            echo "::error::helm upgrade took over 10 minutes: is helm waiting out its timeout (helm/helm#32214)?"
            exit 1
          fi
          if [ "$(revision)" != "$before" ]; then
            echo "::error::A no-op helm upgrade restarted pods: a template renders differently each time"
            exit 1
          fi
          curl -sSf --retry 10 --retry-all-errors --retry-delay 3 http://localhost:5151/api/v1/health
          # The results are still there, and the demo data
          curl -sSf "http://localhost:5151/api/v1/commit/$GITHUB_SHA?project=user/sample_project" > /dev/null
          uv run .github/scripts/demo_data_e2e.py http://localhost:5151 --no-browser
      # runners.kubernetes: batches started from the web app run `qa batch` in a driver pod, which starts the runs' Jobs.
      # Without a shared storage: the pods fetch the commit's artifacts and send their results and the driver's log
      - name: Batches started from the web app on Kubernetes
        run: |
          helm upgrade qaboard charts/qaboard -f charts/qaboard/quickstart.yaml --wait --timeout 15m \
            --set image.repository="$QABOARD_IMAGE" --set-string image.version="$QABOARD_VERSION" \
            --set runners.kubernetes.enabled=true --set 'runners.kubernetes.namespaces={default}' \
            --set-string runners.kubernetes.runAs=1000:1000
          pkill -f 'kubectl port-forward' || true
          kubectl port-forward svc/qaboard-proxy 5151:80 >> /tmp/port-forward.log 2>&1 &
          curl -sSf --retry 10 --retry-all-errors --retry-delay 3 http://localhost:5151/api/v1/health
          uv run --frozen python .github/scripts/helm_e2e.py http://localhost:5151 --kubernetes
      - name: Cluster state on failure
        # also when the job's timeout cancels it
        if: failure() || cancelled()
        run: |
          set +e
          df -h /
          helm status qaboard && helm history qaboard
          kubectl get all,pvc,jobs -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -60
          kubectl describe pods | grep -v -E '^\s+(Limits|Requests|cpu|memory):'
          for pod in $(kubectl get pods -o name); do
            echo "::group::Logs of $pod"
            kubectl logs "$pod" --all-containers --prefix --tail 200
            kubectl logs "$pod" --all-containers --prefix --previous --tail 50 2> /dev/null
            echo "::endgroup::"
          done
          cat /tmp/port-forward.log

  # The kubernetes runner for real, on a kind cluster, without a QA-Board server: `qa batch --runner kubernetes`
  # in a folder the node mounts at the same path, stopping a batch, submit_detached, the doctor's test job
  kubernetes-runner-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kubernetes-runner-e2e == 'true'
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.32.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install kind
        run: |
          curl -sSfLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          sudo install kind /usr/local/bin/ && rm kind
          kind version && kubectl version --client
      - name: qa batch on kind
        run: |
          uv sync --locked --extra kubernetes
          python3 .github/scripts/kubernetes_runner_e2e.py --python "$PWD/.venv/bin/python"

  # The one check branch protection requires (docs/ci.md): it passes when every job passed or wasn't needed,
  # and fails when one failed or was cancelled, or when `changes` didn't decide. Our branches' pull requests run CI on
  # push: their pull_request run skips every job, and reports under another name, never standing for the push's ci-ok.
  ci-ok:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'ci-ok (CI runs on push)' || 'ci-ok' }}
    runs-on: ubuntu-latest
    # Also when a job failed or the run was cancelled: a skipped ci-ok would pass the required check
    if: always()
    timeout-minutes: 5
    needs: [changes, python, webapp, docker, helm, quickstart, helm-e2e, kubernetes-runner-e2e]
    steps:
      - name: Every job passed or wasn't needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUSH_RUNS_CI: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if [ "$PUSH_RUNS_CI" = true ]; then
            echo "A pull request from a branch of this repository: the push's CI run reports ci-ok"
            exit 0
          fi
          if ! jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job failed or was cancelled, or the changes job didn't decide which jobs run"
            exit 1
          fi

  # The images are only "latest" once everything passed. A release's images get its version.
  # On master and releases, the changes job runs every job: this waits for all of them (a skipped one would skip it).
  publish-docker-images:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'release'
    timeout-minutes: 15
    needs: [python, webapp, docker, helm, helm-e2e, quickstart]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tag the images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # master: <service> (latest). A release (tag v1.2.0): <service>-1.2.0
          suffix=""
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::The release's tag ($GITHUB_REF_NAME) is not a version like v1.2.0"
              exit 1
            fi
            suffix="-$version"
          fi
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          images=("ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qaboard")
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            images+=("$DOCKERHUB_IMAGE")
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are not set, not mirroring the images to Docker Hub"
          fi
          # Retags in the registry, nothing is rebuilt or uploaded again
          for image in "${images[@]}"; do
            for service in backend frontend website proxy cantaloupe; do
              docker buildx imagetools create -t "$image:$service$suffix" "$image:$service-${GITHUB_SHA::8}"
            done
          done
          # The demo data of the quickstarts (demo-data<suffix>, which compose.yml and the chart's demoData use) is
          # built by .github/workflows/docs-media.yml: from master as demo-data, from release tags as demo-data-<version>.
          # Every version gets one: master's commits and releases it didn't build for get the latest one.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qaboard"
          target="$image:demo-data${suffix:--${GITHUB_SHA::8}}"
          if docker buildx imagetools inspect "$target" > /dev/null 2>&1; then
            echo "$target exists"
          elif docker buildx imagetools inspect "$image:demo-data" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$target" "$image:demo-data"
          else
            echo "::warning::No $image:demo-data yet: run the Docs media workflow on master to publish the quickstarts' demo data"
          fi

  # The helm chart, as an OCI artifact: helm install qaboard oci://ghcr.io/<owner>/charts/qaboard
  # - A release (tag v1.2.0) publishes the chart 1.2.0, whose images are <service>-1.2.0.
  # - master publishes a development version after the latest release (pyproject.toml's version, e.g. 1.2.0):
  #   1.2.1-dev.<CI run number>, whose images are <service>-<commit>. As a SemVer pre-release, it never overwrites
  #   a release, and helm ignores it unless asked for it (--devel, or --version 1.2.1-dev.42).
  publish-chart:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'release'
    timeout-minutes: 10
    needs: [publish-docker-images]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # no step pushes
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${GITHUB_REF_NAME#v}"
            app_version="$version"
          else
            released=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            IFS=. read -r major minor patch <<< "${released%%[-+]*}"
            version="$major.$minor.$((patch + 1))-dev.$GITHUB_RUN_NUMBER"
            app_version="${GITHUB_SHA::8}"
          fi
          # The chart defaults to the images published with it: ghcr.io/samsung/qaboard, or a fork's
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qaboard"
          sed -i "s#^  repository: ghcr.io/samsung/qaboard\$#  repository: $image#" charts/qaboard/values.yaml
          grep -q "^  repository: $image\$" charts/qaboard/values.yaml
          helm package charts/qaboard --version "$version" --app-version "$app_version" --destination dist
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/qaboard-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "::notice::Published the chart oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/qaboard --version $version (images $image:<service>-$app_version)"
