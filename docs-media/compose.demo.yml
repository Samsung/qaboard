# The demo stack the docs' screenshots are taken from: an overlay on the root docker-compose.yml.
# Usually started by docs-media/seed.py or docs-media/snapshot.py (see docs-media/README.md), or by hand:
#
#   docker compose -f docker-compose.yml -f docs-media/compose.demo.yml up -d --wait
#
# - The web app is at http://localhost:5151 (QABOARD_DEMO_PORT).
# - Images: ${QABOARD_IMAGE}:<service>. The scripts default QABOARD_IMAGE to ghcr.io/<owner>/qaboard with the GitHub
#   repository's owner in CI (GITHUB_REPOSITORY_OWNER), so forks use the images they publish; else to the root
#   docker-compose.yml's default, the official ghcr.io/samsung/qaboard. QABOARD_VERSION picks a release.
#   QABOARD_DEMO_<SERVICE>_IMAGE replaces one service's image, e.g. a web app built from a branch:
#   QABOARD_DEMO_FRONTEND_IMAGE=qaboard-demo-local:frontend-<sha> (also BACKEND, PROXY, CANTALOUPE).
# - Results: the `qa` CLI runs on the host and tells the server where it saved its results, so everything sees the
#   results storage at the same absolute path, QABOARD_DEMO_RESULTS (default /mnt/qaboard): read-write in the
#   backend, read-only in nginx (/s/<path>) and Cantaloupe (/iiif/2/<path>).
# - Not started: rabbitmq, flower, website, pgadmin (no task queue, docs or admin UI in the demo).
# - *.kitefin.example: the demo world's hosts (examples/README.md), answered by a stub, e.g. the webhook
#   integrations the backend calls.
name: qaboard-demo

services:
  db:
    # pg_dump/psql run in this container (docker compose exec db ...)
    logging: {driver: none}

  backend:
    image: "${QABOARD_DEMO_BACKEND_IMAGE:-${QABOARD_IMAGE:-ghcr.io/samsung/qaboard}:backend${QABOARD_VERSION:+-$QABOARD_VERSION}}"
    # Not the repository's .env: it may hold another deployment's secrets
    env_file: !reset []
    environment:
      - QABOARD_STORAGE_ROOTS=${QABOARD_DEMO_RESULTS:-/mnt/qaboard}
      - QABOARD_URL=http://localhost:${QABOARD_DEMO_PORT:-5151}
      # Runs started from the web app (Run Tests, tuning) run in the backend's container
      - QABOARD_TUNING_RUNNER=local
    volumes:
      - ${QABOARD_DEMO_RESULTS:-/mnt/qaboard}:${QABOARD_DEMO_RESULTS:-/mnt/qaboard}

  proxy:
    image: "${QABOARD_DEMO_PROXY_IMAGE:-${QABOARD_IMAGE:-ghcr.io/samsung/qaboard}:proxy${QABOARD_VERSION:+-$QABOARD_VERSION}}"
    depends_on: !override [backend, cantaloupe]
    ports: !override
      - ${QABOARD_DEMO_PORT:-5151}:80
    volumes:
      - ${QABOARD_DEMO_RESULTS:-/mnt/qaboard}:/var/qaboard${QABOARD_DEMO_RESULTS:-/mnt/qaboard}:ro

  cantaloupe:
    image: "${QABOARD_DEMO_CANTALOUPE_IMAGE:-${QABOARD_IMAGE:-ghcr.io/samsung/qaboard}:cantaloupe${QABOARD_VERSION:+-$QABOARD_VERSION}}"
    # Only the results, not the host's / like the root docker-compose.yml
    volumes: !override
      - cache_cantaloupe:/var/cache/cantaloupe
      - /srv/cantaloupe
      - ${QABOARD_DEMO_RESULTS:-/mnt/qaboard}:/repository${QABOARD_DEMO_RESULTS:-/mnt/qaboard}:ro
    environment:
      CANTALOUPE_MEM_START: 256m
      CANTALOUPE_MEM_MAX: 2g

  # Answers every request to the demo world's hosts with a small JSON (docs-media/demo/kitefin_stub.py)
  kitefin-stub:
    image: "${QABOARD_DEMO_BACKEND_IMAGE:-${QABOARD_IMAGE:-ghcr.io/samsung/qaboard}:backend${QABOARD_VERSION:+-$QABOARD_VERSION}}"
    entrypoint: ["python", "/stub/kitefin_stub.py"]
    volumes:
      - ./docs-media/demo/kitefin_stub.py:/stub/kitefin_stub.py:ro
    networks:
      default:
        aliases:
          - kitefin.example
          - git.kitefin.example
          - ci.kitefin.example
          - docs.kitefin.example
          - wiki.kitefin.example
          - tuning-bench.kitefin.example
          - bench.kitefin.example
          # nginx resolves the hosts of its proxy_pass at startup, and conf.d/qaboard.conf has /flower/.
          # Flower isn't part of the demo: this name only lets nginx start (/flower/ answers 502).
          - flower
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: "${QABOARD_DEMO_FRONTEND_IMAGE:-${QABOARD_IMAGE:-ghcr.io/samsung/qaboard}:frontend${QABOARD_VERSION:+-$QABOARD_VERSION}}"
    # Copies the web app's build in the frontend_builds volume, then exits
    restart: "no"

  rabbitmq: {profiles: [not-in-demo]}
  flower: {profiles: [not-in-demo]}
  website: {profiles: [not-in-demo]}
  pgadmin: {profiles: [not-in-demo]}
