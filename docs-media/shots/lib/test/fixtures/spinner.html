<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture: spinner</title>
  <style>
    body { margin: 0; padding: 24px; font-family: Roboto, sans-serif; }
    .bp6-spinner { width: 50px; height: 50px; border-radius: 50%; border: 5px solid #d3d8de; border-top-color: #2d72d2; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .masked .bp6-spinner { border-top-color: #cd4246; }
  </style>
</head>
<body>
  <div id="loading" class="bp6-spinner"></div>
  <div id="content" hidden>Loaded</div>
  <div id="running" class="masked"><div class="bp6-spinner"></div> a batch still running</div>
  <!-- a run's status while it runs: never waited for -->
  <span aria-label="Running"><div class="bp6-spinner" style="width: 12px; height: 12px"></div></span>
  <script>
    // a spinner while a slow request is in flight, then a second request, like a page loading its data
    window.__start = Date.now();
    setTimeout(async () => {
      await fetch('/api/slow?ms=700');
      await fetch('/api/slow?ms=300');
      document.getElementById('loading').remove();
      document.getElementById('content').hidden = false;
      window.__loadedAt = Date.now();
    }, 200);
  </script>
</body>
</html>
