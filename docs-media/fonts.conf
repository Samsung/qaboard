<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The only fonts captures see (FONTCONFIG_FILE=docs-media/fonts.conf, set by shots/playwright.config.ts and
  tapes/record.py): the host's own configuration and fonts never change a screenshot. Only these folders are read
  (no <selectfont>: Chromium's own fontconfig then finds no font at all).
  Packages (Ubuntu 24.04): fonts-roboto fonts-dejavu-core fonts-noto-color-emoji fonts-jetbrains-mono
  The web app's font stack starts with -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto: Chromium asks fontconfig
  for each name, and accepts strong aliases, so the macOS/Windows names and sans-serif all resolve to Roboto.
  shots/lib/capture.setup.ts checks what Chromium really uses.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <dir>/usr/share/fonts/truetype/jetbrains-mono</dir>
  <cachedir prefix="xdg">qaboard-docs-media-fontconfig</cachedir>

  <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Roboto</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>

  <!-- the same rasterization everywhere: grayscale antialiasing, slight hinting -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
