# The shot list: every screenshot, clip and terminal recording the docs use. See README.md.
#
# Entry fields:
#   id        <area>/<subject>, lowercase kebab-case (README.md#shot-ids)
#   kind      still | clip | tape
#   project   the demo project (examples/<project>), or null
#   shows     what the shot shows: the state of the app and what the reader should notice
#   pages     doc ids that will use it. Existing ids, or ones proposed by the plan's §6, which WS4 may rename (then
#             update them here): get-started/{quickstart,tutorial,concepts}, tour, use-cases/<project>,
#             tutorials/{perf-regression,tuning,quality-gate,self-host}, recipes/<topic>, roadmap.
#             `landing` is the home page (website/src/pages/index).
#   features  web app polish it demonstrates (keys of `features` below); every feature needs at least one shot
#   needs     the story state it depends on (commit ids from examples/<project>/story.yaml), when it matters
#   anchors   names the spec must record with ui.anchor(), because pages use them in <Shot callouts>
#             (the docs build checks callouts against this list, then against the manifest's anchors)
#   phase     1 (vertical slice), 2 or 3
#   status    planned | captured | published | retired
#   experimental  true when it shows an experimental feature

version: 1

features:
  image-synced-zoom: Synced zoom and pan across images, with a crosshair on the others
  image-diff: Perceptual Image Diff with a threshold slider
  pixel-tooltip: Pixel coordinates and values in the new and reference images
  roi-histograms: RGB and luma histograms of a selected region
  auto-roi: Regions of interest, preset and found where images differ most
  image-filters: Brightness, contrast, gamma and sharpen filters on all synced viewers
  deep-zoom: IIIF deep zoom on images over 100 MP
  dynamic-outputs: Dynamic outputs with synced sliders and selects
  plotly-overlay: Plotly plots with the reference overlaid
  flame-diff: Differential flame graphs
  text-diff: Monaco text diff with Next Diff
  video-sync: Videos played in sync with the reference
  pointcloud: Point cloud viewer
  trajectory-6dof: 6DoF trajectories against ground truth
  bit-accuracy-tree: Bit-accuracy tree of output files with in-place diff
  live-log-tail: Live log tail, error count, jump to next error
  lsf-hints: LSF job reports and hints on failed runs
  file-browser: Keyboard-driven file browser
  batch-editor: Monaco batch editor with problems and test listing
  tuning-analysis: Tuning analysis, efficient frontier, convergence
  milestones: Milestones, shared and private
  whats-new: What's new dialog and panel

