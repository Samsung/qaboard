# Completion and checks in your editor: https://samsung.github.io/qaboard/docs/project-init#checking-qaboardyaml-and-batch-files-in-your-editor
# yaml-language-server: $schema=https://samsung.github.io/qaboard/metrics.schema.json
# Optional: QA-Board shows all the metrics your runs return.
# To color improvements and regressions, it needs to know which way is better. Declare it where your code computes
# the metrics, e.g. `return {"loss": qaboard.Metric(loss, smaller_is_better=True)}`, or here.
# Docs: https://samsung.github.io/qaboard/docs/computing-quantitative-metrics
available_metrics:
  # loss:
  #   label: My Loss Function  # defaults to the key
  #   short_label: Loss        # defaults to the label
  #   description: The was computed with.... # optional
  #   smaller_is_better: true  # default in this file. null: neither is better
  #   target: 0.01             # optional
  #   # used for display
  #   scale: 1.0               # default
  #   suffix: %                # default: ''

  is_failed:
    label: Crashed
    short_label: Crashed
    description: This run crashed.
    scale: 100
    suffix: "%"
    target: 0
    smaller_is_better: true
    plot_scale: linear # | default: log


# Below we define which metrics the GUI should show
default_metric: is_failed

# will be shown in the summary histogramms
summary_metrics:
  - is_failed

# will be shown in the results table and in the output cards
main_metrics:
  - is_failed

# In the history view, only those metrics will be available in the plot showing results over time
# [OPTIONAL]: defaults to the summary_metrics
# dashboard_evolution_metrics:
#   - is_failed
# In the history view, only those metrics will be shown in the summary histograms
# [OPTIONAL]: defaults to the summary_metrics
# dashboard_metrics:
#   - is_failed
