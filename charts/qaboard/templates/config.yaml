apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qaboard.fullname" . }}-config
  labels: {{- include "qaboard.labels" . | nindent 4 }}
data:
  FLASK_ENV: production
  QA_NO_CHECK_FOR_UPDATES: "1"
  # Migrations run once in a Job, not in every replica
  QABOARD_RUN_MIGRATIONS: "0"
  UWSGI_PROCESSES: {{ .Values.backend.uwsgi.processes | quote }}
  UWSGI_CHEAPER_ALGO_BUSYNESS: "true"
  UWSGI_CHEAPER: {{ .Values.backend.uwsgi.cheaper | quote }}
  UWSGI_CHEAPER_INITIAL: {{ .Values.backend.uwsgi.cheaperInitial | quote }}
  UWSGI_CHEAPER_OVERLOAD: "15"
  UWSGI_CHEAPER_RSS_LIMIT_SOFT: "17179869184"
  UWSGI_LISTEN_QUEUE_SIZE: "1024"
  {{- $roots := list }}
  {{- if .Values.results.enabled }}{{ $roots = append $roots (include "qaboard.resultsPath" .) }}{{ end }}
  {{- if .Values.demoData.enabled }}{{ $roots = append $roots (include "qaboard.demoDataPath" .) }}{{ end }}
  {{- if and $roots (not (hasKey .Values.config "QABOARD_STORAGE_ROOTS")) }}
  # The results storage (and the demo data's): the backend only writes, deletes or runs code there
  QABOARD_STORAGE_ROOTS: {{ join ":" $roots | quote }}
  {{- end }}
  {{- if and .Values.cantaloupe.enabled (not (hasKey .Values.config "QABOARD_IMAGE_SERVERS")) }}
  # The web app gets image tiles from /iiif/2/<path of the image> (see cantaloupe.yaml)
  QABOARD_IMAGE_SERVERS: '{"default": "/iiif/2/"}'
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
