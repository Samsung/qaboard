{{- if not .Values.secret.existingSecret }}
{{- $name := include "qaboard.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secretKey := .Values.secret.values.SECRET_KEY | default (and $existing (index $existing.data "SECRET_KEY") | default "" | b64dec) | default (randAlphaNum 64) }}
{{- $encryptionKey := .Values.secret.values.QABOARD_ENCRYPTION_KEY | default (and $existing (index $existing.data "QABOARD_ENCRYPTION_KEY") | default "" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "qaboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Kept across upgrades, or everyone would be logged out
  SECRET_KEY: {{ $secretKey | quote }}
  {{- /* the secret wins over `config`: a key set there must not be replaced by a generated one */}}
  {{- if not (hasKey (.Values.config | default dict) "QABOARD_ENCRYPTION_KEY") }}
  # Encrypts the secrets saved in Admin → Settings: kept across upgrades, or they could not be decrypted.
  # Back it up apart from the database (kubectl get secret ... -o jsonpath='{.data.QABOARD_ENCRYPTION_KEY}' | base64 -d)
  QABOARD_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.values }}
  {{- if not (has $key (list "SECRET_KEY" "QABOARD_ENCRYPTION_KEY")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
