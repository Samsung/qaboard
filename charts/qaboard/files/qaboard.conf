# Generated by the helm chart, adapted from services/nginx/conf.d/qaboard.conf
upstream backend {
    include /etc/nginx/upstreams/backend.conf;
}

server {
  server_name _;
  listen 80 default_server;
  absolute_redirect off;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
    # index.html must be revalidated to pick up new deploys
    add_header Cache-Control "no-cache";
  }

  # The webapp's bundles have a hash of their content in their names
  location /assets/ {
    root /builds;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;
    client_max_body_size 0;
  }

  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }

  # Generic file serving - mount your output storage at /var/qaboard (proxy.extraVolumes)
  location ^~ /s/ {
    alias /var/qaboard/;
    autoindex on;
    access_log off;
    include cors;
    gzip_static on;
    gunzip on;
  }
{{- if .Values.cantaloupe.enabled }}

  location /iiif/ {
    include cors;
    proxy_pass http://{{ include "qaboard.fullname" . }}-cantaloupe:8182;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
{{- end }}
{{- if .Values.celery.enabled }}

  location /flower/ {
    proxy_pass http://{{ include "qaboard.fullname" . }}-flower:8888/flower/;
    proxy_set_header Host $host;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
{{- end }}
}
