# Default values for QA-Board. To try it on your laptop: quickstart.yaml. A site's values: deployments/sirc/values.yaml
# Docs: website/docs/backend-admin/kubernetes.mdx (https://samsung.github.io/qaboard/docs/backend-admin/kubernetes)

image:
  # Images are <repository>:<service>-<version> (e.g. ghcr.io/samsung/qaboard:backend-1.2.0), as published by CI:
  # <version> is a release (1.2.0) or a commit on master (1a2b3c4d). See .github/workflows/ci.yaml
  # Forks publish to ghcr.io/<owner>/qaboard, and the charts they publish default to it.
  repository: ghcr.io/samsung/qaboard
  # Default: the chart's appVersion, the release it was published with (`helm show chart` tells it).
  # "latest": the latest images from master (<repository>:<service>), the default of a chart installed from git.
  version: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
#  - name: gitlab-registry

# Non-secret backend settings, see website/docs/start-server.mdx for all the options
config:
  QABOARD_LOGIN_TYPE: LOCAL
  # Admins (user names or emails, comma-separated), whatever the database says. Other settings are in the admin panel
  # QABOARD_ADMINS: alice,bob@example.com
  # GITLAB_HOST: https://gitlab.example.com
  # Git hosts, their tokens are read from the secret (website/docs/backend-admin/git-hosts.mdx)
  # QABOARD_GIT_HOSTS: '[{"type": "github", "url": "https://github.com", "token_env": "GITHUB_ACCESS_TOKEN"}]'
  # QABOARD_LDAP_HOST: ldap.example.com
  # With cantaloupe.enabled, the chart sets QABOARD_IMAGE_SERVERS to '{"default": "/iiif/2/"}'
  # QABOARD_IMAGE_SERVERS: '{"default": "https://iiif.example.com/iiif/2/"}'
  # Where the backend may write, delete or run code. The chart sets it to results.mountPath: set it when you mount
  # other storage (extraVolumeMounts), separated by ":"
  # QABOARD_STORAGE_ROOTS: /mnt/qaboard:/algo
  # The runs' HTML and SVG files can't act as whoever opens them (website/docs/viewers.mdx). The proxy reads it too
  # QABOARD_SANDBOX_HTML: "true"
  # Emails when the batches users start end (website/docs/start-server.mdx#emails). A QABOARD_SMTP_PASSWORD goes in the secret
  # QABOARD_SMTP_HOST: smtp.example.com
  # QABOARD_EMAIL_FROM: QA-Board <qaboard-noreply@example.com>
  # QABOARD_EMAIL_DOMAIN: example.com
  # QABOARD_URL: https://qaboard.example.com
  # Single sign-on with OpenID Connect (website/docs/backend-admin/sign-in.mdx). QABOARD_OIDC_CLIENT_SECRET goes in the secret
  # QABOARD_OIDC_ISSUER: https://keycloak.example.com/realms/company
  # QABOARD_OIDC_CLIENT_ID: qaboard

# The storage where runs save their results (outputs and artifacts), shared by the `qa` CLI and the server.
# Runs tell the server the path of their results: everything must see the storage at the same absolute path,
# mountPath, and your projects must save their results there (`storage` in qaboard.yaml, by default /mnt/qaboard).
# The chart mounts it in:
# - the backend, at mountPath: it lists, reads and deletes results, and QABOARD_STORAGE_ROOTS is set to mountPath
# - the proxy, at /var/qaboard<mountPath>, read-only: nginx serves /s/<path> from /var/qaboard/<path>
# - cantaloupe, at /repository<mountPath>, read-only: it reads /iiif/2/<path> from /repository/<path>
# Storage that the chart doesn't manage can be mounted instead with backend/proxy/cantaloupe.extraVolumes.
results:
  enabled: false
  mountPath: /mnt/qaboard
  # Set one of existingClaim, nfs or hostPath. Else the chart creates a PersistentVolumeClaim.
  # An existing PersistentVolumeClaim, e.g. on a storage class for NFS, EFS, Filestore or Azure Files
  existingClaim: ""
  # An NFS export
  nfs: {}
  #  server: nas.example.com
  #  path: /exports/qaboard
  # A folder of the nodes, e.g. when they mount the storage themselves, or kind's extraMounts (quickstart.yaml)
  hostPath: {}
  #  path: /mnt/qaboard
  #  type: DirectoryOrCreate  # the default
  # The PersistentVolumeClaim created by the chart (kept when the release is uninstalled).
  # ReadWriteMany: pods can run on several nodes, and runners elsewhere can mount it too.
  size: 100Gi
  storageClass: ""
  accessMode: ReadWriteMany

# The docs' demo projects, to try QA-Board (quickstart.yaml enables them). They're restored once, before the backend
# first starts, by an init container of the backend and of the migrations Job (the demo-data image's restore.sh):
# - their results in a volume of their own, mounted at /mnt/qaboard (the path their database has) in the backend,
#   the proxy and cantaloupe; results.mountPath must be another folder. If you set config.QABOARD_STORAGE_ROOTS,
#   add /mnt/qaboard to it.
# - their database, unless it already has QA-Board's tables: existing data is never touched.
demoData:
  enabled: false
  # Default: <image.repository>:demo-data-<version> ("latest": <image.repository>:demo-data), see image above.
  # Built from the docs' demo data by .github/workflows/docs-media.yml (docs-media/README.md)
  image: ""
  # The PersistentVolumeClaim of their results, deleted with the release
  size: 5Gi
  storageClass: ""
  # ReadWriteMany: pods can run on several nodes
  accessMode: ReadWriteMany

# Secret backend settings: SECRET_KEY (signs sessions, must be the same for all replicas),
# QABOARD_DB_PASSWORD (unless database.cnpg.enabled), GITLAB_ACCESS_TOKEN, GITHUB_ACCESS_TOKEN, QABOARD_LDAP_PASSWORD,
# QABOARD_OIDC_CLIENT_SECRET, QABOARD_ENCRYPTION_KEY (for the secrets of sign-in providers added in the admin panel)...
secret:
  # Recommended: create the secret yourself (e.g. with sealed-secrets/external-secrets) and reference it
  existingSecret: ""
  # Or let the chart create it (a random SECRET_KEY is generated once and kept across upgrades)
  values: {}

database:
  # By default we use an external PostgreSQL (e.g. managed by IT)
  host: ""
  port: 5432
  name: qaboard
  user: qaboard
  # HA PostgreSQL (primary + replicas, automatic failover) with the CloudNativePG operator,
  # that must be installed in the cluster: https://cloudnative-pg.io
  cnpg:
    enabled: false
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16
    storage:
      size: 100Gi
      storageClass: ""
    # Continuous backups / point-in-time recovery to S3-compatible storage (e.g. MinIO), recommended
    # https://cloudnative-pg.io/documentation/current/backup/
    backup: {}
    #  barmanObjectStore:
    #    destinationPath: s3://qaboard-backups/
    #    endpointURL: https://minio.example.com
    #    s3Credentials: {...}
    #  retentionPolicy: 30d
  # A single PostgreSQL pod, only to try the chart
  embedded:
    enabled: false
    image: postgres:16-alpine
    # Only used when the database is created: to change it later, ALTER USER too
    password: password
    storage:
      size: 10Gi
      storageClass: ""

backend:
  replicas: 2
  # uwsgi processes per replica
  uwsgi:
    processes: 8
    cheaper: 4
    cheaperInitial: 8
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {memory: 16Gi}
  # Application data: git clones, caches. Shared by the replicas: use ReadWriteMany (e.g. NFS) if replicas > 1
  data:
    existingClaim: ""
    size: 50Gi
    storageClass: ""
    accessMode: ReadWriteMany
  # Extra environment variables (list of EnvVar)
  env: []
  # Other storage where users save outputs, besides `results`: e.g. NFS volumes, or hostPath (when nodes mount NFS
  # with autofs). Add them to config.QABOARD_STORAGE_ROOTS, and mount them in the proxy and cantaloupe too.
  extraVolumes: []
  #  - name: algo
  #    nfs: {server: nas.example.com, path: /algo}
  extraVolumeMounts: []
  #  - {name: algo, mountPath: /algo}
  # The image runs as root: init.sh writes /etc/sudoers (to delete outputs as their owner) and uwsgi drops privileges
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  # The backend's ServiceAccount. By default the backend uses the namespace's default ServiceAccount, without its token.
  # The chart creates <release>-qaboard-backend when `create` is true or with runners.kubernetes.enabled (the token is
  # only mounted then). `name`: an existing ServiceAccount to use instead, e.g. with permissions you manage.
  serviceAccount:
    create: false
    name: ""
    # e.g. for workload identity
    annotations: {}

# Database migrations run in a Job before each upgrade (and after the first install)
migrations:
  enabled: true

# nginx: serves the webapp and the docs, proxies the API
proxy:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
  # Site-specific nginx configuration files (conf.d). A "qaboard.conf" replaces the default one.
  siteConfig: {}
  #  extra.conf: |
  #    server { ... }
  # e.g. to serve other storage under /s/: nginx serves /s/<path> from /var/qaboard/<path>
  extraVolumes: []
  # Only the users allowed by QABOARD_LOGIN_RESTRICTED_YAML can read the files of restricted projects and folders under /s/.
  # nginx asks the backend before serving each file.
  restrictFiles: false
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    minAvailable: 1

ingress:
  enabled: true
  className: ""
  host: qaboard.example.com
  annotations:
    # Uploads and slow API calls
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  # - secretName: qaboard-tls
  tls: []

# Cache only, no persistence needed
redis:
  enabled: true
  image: redis:7

# IIIF image server, to serve images as tiles
cantaloupe:
  enabled: false
  memory: {start: 1g, max: 2g}
  # It reads /iiif/2/<path> from /repository/<path>
  extraVolumes: []
  extraVolumeMounts: []

# Start the batches users ask for in the web app on Kubernetes, and stop Kubernetes batches (the kubernetes runner).
# `qa batch` runs in a pod (a Job) as the signed-in user's UID/GID (from the backend's accounts: /etc/passwd or
# QABOARD_ACCOUNTS_COMMAND; only for users who sign in with the directory: LDAP, SAML, OIDC), with the commit's
# runners.kubernetes (image, mounts...) from its qaboard.yaml, and starts the runs' Jobs. The pods must see the code,
# inputs and results at the same paths as the backend (e.g. NFS or PVCs).
# The chart creates, in each namespace (they must exist):
# - a Role <release>-qaboard-runs with the runner's permissions: jobs (create, get, list, watch, delete), configmaps
#   (create, get, delete), pods and events (get, list, watch), pods/log (get), Kueue localqueues (get)
# - a ServiceAccount (serviceAccount) for the pods that run `qa batch`, bound to it
# - a RoleBinding for both, and for the backend's ServiceAccount (backend.serviceAccount)
# and sets the backend's QABOARD_TUNING_RUNNER=kubernetes, QABOARD_KUBERNETES_NAMESPACES, QABOARD_KUBERNETES_SERVICE_ACCOUNT
# and QABOARD_KUBERNETES_SERVER_URL (`config` wins). Installing it needs the permission to create Roles there.
#
# Security: A NAMESPACE IS A TRUST DOMAIN. `qa batch` runs the commit's code with the namespace's runs ServiceAccount,
# which can create Jobs: any pod the namespace accepts, as any UID it accepts. Everyone who can start batches from the
# web app in a namespace can act as anyone else in it (an admission policy on the qaboard.io/user label can't tell
# them apart: they share the ServiceAccount). Use one namespace per team. QA-Board starts `qa batch` as the user (never
# as root, nor as a UID from qaboard.yaml), without job_template, the server's environment, or hostPath mounts
# (unless allowHostPath), but what runs may do (users, volumes, privileges) is up to the namespace: enforce it with Pod
# Security Admission ("restricted" or "baseline") and admission policies, and quotas with ResourceQuota or Kueue.
# With runAs: "<uid>:<gid>" (a team account) and a ValidatingAdmissionPolicy that pins runAsUser for the runs
# ServiceAccount, a namespace's batches are isolated from other namespaces' users.
# See website/docs/backend-admin/runners.mdx and website/docs/kubernetes-runner.mdx
runners:
  kubernetes:
    enabled: false
    # Where QA-Board may start and stop runs (QABOARD_KUBERNETES_NAMESPACES). Batches of commits whose
    # runners.kubernetes.namespace is not set go to the first one.
    namespaces: []
    #  - algo-qa
    # The ServiceAccount of the pods that run `qa batch`, created in each namespace (QABOARD_KUBERNETES_SERVICE_ACCOUNT).
    # Default: <release>-qaboard-runs
    serviceAccount: ""
    # Who the pods that run `qa batch` run as (QABOARD_KUBERNETES_RUN_AS): "" or "user", the signed-in user's UID/GID,
    # or "<uid>:<gid>", one account for all the batches started from QA-Board.
    runAs: ""
    # How those pods reach QA-Board (QABOARD_KUBERNETES_SERVER_URL). Default: the proxy's Service,
    # http://<release>-qaboard-proxy.<release namespace>.svc
    serverUrl: ""
    # Lets projects mount hostPath volumes (runners.kubernetes.mounts[].host_path) in the pods that run `qa batch`
    # (QABOARD_KUBERNETES_ALLOW_HOST_PATH). They need the namespace's "privileged" Pod Security level: avoid it.
    allowHostPath: false
    # Dask clusters on Kubernetes (runners.dask.cluster.type: kubernetes, needs the Dask operator in the cluster):
    # the Role also allows daskclusters, daskworkergroups, daskjobs, daskautoscalers (create, get, list, watch, patch,
    # delete) and services (get, list, watch). The backend deletes the DaskClusters of the batches users stop.
    # Dask clusters on Slurm, PBS, SGE... are stopped with their command (scancel, qdel...): it must be in the backend's image.
    dask: false
    # More rules for the Role
    extraRules: []
    #  - apiGroups: [""]
    #    resources: [persistentvolumeclaims]
    #    verbs: [get]

# Only needed with QABOARD_TUNING_RUNNER=celery
# Celery workers run the commands of the tasks they get: anyone who can connect to RabbitMQ can run commands on them.
# Flower, at /flower/ through the ingress, can revoke tasks and shut the workers down: set FLOWER_BASIC_AUTH
# (user:password) in the secret to ask for a login.
celery:
  enabled: false
  rabbitmq:
    image: rabbitmq:3-management
    # RabbitMQ's account, created when it starts (it keeps no data). The backend and Flower connect with it.
    # The password is QABOARD_RABBITMQ_PASSWORD in the secret with passwordFromSecret, else `password`. URL-safe characters
    user: guest
    password: guest
    passwordFromSecret: false

# Daily pg_dump to a volume, when we don't use CloudNativePG's backups
backup:
  enabled: false
  schedule: "0 2 * * *"
  image: postgres:16-alpine
  keepDays: 14
  storage:
    existingClaim: ""
    size: 200Gi
    storageClass: ""
