
[project]
name = "qaboard"
version = "1.1.1"
description = "Visualize and compare algorithm results. Optimize parameters. Share results and track progress."
readme = "README.md"
authors = [
    {name = "Arthur Flam", email = "arthur.flam@samsung.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.7"
dependencies = [
    "click>=7.0",
    "joblib",
    "pyyaml",
    "requests",
    "rich",
    "scikit-learn",
    # qa optimize. Its import error tells users of older Pythons to upgrade
    "optuna>=4.5; python_version >= '3.9'",
    "sentry-sdk",
    "simplejson",
    "psutil",
    "importlib_metadata; python_version < '3.8'",
]
license = {text = "Apache-2.0"}

[project.urls]
Homepage = "https://github.com/Samsung/qaboard"

[project.optional-dependencies]
dev = [
    "flake8",
    "green",
    # tests/test_schemas.py
    "jsonschema",
    "mypy",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
    "types-simplejson",
]
# Runner that sends runs to a pool of dask workers, started on LSF, Slurm, PBS... with dask-jobqueue
# Runner that sends runs to Celery workers. Stopping batches needs celery>=5.3 (revoke by stamped headers)
celery = [
    "celery>=5.3; python_version >= '3.9'",
]
dask = [
    "distributed; python_version >= '3.9'",
    "dask-jobqueue; python_version >= '3.9'",
]
# Runner that starts runs as Kubernetes Jobs. 29: Indexed Jobs' backoffLimitPerIndex
kubernetes = [
    "kubernetes>=29; python_version >= '3.9'",
]
# Dask workers on Kubernetes (runners.dask.cluster.type: kubernetes), with the Dask operator
dask-kubernetes = [
    "distributed; python_version >= '3.10'",
    "dask-kubernetes; python_version >= '3.10'",
]
# Unfortunately pip does not understand tool.uv.sources
# and uv does not understand syntax with "qaboard-site-sirc @ file:deployements/sirc/cli"
# and if we use an ssh syntax in uv it will try to resolve even if it is part of an unused extra
# so we are forced to really split into 2 packages
# sirc = [
#     "qaboard-site-sirc",
# ]
# dsk = [
#     "qaboard-site-dsk",
# ]

[project.scripts]
qa = "qaboard.qa:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Outputs from running the sample project, e.g. during tests (hatch ignores nested .gitignore files)
exclude = [
    "qaboard/sample_project/**/output/",
    "qaboard/sample_project/**/*.batches.yaml",
]

[tool.hatch.build.targets.sdist]
include = ["/qaboard", "/qatools", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = [
    "qaboard",
    # for backward compat only
    "qatools",
]

# See above
# [tool.uv.sources]
# qaboard-site-sirc = { path = "deployments/sirc/cli" }
# qaboard-site-dsk = { path = "deployments/dsk/cli" }

[tool.hatch.metadata]
allow-direct-references = true
