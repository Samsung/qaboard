
[project]
name = "qaboard"
version = "1.2.0"
description = "Self-hosted quality tracking for people and coding agents: every commit's outputs and metrics next to a reference's, with tuning."
readme = "README.md"
authors = [
    {name = "Arthur Flam", email = "arthur.flam@samsung.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    # 8.2: what the tests need (CliRunner keeps stderr apart); shell completion (qa completion), parameter sources
    "click>=8.2",
    "joblib",
    "pyyaml",
    "requests",
    "rich>=13",
    "scikit-learn",
    # qa optimize
    "optuna>=4.5",
    "sentry-sdk",
    "simplejson",
    "psutil",
]
license = {text = "Apache-2.0"}

[project.urls]
Homepage = "https://github.com/Samsung/qaboard"

[project.optional-dependencies]
dev = [
    "flake8",
    "green",
    # tests/test_schemas.py
    "jsonschema",
    "mypy",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
    "types-simplejson",
]
# Runner that sends runs to a pool of dask workers, started on LSF, Slurm, PBS... with dask-jobqueue
# Runner that sends runs to Celery workers. Stopping batches needs celery>=5.3 (revoke by stamped headers)
celery = [
    "celery>=5.3",
]
dask = [
    "distributed",
    "dask-jobqueue",
]
# Runner that starts runs as Kubernetes Jobs. 29: Indexed Jobs' backoffLimitPerIndex
kubernetes = [
    "kubernetes>=29",
]
# Dask workers on Kubernetes (runners.dask.cluster.type: kubernetes), with the Dask operator
dask-kubernetes = [
    "distributed",
    "dask-kubernetes",
]
# Code that logs with MLflow's tracking API logs to QA-Board: MLFLOW_TRACKING_URI=qaboard: (qaboard/integrations/mlflow)
mlflow = [
    "mlflow-skinny>=2.10",
]
# Unfortunately pip does not understand tool.uv.sources
# and uv does not understand syntax with "qaboard-site-sirc @ file:deployements/sirc/cli"
# and if we use an ssh syntax in uv it will try to resolve even if it is part of an unused extra
# so we are forced to really split into 2 packages
# sirc = [
#     "qaboard-site-sirc",
# ]
# dsk = [
#     "qaboard-site-dsk",
# ]

[project.scripts]
qa = "qaboard.qa:main"

# MLflow finds its stores and artifact repositories by URI scheme (qaboard/integrations/mlflow/plugin.py)
[project.entry-points."mlflow.tracking_store"]
qaboard = "qaboard.integrations.mlflow.plugin:tracking_store"
"qaboard+file" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"
"qaboard+http" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"
"qaboard+https" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"
"qaboard+sqlite" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"
"qaboard+postgresql" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"
"qaboard+mysql" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"
"qaboard+mssql" = "qaboard.integrations.mlflow.plugin:mirror_tracking_store"

[project.entry-points."mlflow.model_registry_store"]
qaboard = "qaboard.integrations.mlflow.plugin:registry_store"
"qaboard+file" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"
"qaboard+http" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"
"qaboard+https" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"
"qaboard+sqlite" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"
"qaboard+postgresql" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"
"qaboard+mysql" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"
"qaboard+mssql" = "qaboard.integrations.mlflow.plugin:mirror_registry_store"

[project.entry-points."mlflow.artifact_repository"]
qaboard-artifacts = "qaboard.integrations.mlflow.plugin:artifact_repository"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Outputs from running the sample project, e.g. during tests (hatch ignores nested .gitignore files)
exclude = [
    "qaboard/sample_project/**/output/",
    "qaboard/sample_project/**/*.batches.yaml",
]

[tool.hatch.build.targets.sdist]
include = ["/qaboard", "/qatools", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = [
    "qaboard",
    # for backward compat only
    "qatools",
]

# See above
# [tool.uv.sources]
# qaboard-site-sirc = { path = "deployments/sirc/cli" }
# qaboard-site-dsk = { path = "deployments/dsk/cli" }

[tool.hatch.metadata]
allow-direct-references = true
