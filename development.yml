version: "3.5"

services:
  # don't show logs from those services
  pgadmin:
    logging:
      driver: none
  db:
    logging:
      driver: none
  cantaloupe:
    logging:
      driver: none
  metabase:
    logging:
      driver: none
  proxy:
    environment:
    - NGINX_BIN=nginx-debug

  backend:
    volumes:
    - ./qaboard:/qaboard/qaboard
    - ./backend:/qaboard/backend
    - ./setup.py:/qaboard/setup.py
    environment:
    # - QABOARD_DB_ECHO=true
    - UWSGI_STATS=true
    - FLASK_APP=backend
    - FLASK_ENV=development
    - FLASK_DEBUG=1
    # Connect to the production database
    - QABOARD_DB_HOST=qa
    # Start a flask debug server instead of the full uwsgi
    working_dir: /qaboard/backend
    # With what's just below, everything works except being able to delete files owned by other users
    # We wish we could do this, then remove sudo from the dockerfile, and use this command...
    # command: flask run --host 0.0.0.0 --with-threads --port 5152
    # user: "11611:10"
    # cap_add:
    #   - SETUID
    #   - SETGID
    # But non-root users don't gain capabilities...
    command: >
      bash -c "
      echo 'arthurf ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      && su arthurf -c 'flask run --host 0.0.0.0 --with-threads --port 5152'
      "
    ports:
    - "${QABOARD_DEV_BACKEND_PORT:-5152}:5152"
    #   logging:
    #     driver: none


  frontend:
    volumes:
    - ./webapp:/webapp
    environment:
    # Should we comment it out by default?
    - HOST=0.0.0.0
    - DANGEROUSLY_DISABLE_HOST_CHECK=true
    - CHOKIDAR_USEPOLLING=true
    # - REACT_EDITOR=code
    # Relay API requests to your development server
    - REACT_APP_QABOARD_API_HOST=http://backend:5152
    - REACT_APP_QABOARD_HOST=http://proxy:5151
    ### At SIRC ####
    - HTTP_PROXY=
    - http_proxy=
    - REACT_APP_QABOARD_HOST=http://proxy
    command: npm start
    ports:
    - "${QABOARD_DEV_FRONTEND_PORT:-3000}:3000"
    depends_on:
    - proxy
    - backend
