[project]
name = "backend"
version = "1.0.1"
description = "Backend for QA-Board"
authors = [{ name = "Arthur Flam", email = "arthur.flam@samsung.com" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "gitpython",
    "click",
    "flask",
    "flask_cors",
    "flask_login",
    "python-ldap",
    "sqlalchemy",
    "sqlalchemy_utils",
    "alembic",
    "psycopg2",
    "ujson",
    "pandas",
    "numpy",
    "scikit-image",
    "uwsgi",
    "uwsgitop",
    "scikit-optimize",
    "psutil",
    "certifi",
    "requests",
    "celery",
    "sentry-sdk[flask]",
    "python3-saml",
    "polyleven",
    "rich",
    "simplejson",
    "redis",
    "qaboard @ file:///qaboard/",
]

# uv sync --extra qaboard
# [project.optional-dependencies]
# qaboard = ["qaboard"]


[project.urls]
repository = "https://github.com/Samsung/qaboard"
homepage = "https://samsung.github.io/qaboard"

[tool.uv]
package = true

[project.scripts]
qaboard_clean = "backend.clean:clean"
qaboard_clean_untracked_hwalg_artifacts = "backend.clean:clean_untracked_hwalg_artifacts"
qaboard_clean_untracked_hwalg_outputs = "backend.clean:clean_untracked_hwalg_outputs"
qaboard_init_database = "backend.scripts.init_database:init_database"

[dependency-groups]
dev = ["pytest"]
