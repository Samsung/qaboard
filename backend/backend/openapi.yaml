# The OpenAPI description of QA-Board's HTTP API, served at /api/v1/openapi.json, and browsed at /api/v1/docs.
#
# Written by hand, for the endpoints scripts and agents use to read results and start batches: tests/test_openapi.py checks that each
# path is a route of the backend. Other endpoints serve the web app and may change without notice.
# When the backend moves to FastAPI, this document will be generated from the code.
# The docs: website/docs/http-api.mdx
openapi: 3.1.0
info:
  title: QA-Board API
  version: "1"
  summary: Read a project's commits, batches, runs, metrics and comparisons with a reference.
  description: |
    QA-Board's web app reads everything from this API, and so can your scripts and agents.

    - **Authentication**: reading is anonymous unless your server requires signing in, or the project is private.
      Otherwise send a token: `Authorization: Bearer <token>`. Create tokens in the web app, in **Settings → Access
      tokens**, or use `qa auth token`. In this page, signed-in users are already authenticated by their session.
    - **Errors** are JSON: `{"error": "<what went wrong>", "reason": "<a stable code, when there is one>"}`.
    - Runs are called *outputs* in the API.

    This document covers the endpoints for reading results, adding metrics to runs and starting batches on a commit.
    Others serve the web app and may change. It is written
    by hand for now: it will be generated from the code when the backend moves to FastAPI.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
externalDocs:
  description: The HTTP API guide
  url: https://samsung.github.io/qaboard/docs/http-api
# Replaced by the server with its own address (api/openapi.py)
servers:
  - url: /api/v1
security:
  - {}
  - bearerAuth: []
tags:
  - name: Projects
    description: Projects and their branches.
  - name: Commits
    description: Commits with results, their batches and runs.
  - name: Runs
    description: A run (an *output* in the API), its files, and metrics added by scripts.
  - name: Compare
    description: A commit's runs against a reference, like the **Summary** and **Metrics Diff** views.
  - name: Batches
    description: >-
      Start a batch on a commit, as the web app's **Run Tests / Tuning** does: QA-Board runs `qa batch` (or
      `qa optimize`) from the commit's artifacts, with the project's runner. From the shell, `qa batch --commit` calls them.
  - name: Milestones
    description: Saved references.
  - name: Inputs
    description: The inputs runs used, their thumbnails and files.
  - name: Collections
    description: Named, versioned lists of inputs, for batches (`collections:` in batch files).
  - name: Account
    description: Who you are, and which token you use.
  - name: Server
    description: The server's health.

paths:
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the projects you can read
      description: The projects with results, sorted by name, as an object keyed by project id.
      parameters:
        - name: summary
          in: query
          description: >-
            `true` gives only what lists of projects need from their `data` (git info, *qaboard.yaml*'s `project`
            section): much smaller. Use `GET /project` for the rest.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The projects, by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/ProjectSummary"}
              example:
                kitefin/detector:
                  data: {git: {name: detector, default_branch: main}, qatools_config: {project: {reference_branch: main}}}
                  latest_output_datetime: "2026-11-05T14:02:11.391000"
                  latest_commit_datetime: "2026-11-05T13:58:40+00:00"
                  total_commits: 412
                  latest_human_activity: "2026-11-05T09:12:03"
                  activity: [3, 0, 5, 2, 0, 0, 1, 4, 2, 3, 0, 0, 2, 6, 3, 1, 0, 0, 2, 4, 5, 3, 1, 0, 0, 2, 3, 4, 2, 1]
                  views_90d: 14
                  my_last_view: null
        "401": {$ref: "#/components/responses/Unauthorized"}

  /project:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project's data
      description: >-
        The project's data: its latest *qaboard.yaml* (`qatools_config`), metrics definitions (`qatools_metrics`),
        and what the git host said about it (`git`).
      parameters:
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The project's data.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectData"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /project/branches:
    get:
      tags: [Projects]
      operationId: listBranches
      summary: List a project's branches with results
      description: >-
        By default every branch, sorted by name. With `q` or `limit`, the most recently active branches first.
      parameters:
        - $ref: "#/components/parameters/project"
        - name: q
          in: query
          description: Only branches whose name contains this text (case-insensitive).
          schema: {type: string}
        - name: limit
          in: query
          description: At most this many branches (default 50 with `q`).
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: Branch names.
          content:
            application/json:
              schema: {type: array, items: {type: string}}
              example: [main, quant/int8, release/2.4]
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /commits:
    get:
      tags: [Commits]
      operationId: listCommits
      summary: List commits with results
      description: |
        The commits with results, newest first: by default those of the last days with commits, or of `from`/`to`.
        Without `limit`, at most 1000 commits and no `X-Has-More` header.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/commitsQuery"
        - $ref: "#/components/parameters/committer"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/batchFilter"
        - $ref: "#/components/parameters/onlyCiBatches"
        - $ref: "#/components/parameters/withOutputsFalse"
        - $ref: "#/components/parameters/metricsToAggregate"
        - $ref: "#/components/parameters/scope"
      responses:
        "200": {$ref: "#/components/responses/Commits"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /commits/{branch}:
    get:
      tags: [Commits]
      operationId: listBranchCommits
      summary: List a branch's commits with results
      description: Like `GET /commits`, for one branch. Branch names can contain `/`.
      parameters:
        - name: branch
          in: path
          required: true
          schema: {type: string}
          example: main
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/commitsQuery"
        - $ref: "#/components/parameters/committer"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/batchFilter"
        - $ref: "#/components/parameters/onlyCiBatches"
        - $ref: "#/components/parameters/withOutputsFalse"
        - $ref: "#/components/parameters/metricsToAggregate"
      responses:
        "200": {$ref: "#/components/responses/Commits"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /commit/{commit}:
    get:
      tags: [Commits]
      operationId: getCommit
      summary: Get a commit, its batches and runs
      description: |
        A commit with all its batches, and by default all their runs. `commit` is a sha (or its start), a branch
        (its latest commit with results) or a tag.

        The runs are in `batches.<label>.outputs`, keyed by run id. The CI batch's label is `default`.
      parameters:
        - name: commit
          in: path
          required: true
          description: A commit sha or its start (at least 7 characters is safest), a branch or a tag.
          schema: {type: string}
          example: 7622c337
        - $ref: "#/components/parameters/project"
        - name: batch
          in: query
          description: Only this batch.
          schema: {type: string}
          example: default
        - name: with_outputs
          in: query
          description: >-
            `false` leaves out the runs: only the batches' counts and aggregated metrics. Faster on commits with
            thousands of runs.
          schema: {type: boolean, default: true}
        - $ref: "#/components/parameters/metricsToAggregate"
      responses:
        "200":
          description: The commit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommitWithRuns"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /commit:
    get:
      tags: [Commits]
      operationId: getLatestCommit
      summary: Get a branch's latest commit with results
      description: >-
        The latest commit of the branch whose runs didn't all fail (among its 20 latest commits), with its batches and
        runs. Default branch: the project's `reference_branch`.
      parameters:
        - $ref: "#/components/parameters/project"
        - name: branch
          in: query
          schema: {type: string}
          example: main
        - name: batch
          in: query
          description: Only commits with successful runs in this batch, and only this batch.
          schema: {type: string}
        - $ref: "#/components/parameters/metricsToAggregate"
      responses:
        "200":
          description: The commit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommitWithRuns"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /batches:
    get:
      tags: [Commits]
      operationId: listBatches
      summary: List the latest batches
      description: >-
        Batches, the latest first (by their latest run), each with its commit: what people ran, rather than commits.
        Give `project`, `projects`, or `scope=mine` for your batches in every project.
      parameters:
        - name: project
          in: query
          schema: {type: string}
          example: kitefin/detector
        - name: projects
          in: query
          description: Comma-separated project ids (at most 200). Those you can't read are skipped.
          schema: {type: string}
        - name: scope
          in: query
          description: "`mine`: the batches you started; `others`: the others'. Needs to be signed in."
          schema: {type: string, enum: [all, mine, others], default: all}
        - name: origin
          in: query
          description: "Comma-separated: where the batches were started, among `webapp`, `local` and `ci`."
          schema: {type: string}
          example: webapp,local
        - name: branch
          in: query
          schema: {type: string}
        - name: status
          in: query
          description: "`pending`: with runs that wait or run; `failed`: with failed runs."
          schema: {type: string, enum: [pending, failed]}
        - name: since_days
          in: query
          description: Only batches with runs in the last days.
          schema: {type: integer, minimum: 1, maximum: 3650}
        - name: metrics
          in: query
          description: >-
            Metrics to aggregate over each batch's runs, as in `GET /commits`, or `default` for each project's
            default metric.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        "200":
          description: Batches. The `X-Has-More` header says if there are more.
          headers:
            X-Has-More: {$ref: "#/components/headers/X-Has-More"}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/BatchWithCommit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /output/{output_id}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a run
      parameters:
        - $ref: "#/components/parameters/outputId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /output/{output_id}/manifest:
    get:
      tags: [Runs]
      operationId: getRunFiles
      summary: List a run's files
      description: >-
        The files in the run's folder, by path relative to it. Download them from
        `<server><output_dir_url>/<path>`.
      parameters:
        - $ref: "#/components/parameters/outputId"
        - name: refresh
          in: query
          description: List the folder again, instead of reading the saved list.
          schema: {type: boolean}
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    st_size: {type: integer, description: Size in bytes.}
                    md5: {type: string, description: Present when the run's files were hashed.}
                  required: [st_size]
              example:
                output.png: {st_size: 1843211, md5: 9b2c1e0f4f6d3a8c7e5b1a2d3c4e5f60}
                detections.json: {st_size: 20480, md5: 2f1e0d9c8b7a6f5e4d3c2b1a09f8e7d6}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /output/{output_id}/progress:
    patch:
      tags: [Runs]
      operationId: reportRunProgress
      summary: Report a running run's metrics so far
      description: |
        What a running run looks like so far: its metrics and the parameters it reported. Runs started from Python
        with `qaboard.start_run()` send it every few seconds while they log, so that the web app shows them before
        they end. Each request replaces what the run said before. When the run ends, `POST /output/` says its final
        metrics.

        Without `metrics`, the run's metrics don't change: `{}` is a heartbeat. Runs created with `"heartbeat": true`
        are marked failed when they stay silent ($QABOARD_SILENT_RUN_TIMEOUT_MINUTES); one marked failed that way
        runs again when it reports.

        Same access as the results `qa` sends.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/outputId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metrics:
                  type: object
                  description: At most 2000. Values are finite numbers, booleans, texts (500 characters at most) or null.
                  additionalProperties:
                    type: [number, boolean, string, "null"]
                params:
                  type: object
                  description: The parameters the run reports, shown with its configuration.
                metrics_definitions:
                  type: object
                  description: How to show the metrics, as in a metrics file (label, suffix, smaller_is_better, target...).
                  additionalProperties: {$ref: "#/components/schemas/MetricDefinition"}
            example:
              metrics: {"train/loss": 0.31, "val/loss": 0.42}
              params: {optimizer: adamw}
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: "The run isn't running (`reason: not_running`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /output/{output_id}/files/{path}:
    put:
      tags: [Runs]
      operationId: uploadRunFile
      summary: Send a file of a running run
      description: |
        Saves a file of a run that doesn't share a storage with the server: `qa` and `qaboard.start_run()` send
        their runs' files like this with `storage: upload` in *qaboard.yaml*. The run was created with
        `POST /output/` and `"storage": "upload"`: the server chose its folder. The request's body is the file.
        Sending a file again replaces it. Only while the run is pending or running, and only on servers that accept
        files (`uploads.enabled` in `GET /config`).

        Always needs a token that can send results to the project, whatever the server's `ingest.auth` setting.
        The patches of the run's local changes (`.qaboard/*.patch`) are refused (403, `reason:
        local_changes_not_allowed`) when the server's `runs.local_changes` setting isn't `patch` (`local_changes`
        in `GET /config`, `local_changes_level` in the answer to `POST /output/`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/outputId"
        - name: path
          in: path
          required: true
          description: The file's path in the run's folder, like `plots/loss.png`.
          schema: {type: string}
        - name: offset
          in: query
          description: |
            Add the body at the end of the file instead of replacing it, for files that grow, like *log.txt*. It is
            the size the file must have, `0` for a new file.
          schema: {type: integer, minimum: 0}
        - name: X-Content-SHA256
          in: header
          description: The body's SHA-256, in hexadecimal. When sent, the server checks what it received.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: The file was saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  size: {type: integer, description: "The file's size, in bytes."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: |
            The run has ended (`reason: not_running`), saves its files in a shared storage (`not_uploaded`), the file
            doesn't have the size `offset` says (`offset_mismatch`, with its `size`), or the path is a folder of the
            run (`path_conflict`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: "The file is larger than the server accepts (`max_file_size`, in bytes)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "What the server received doesn't have the SHA-256 sent (`reason: digest_mismatch`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "507":
          description: "The server's storage for uploaded files is full."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /commit/{commit}/artifacts:
    get:
      tags: [Commits]
      operationId: getCommitArtifacts
      summary: List the artifacts sent for a commit
      description: |
        The artifacts `qa save-artifacts` sent for a commit of a project without a storage shared with the server.
        Download each file from `<server><url>/<path>`. `hash` changes when any file does: `qa fetch-artifacts`
        caches them by it.
      parameters:
        - name: commit
          in: path
          required: true
          description: The commit's full sha.
          schema: {type: string, pattern: "^[0-9a-f]{40}$"}
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The files, by their path in the repository.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        sha256: {type: string}
                        size: {type: integer}
                        executable: {type: boolean}
                  hash: {type: string, description: "The SHA-256 of the files' paths, SHA-256 and modes."}
                  url: {type: string, description: "Where the files are served, like /s/..."}
                  subproject: {type: string, description: "The project's folder in the repository, \"\" at its root."}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: "The server doesn't know the commit, or has no artifacts for it (`not_uploaded`, `deleted`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /commit/{commit}/artifacts/files/{path}:
    put:
      tags: [Commits]
      operationId: uploadCommitArtifact
      summary: Send one of a commit's artifacts
      description: |
        Saves a file of a commit's artifacts, for projects without a storage shared with the server: `qa
        save-artifacts` sends them like this, each file then the manifests that list them
        (`<subproject>/manifests/<group>.json`). The commit must exist (`POST /commit/`). Sending a file again
        replaces it. Always needs a token that can send results to the project.
      security:
        - bearerAuth: []
      parameters:
        - name: commit
          in: path
          required: true
          description: The commit's full sha.
          schema: {type: string, pattern: "^[0-9a-f]{40}$"}
        - name: path
          in: path
          required: true
          description: The file's path in the repository, like `build/my-tool`.
          schema: {type: string}
        - $ref: "#/components/parameters/project"
        - name: X-Content-SHA256
          in: header
          required: true
          description: The body's SHA-256, in hexadecimal.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: The file was saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  size: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: "The server doesn't know the commit (`unknown_commit`): send it first."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: "The file is larger than the server accepts."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "What the server received doesn't have the SHA-256 sent (`reason: digest_mismatch`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /output/{output_id}/metrics:
    patch:
      tags: [Runs]
      operationId: addRunMetrics
      summary: Add metrics to a finished run
      description: |
        Merges metrics computed by a script into the run's (what `run.log_metrics()` calls in Python). QA-Board records
        who added each one, when and with which script, in the run's `data.added_metrics`. Nothing is written in the
        run's folder.

        Needs a token with the `ingest` scope, and the developer role on the project.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/outputId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metrics]
              properties:
                metrics:
                  type: object
                  description: At most 500. Values are finite numbers, booleans, texts (500 characters at most) or null.
                  additionalProperties:
                    type: [number, boolean, string, "null"]
                overwrite:
                  type: boolean
                  default: false
                  description: Replace metrics the run itself returned. Its values are kept as `replaced`.
                source:
                  type: object
                  description: What the script says about itself, saved with each metric.
                  properties:
                    script: {type: string}
                    script_sha256: {type: string}
                    qaboard_version: {type: string}
                    note: {type: string}
                metrics_definitions:
                  type: object
                  description: How to show the added metrics, as in a metrics file (label, suffix, smaller_is_better, target...).
                  additionalProperties: {$ref: "#/components/schemas/MetricDefinition"}
            example:
              metrics: {sharpness: 0.42}
              source: {script: sharpness.py, note: "Laplacian variance"}
      responses:
        "200":
          description: The run, and what was added.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - type: object
                    properties:
                      added:
                        type: object
                        additionalProperties: {$ref: "#/components/schemas/AddedMetric"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            The run hasn't finished, its files were deleted, or it returned some of these metrics itself
            (`reason: metrics_exist`, use `overwrite`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /commit/{commit}/compare:
    get:
      tags: [Compare]
      operationId: compareCommit
      summary: Compare a commit's runs with a reference
      description: |
        The numbers of the commit page's **Summary** and **Metrics Diff**: each metric's median against the
        reference's, and each run against its reference run. `qa gate` uses it.

        Check `status` first: the numbers are final only when it is `complete`.
      parameters:
        - name: commit
          in: path
          required: true
          description: A commit sha, or its start.
          schema: {type: string, pattern: "^[0-9a-fA-F]{4,64}$"}
          example: 7622c337
        - $ref: "#/components/parameters/project"
        - name: batch
          in: query
          description: The batch label. `ci` also names the CI batch.
          schema: {type: string, default: default}
        - name: reference
          in: query
          description: >-
            A shared milestone's label (or `#<id>` for any milestone), a commit sha, or a branch: its latest commit
            with runs in the batch, other than this one. Default: `gate.reference` in the commit's *qaboard.yaml*, else
            `project.reference_branch`.
          schema: {type: string}
          example: main
        - name: reference_batch
          in: query
          description: "The reference's batch label. Default: `batch`, or a milestone's batch."
          schema: {type: string}
        - name: metrics
          in: query
          description: "Comma-separated metrics to compare. Default: all those with numbers in the commit's runs."
          schema: {type: string}
          example: mAP,latency_ms
        - name: bit_accuracy
          in: query
          description: "`true` also compares the runs' files, like `qa check-bit-accuracy`."
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Comparison"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /commit/{commit}/batch/check:
    post:
      tags: [Batches]
      operationId: checkBatch
      summary: Check a request to start a batch, without starting it
      description: |
        Says what `startBatch` would do with the same request, and what's wrong: unknown batches, invalid tuning,
        the commit's artifacts missing... With `errors`, `startBatch` refuses. `qa batch --commit` calls it first.

        Needs to be signed in, and to see the project.
      parameters:
        - $ref: "#/components/parameters/batchCommit"
        - $ref: "#/components/parameters/project"
      requestBody: {$ref: "#/components/requestBodies/StartBatch"}
      responses:
        "200":
          description: What would run, and what's wrong.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchCheck"}
        "400": {$ref: "#/components/responses/BatchRefused"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/BatchRefused"}

  /commit/{commit}/batch:
    post:
      tags: [Batches]
      operationId: startBatch
      summary: Start a batch on a commit, as from the web app
      description: |
        Runs `qa batch` (or `qa optimize` for an automated tuning) from the commit's artifacts, as the signed-in user,
        with the runner the server's admins chose: the same as **Start** in the web app's **Run Tests / Tuning**. Answers
        once the batch started; its runs show on the commit's page, under `batch_label`. Servers whose admins chose no
        runner (`QABOARD_TUNING_RUNNER`) start none: `400`, with `reason: no_server_runner`.

        When the commit's artifacts are missing, QA-Board restores what's in the source code, or asks the project's CI
        to recreate them (`recreate_artifacts` in *qaboard.yaml*): then it answers `409`, try again once the CI is done.

        Needs a token with the `act` scope, and the developer role on the project. `qa batch --commit` calls it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/batchCommit"
        - $ref: "#/components/parameters/project"
      requestBody: {$ref: "#/components/requestBodies/StartBatch"}
      responses:
        "200":
          description: The batch started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission:
                    type: object
                    description: The `qa batch` command QA-Board started, as listed in the batch's **Logs**.
                    properties:
                      id: {type: string, description: The command's id.}
                      status: {type: string, enum: [submitting, submitted, done, failed]}
                      command: {type: string}
                      runner: {type: string}
                      batch: {type: string, description: The batches it runs, separated by spaces.}
                      batches_snapshot:
                        type: object
                        description: >-
                          What `qa batch` reads: the batches that run, as they were defined when it started, with only
                          them and the aliases that reach them (`batches.yaml` in the submission's logs folder).
                        properties:
                          path: {type: string, description: Relative to the submission's logs folder.}
                          batches: {type: array, items: {type: string}}
                          aliases: {type: array, items: {type: string}}
                          files: {type: array, items: {type: string}, description: The files they come from.}
                          inputs: {type: array, items: {type: string}, description: Names that are not batches, read as input paths.}
                  warning: {type: [string, "null"], description: "E.g. only the source code of the artifacts could be restored."}
        "400": {$ref: "#/components/responses/BatchRefused"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/BatchRefused"}
        "409":
          description: The commit's artifacts are missing, and QA-Board asked the CI to recreate them, or couldn't.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      artifacts:
                        type: object
                        description: "`status: recreating` when the CI is recreating them: try again later."
        "500":
          description: The batch failed to start. `error` has the end of its log.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /milestones:
    get:
      tags: [Milestones]
      operationId: listMilestones
      summary: List a project's milestones
      description: The shared milestones, and yours when you're authenticated, the most recently updated first.
      parameters:
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The milestones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones:
                    type: array
                    items: {$ref: "#/components/schemas/Milestone"}
                  favorite_groups:
                    type: array
                    description: The milestone groups you starred.
                    items:
                      type: object
                      properties:
                        section: {type: string}
                        group: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /inputs:
    get:
      tags: [Inputs]
      operationId: listInputs
      summary: List a project's inputs
      description: >-
        The inputs the runs of the project and of its subprojects (those you can read) used, and those added before any
        run (`POST /inputs`), a page at a time, with the
        counts the Inputs tab filters by. Folders are of the inputs' full paths (`full_path`: the database and the path
        joined): `root` is the deepest folder of every match (whatever `folder`), `location` the deepest folder of those
        in `folder` (chains of single folders skipped), `folders` the next level under it and `here` the inputs right in
        it. `databases` are counted in the folder, whatever the database filter, `metadata` are the keys and the most
        common values of the inputs' `data.metadata`. Counting them reads every input that matches: they are
        counted for the first page only (`offset=0`) and are `null` on the next ones, unless `facets=1`.
        With `fields=id`, answers instead the ids of every input that matches, in the list's order (`limit`, `offset`
        and `facets` are ignored): up to 50,000, the most a collection's version holds. When more match, `too_many`
        is true and `ids` is empty: narrow the filters.
      parameters:
        - $ref: "#/components/parameters/project"
        - {name: q, in: query, description: "Words the input's full path contains, all of them, case-insensitively.", schema: {type: string, maxLength: 500}}
        - {name: folder, in: query, description: "Only the inputs under this folder of their full path, e.g. `/data/night/street`. Relative (`night/street`): of their path in their database.", schema: {type: string}}
        - {name: meta, in: query, description: "Metadata filters, JSON `{key: [values]}`: inputs whose `data.metadata[key]` is one of the values (compared as text: `3`, `true`, `rain`), for every key. E.g. `{\"weather\": [\"rain\", \"snow\"]}`.", schema: {type: string}}
        - {name: database, in: query, description: Only the inputs of this database., schema: {type: string}}
        - {name: live, in: query, description: "`1` (default): hides the inputs whose runs were all deleted (inputs added without runs stay). `0`: all.", schema: {type: string, enum: ["0", "1"], default: "1"}}
        - {name: sort, in: query, description: "`last_run`: the latest used first (default). `path`.", schema: {type: string, enum: [last_run, path], default: last_run}}
        - {name: facets, in: query, description: "`1`: count `total`, `databases` and `folders`. Default: on the first page only.", schema: {type: string, enum: ["0", "1"]}}
        - {name: fields, in: query, description: "`id`: only the ids of every input that matches, not a page (see above).", schema: {type: string, enum: [id]}}
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of inputs, or with `fields=id` the ids of every input that matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids: {type: array, items: {type: integer}, description: "With `fields=id`: every match's id, in order (empty when `too_many`)."}
                  too_many: {type: boolean, description: "With `fields=id`: more than `max` inputs match."}
                  max: {type: integer, description: "With `fields=id`: the most ids answered, 50,000."}
                  inputs: {type: array, items: {$ref: "#/components/schemas/Input"}}
                  total: {type: [integer, "null"], description: "How many inputs match the filters (null without facets, or with `fields=id` when `too_many`)."}
                  databases:
                    type: [array, "null"]
                    items: {type: object, properties: {database: {type: string}, count: {type: integer}}}
                  root: {type: [string, "null"], description: "The deepest folder of every match, whatever `folder`, e.g. `/data/projectX` (`\"\"`: `/`)."}
                  location: {type: [string, "null"], description: "The deepest folder of the matches in `folder`: `folders` are under it."}
                  here: {type: [integer, "null"], description: "How many matches are right in `location`, not in a subfolder."}
                  metadata:
                    type: [array, "null"]
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        count: {type: integer, description: "How many matches have it."}
                        distinct: {type: integer, description: "How many values it has."}
                        values: {type: array, description: "The 20 most common.", items: {type: object, properties: {value: {type: string}, count: {type: integer}}}}
                  folders:
                    type: [array, "null"]
                    items:
                      type: object
                      properties:
                        folder: {type: string, description: "The folder's full path, e.g. `/data/night/street`: send it as `folder`."}
                        name: {type: string, description: "Its last part, e.g. `street`."}
                        count: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Inputs]
      operationId: addInputs
      summary: Add inputs to a project, before any run
      description: >-
        The project then lists them on its Inputs page, and they can be saved in its collections, before any run used
        them. `path` is relative to `database`, like runs send them (`qa inputs add` sends what `qa batch` would run on).
        Inputs the project already has are left as they are; `metadata` is merged into theirs (where runs write the
        metadata of their input). At most 10,000 inputs per request. Needs the developer role (`collections.write`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, inputs]
              properties:
                project: {type: string, example: group/repo}
                inputs:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [database, path]
                    properties:
                      database: {type: string, example: /mnt/data}
                      path: {type: string, example: night/street/0001.raw}
                      metadata: {type: object, additionalProperties: true}
      responses:
        "200":
          description: The inputs, in their order, with their ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inputs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        database: {type: string}
                        path: {type: string}
                        new: {type: boolean, description: The project didn't have it.}
                  added: {type: integer}
                  known: {type: integer, description: How many the project already had.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {description: "More than 10,000 inputs, or metadata that is too big."}

  /inputs/{input_id}:
    get:
      tags: [Inputs]
      operationId: getInput
      summary: Get an input and its latest runs
      description: >-
        The input, with the 50 latest runs on it of the project and of its subprojects, deleted or not. Inputs of
        collections the project sees are found even if its runs never used them.
      parameters:
        - $ref: "#/components/parameters/inputId"
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The input.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Input"
                  - type: object
                    properties:
                      runs: {type: array, items: {$ref: "#/components/schemas/InputRun"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /inputs/{input_id}/thumbnail:
    get:
      tags: [Inputs]
      operationId: getInputThumbnail
      summary: Get an input's thumbnail
      description: >-
        A JPEG at most `size` pixels wide and high, cached. Images Pillow opens, the first frame of videos, and the
        formats the server's site decoders read. `404` (`no_thumbnail`) when none reads it, `missing_file` when the
        file is gone. You need to be able to read the file, like in the file browser.
      parameters:
        - $ref: "#/components/parameters/inputId"
        - {name: size, in: query, description: "Rounded up to 64, 128, 256, 512 or 1024.", schema: {type: integer, default: 256}}
        - {name: project, in: query, required: false, description: Also check that you can read this project., schema: {type: string}}
      responses:
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "304": {description: Not modified (`If-None-Match`).}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /inputs/{input_id}/file:
    get:
      tags: [Inputs]
      operationId: getInputFile
      summary: Get an input's file
      description: >-
        The file, when browsers show its format (JPEG, PNG, GIF, WebP, BMP, AVIF), for the image viewer. Else `415`
        (`unsupported_format`), with the `thumbnail_url` to show instead. You need to be able to read the file.
      parameters:
        - $ref: "#/components/parameters/inputId"
        - {name: project, in: query, required: false, description: Also check that you can read this project., schema: {type: string}}
      responses:
        "200":
          description: The file.
          content:
            image/*:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "415":
          description: Browsers can't show this format.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      thumbnail_url: {type: string}

  /collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List the collections a project sees
      description: The collections of the project and of its ancestors, by name. Archived ones only with `archived=1`.
      parameters:
        - $ref: "#/components/parameters/project"
        - {name: archived, in: query, description: "`1`: also the archived collections.", schema: {type: string, enum: ["0", "1"], default: "0"}}
      responses:
        "200":
          description: The collections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections: {type: array, items: {$ref: "#/components/schemas/Collection"}}
                  my_groups:
                    type: array
                    description: "Your groups: developers pin collections for them."
                    items: {type: object, properties: {id: {type: integer}, name: {type: string}}}
                  can_pin_everyone: {type: boolean, description: "You own the project: you can pin its collections for everyone."}
                  archived_count: {type: integer, description: "How many archived collections you see there (listed with `archived=1`)."}
                  can_create: {type: boolean, description: You can create collections in the project (personal ones, if not `can_share`).}
                  can_share: {type: boolean, description: You can create collections shared with the project.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      description: >-
        Creates the collection with its version 1. Needs the developer role. The inputs must be inputs of the runs of
        the project or of its subprojects (`unknown_inputs`). `409` (`name_taken`, with the existing collection's `id`)
        if the project has a collection with this name, archived or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name, inputs]
              properties:
                project: {type: string}
                name: {type: string, maxLength: 200, description: "Letters, digits, spaces, `.`, `-`, `_`, with `/` for groups, e.g. `night/hard-cases`."}
                description: {type: string, maxLength: 20000}
                inputs: {type: array, maxItems: 50000, items: {type: integer}, description: Input ids, in order. Duplicates are dropped.}
                notes: {type: string, maxLength: 20000, description: About version 1.}
                shared: {type: boolean, default: true, description: "With the project: needs the developer role. `false`: personal, only you see it, anyone who reads the project makes them."}
      responses:
        "201":
          description: The collection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Collection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NameTaken"}
        "413": {$ref: "#/components/responses/TooLarge"}

  /collections/resolve:
    get:
      tags: [Collections]
      operationId: resolveCollection
      summary: Resolve a collection reference to its inputs
      description: >-
        What `collections:` in batch files and `qaboard.collections.get()` run on. `ref` is `name`, `name@3`,
        `name@latest` or `project:name@3`. Without a project in it, it looks in `project`, then in its ancestors
        (`a/b/c`, `a/b`, `a`). Archived collections resolve.
      parameters:
        - {name: project, in: query, required: false, description: The project to look from. Optional when `ref` names one., schema: {type: string}}
        - {name: ref, in: query, required: true, schema: {type: string}, example: "night/hard-cases@2"}
      responses:
        "200":
          description: The version's inputs, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection: {$ref: "#/components/schemas/Collection"}
                  name: {type: string}
                  ref: {type: string, description: "The reference with its version, as seen from `project`, e.g. `night/hard-cases@2` or `a:night/hard-cases@2`."}
                  version: {type: integer}
                  project: {type: string, description: The collection's project.}
                  inputs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        database: {type: string}
                        path: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /collections/{collection_id}:
    get:
      tags: [Collections]
      operationId: getCollection
      summary: Get a collection and its versions
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/collectionVersion"
        - $ref: "#/components/parameters/collectionProject"
      responses:
        "200":
          description: The collection, the version asked (by default the latest), and all versions, the latest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Collection"
                  - type: object
                    properties:
                      version: {$ref: "#/components/schemas/CollectionVersion"}
                      versions: {type: array, items: {$ref: "#/components/schemas/CollectionVersion"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Collections]
      operationId: editCollection
      summary: Rename, describe, archive a collection
      description: Needs the developer role on the collection's project. `POST` does the same, for proxies that drop the body of `PATCH`.
      parameters:
        - $ref: "#/components/parameters/collectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                description: {type: string, maxLength: 20000}
                archived: {type: boolean}
                shared: {type: boolean, description: "Its creator only: share it with the project (developer role), or make it personal again."}
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Collection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NameTaken"}

  /collections/{collection_id}/inputs:
    get:
      tags: [Collections]
      operationId: listCollectionInputs
      summary: List a collection's inputs
      description: A version's inputs, in their order, with their runs in the project (`?project=`, by default the collection's) and its subprojects.
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/collectionVersion"
        - $ref: "#/components/parameters/collectionProject"
        - {name: q, in: query, description: "Words the input's path contains.", schema: {type: string}}
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of inputs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inputs:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Input"
                        - type: object
                          properties:
                            position: {type: integer, description: "From 0, in the version's order."}
                  total: {type: integer}
                  version: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /collections/{collection_id}/versions:
    post:
      tags: [Collections]
      operationId: saveCollectionVersion
      summary: Save a new version of a collection
      description: >-
        Saves version N+1 with all its inputs. `409` (`stale_version`, with `latest_version`) when `base_version`
        isn't the latest: someone saved meanwhile. Send the latest as `base_version` to save anyway.
      parameters:
        - $ref: "#/components/parameters/collectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs, base_version]
              properties:
                inputs: {type: array, maxItems: 50000, items: {type: integer}}
                base_version: {type: integer, description: The version the changes start from.}
                notes: {type: string, maxLength: 20000}
      responses:
        "201":
          description: The collection, with the new `version`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Collection"
                  - type: object
                    properties:
                      version: {$ref: "#/components/schemas/CollectionVersion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: "`base_version` isn't the latest."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      base_version: {type: integer}
                      latest_version: {type: integer}
        "413": {$ref: "#/components/responses/TooLarge"}

  /collections/{collection_id}/favorite:
    put:
      tags: [Collections]
      operationId: favoriteCollection
      summary: Add a collection to your favorites
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/collectionProject"
      responses:
        "200": {$ref: "#/components/responses/Favorite"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Collections]
      operationId: unfavoriteCollection
      summary: Remove a collection from your favorites
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/collectionProject"
      responses:
        "200": {$ref: "#/components/responses/Favorite"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /collections/{collection_id}/pins:
    put:
      tags: [Collections]
      operationId: pinCollection
      summary: Pin a collection for a group, or for everyone
      description: >-
        For a group (`{"group": 12}`): developers of the project who are in the group. For everyone on the project
        (`{"group": null}`): its owners. The group can be sent as `?group=` instead (empty for everyone).
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/pinGroup"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Pin"}
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Collection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Collections]
      operationId: unpinCollection
      summary: Unpin a collection for a group, or for everyone
      description: Who can pin can unpin. Prefer `?group=` to a body, which some proxies drop on `DELETE`.
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/pinGroup"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Pin"}
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Collection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /collections/{collection_id}/export.yaml:
    get:
      tags: [Collections]
      operationId: exportCollection
      summary: Get the qaboard.yaml of a batch on a collection
      description: With `version`, the batch runs on that version, else on the latest when it starts.
      parameters:
        - $ref: "#/components/parameters/collectionId"
        - $ref: "#/components/parameters/collectionVersion"
        - $ref: "#/components/parameters/collectionProject"
      responses:
        "200":
          description: YAML to paste in qaboard.yaml.
          content:
            text/yaml:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /user/me/:
    get:
      tags: [Account]
      operationId: whoAmI
      summary: Who is calling
      description: Your account, and with a token, which token it is, its scopes and projects. Check your token with it.
      responses:
        "200":
          description: >-
            You. Anonymous calls get `is_authenticated: false`, and `reason`/`error` when a session couldn't be used.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /auth/token-exchange:
    post:
      tags: [Account]
      operationId: exchangeCiToken
      summary: Exchange a CI job's ID token for a token
      description: >-
        GitHub Actions and GitLab CI jobs send their OIDC ID token, and get a short-lived token (`qab_tmp_…`) of the
        service account that trusts the job, with its role and projects. `qa` does it by itself
        ([upload from CI without a secret](/docs/ci-integration#ci-without-secrets)). Errors are OAuth's:
        `{error, error_description}`.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: &tokenExchange
              type: object
              required: [grant_type, subject_token]
              properties:
                grant_type: {type: string, const: "urn:ietf:params:oauth:grant-type:token-exchange"}
                subject_token: {type: string, description: The CI job's ID token, for the audience the service account expects (the server's URL by default).}
                subject_token_type:
                  type: string
                  enum: ["urn:ietf:params:oauth:token-type:id_token", "urn:ietf:params:oauth:token-type:jwt"]
                service_account: {type: string, description: "Which service account, when several trust the job ($QABOARD_SERVICE_ACCOUNT)."}
          application/x-www-form-urlencoded:
            schema: *tokenExchange
      responses:
        "200":
          description: The token, valid for `tokens.ci_lifetime_minutes` (6 hours by default).
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: {type: string}
                  issued_token_type: {type: string, const: "urn:ietf:params:oauth:token-type:access_token"}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer, description: Seconds.}
                  service_account: {type: string}
                  scopes: {type: array, items: {type: string}}
                  projects: {type: array, items: {type: string}}
        "400": {description: "Not a token exchange, not a JWT, or several service accounts trust the job: say which."}
        "401": {description: "The ID token is invalid or expired."}
        "403": {description: "No service account trusts this job, issuer or audience."}
        "503": {description: "The CI's issuer can't be reached."}

  /health:
    get:
      tags: [Server]
      operationId: health
      summary: Check the server is up
      security:
        - {}
      responses:
        "200":
          description: The server and its database are up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
        "503":
          description: The database can't be reached.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A QA-Board access token (`qab_pat_…`, or `qab_svc_…` for a service account). Create one in the web app, in
        **Settings → Access tokens**, or print the CLI's with `qa auth token`. Tokens have scopes: `read`, `ingest`
        (send results), `act` (redo runs, start or delete batches, save milestones), `admin`. Tokens in the URL
        (`?token=`) are only accepted for GET requests.

  headers:
    X-Has-More:
      description: "`true` when there are more items after this page."
      schema: {type: string, enum: ["true", "false"]}

  parameters:
    inputId:
      name: input_id
      in: path
      required: true
      description: The input's id (`id` of an `Input`).
      schema: {type: integer}
    collectionId:
      name: collection_id
      in: path
      required: true
      schema: {type: integer}
    collectionVersion:
      name: version
      in: query
      description: A version number, or `latest` (default).
      schema: {type: string}
      example: "2"
    collectionProject:
      name: project
      in: query
      required: false
      description: >-
        The project you look from: the collection's or one of its subprojects (they see their ancestors' collections).
        By default, the collection's.
      schema: {type: string}
    pinGroup:
      name: group
      in: query
      required: false
      description: The group's id, empty for everyone. Instead of the body's `group`.
      schema: {type: string}
    pageLimit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 5000, default: 100}
    project:
      name: project
      in: query
      required: true
      description: The project id, as in the web app's URLs.
      schema: {type: string}
      example: kitefin/detector
    batchCommit:
      name: commit
      in: path
      required: true
      description: The commit's id, or its start if no other commit of the project starts the same way.
      schema: {type: string}
    outputId:
      name: output_id
      in: path
      required: true
      description: The run's id (`id` in the commit's `outputs`).
      schema: {type: integer}
      example: 184467
    commitsQuery:
      name: q
      in: query
      description: >-
        Search all the project's commits, with the syntax of the web app's search box, e.g. `branch:release -wip`
        or `committer:arjun`. Ignores the date range, unless you give `from` or `to`.
      schema: {type: string}
    committer:
      name: committer
      in: query
      description: Only this committer's commits (their exact name).
      schema: {type: string}
    from:
      name: from
      in: query
      description: Commits authored after this date (UTC).
      schema: {type: string, format: date-time}
      example: "2026-10-01T00:00:00.000Z"
    to:
      name: to
      in: query
      description: Commits authored before this date (UTC).
      schema: {type: string, format: date-time}
      example: "2026-11-01T00:00:00.000Z"
    limit:
      name: limit
      in: query
      description: Page size. With it, the `X-Has-More` header says if there are more.
      schema: {type: integer, minimum: 1, maximum: 1000}
    offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    batchFilter:
      name: batch
      in: query
      description: Only this batch of each commit.
      schema: {type: string}
    onlyCiBatches:
      name: only_ci_batches
      in: query
      description: Only the CI batch of each commit (label `default`).
      schema: {type: boolean, default: false}
    withOutputsFalse:
      name: with_outputs
      in: query
      description: "`true` adds each batch's runs. Can be big."
      schema: {type: boolean, default: false}
    metricsToAggregate:
      name: metrics
      in: query
      description: >-
        Metrics to aggregate over each batch's valid runs, as JSON `{"<metric>": <target>}`: each batch's
        `aggregated_metrics` gets `<metric>_median`, `<metric>_average` and `<metric>_sum`. At most 20.
      schema: {type: string}
      example: '{"mAP": 0.5}'
    scope:
      name: scope
      in: query
      description: "`mine`: only commits you wrote or have batches in. Needs to be signed in."
      schema: {type: string, enum: [all, mine], default: all}

  requestBodies:
    StartBatch:
      required: true
      description: What the web app's **Run Tests / Tuning** form sends. Only `batch_label` and `selected_group` are required.
      content:
        application/json:
          schema:
            type: object
            required: [batch_label, selected_group]
            properties:
              batch_label:
                type: string
                description: "The batch's name on the commit's page. Use a new one: `default` is usually the CI's results."
              selected_group:
                description: The batches to run, as in `qa batch <batch>`; aliases and patterns like `night-*` work.
                oneOf:
                  - type: string
                  - type: array
                    items: {type: string}
              platform: {type: string, description: "One of `inputs.platforms` in qaboard.yaml. Default: the project's."}
              tuning_search:
                type: object
                description: >-
                  The parameters to try, as `qa batch --tuning-search` reads them: `{"search_type": "grid",
                  "parameter_search": {"threshold": [0.3, 0.5]}}`, or `sampler` with `search_options.n_iter`. For an
                  automated tuning (`qa optimize`), `search_type: optimize` and `parameter_search` the YAML configuration
                  as a string. Default: no tuning.
              batches_files:
                type: array
                maxItems: 20
                description: >-
                  Batch files that aren't in the commit, e.g. local ones, read after the commit's `inputs.batches` and
                  the project's shared and private batches: they win for batches with the same name. At most 1 MB each.
                items:
                  type: object
                  required: [path, content]
                  properties:
                    path: {type: string, description: "How to name it, e.g. `qa/local.yaml`."}
                    content: {type: string, description: The file's YAML.}
              groups:
                type: array
                items: {type: string}
                description: "QA-Board's batch files to read. Default: the shared one and yours, like the web app."
              overwrite:
                type: boolean
                default: false
                description: Run again the runs that already succeeded. By default they are kept.
              notify:
                description: "`email` to get an email when the runs end (the default), `false` for none."
                oneOf:
                  - type: boolean
                  - type: string
                    enum: [email]
          example:
            batch_label: nms-sweep
            selected_group: ci
            tuning_search: {search_type: grid, parameter_search: {score_threshold: [0.3, 0.5]}}
            notify: false

  responses:
    NameTaken:
      description: "The project has a collection with this name (`name_taken`): `id` is its id."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  id: {type: integer}
    TooLarge:
      description: "Too many inputs (`too_many_inputs`: at most 50,000), or a text too long (`too_long`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Favorite:
      description: Whether it's in your favorites now.
      content:
        application/json:
          schema:
            type: object
            properties:
              id: {type: integer}
              favorite: {type: boolean}
    BatchRefused:
      description: >-
        The request can't start: `errors` says why, e.g. an unknown batch, an invalid tuning, a server that starts no
        batches, a commit QA-Board doesn't know (`404`, it may not be pushed, or its CI didn't run `qa` yet) or an id
        several commits start with.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BatchCheck"}
    Commits:
      description: Commits, newest first.
      headers:
        X-Has-More: {$ref: "#/components/headers/X-Has-More"}
      content:
        application/json:
          schema:
            type: array
            items: {$ref: "#/components/schemas/Commit"}
    BadRequest:
      description: A parameter is invalid.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: >-
        Not authenticated: the server or the project requires signing in (`sign_in_required`), or the token can't be
        used (`token_invalid`, `token_expired`, `token_idle_expired`, `token_revoked`, `token_in_url`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "This token expired on 2026-10-01.", reason: token_expired}
    Forbidden:
      description: >-
        You can't read this project (`missing_role`, `forbidden_project`), your token lacks a scope
        (`missing_scope`, with the scope in `required`), or it is restricted to other projects (`token_project`), or
        it is the token of a batch QA-Board started, which only sends that batch's results (`batch_token_limited`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "Forbidden: You don't have permission to access this project", reason: forbidden_project}
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    BatchCheck:
      type: object
      properties:
        errors: {type: array, items: {type: string}, description: Why the batch can't start. Empty when it can.}
        warnings: {type: array, items: {type: string}, description: What may go wrong, e.g. missing inputs.}
        error: {type: string, description: The errors, in one sentence.}
        batches: {type: array, items: {type: string}, description: The batches that would run, aliases resolved.}
        definitions:
          type: array
          description: Where each batch is defined, in the order `qa batch` reads the files (the last one wins).
          items:
            type: object
            properties:
              name: {type: string}
              files: {type: array, items: {type: string}}
              sources:
                type: array
                items: {type: string, enum: [commit, qaboard, sent]}
                description: "`commit`: the commit's `inputs.batches`; `qaboard`: the project's shared and private batches; `sent`: `batches_files`."
        artifacts:
          type: object
          description: Whether the commit's artifacts are there (`ok`), and if not, whether QA-Board can ask the CI to recreate them (`recreate`).
          properties:
            ok: {type: boolean}
            problems: {type: array, items: {type: string}}
            recreate: {type: [string, "null"], description: "The CI job `recreate_artifacts` names, if any."}
            recreating: {type: boolean}
            recreate_docs: {type: string, description: How to set up `recreate_artifacts`.}

    Error:
      type: object
      properties:
        error: {type: string, description: What went wrong, for people.}
        reason: {type: string, description: "A stable code for scripts, when there is one, e.g. `token_expired`."}
      required: [error]

    MetricDefinition:
      type: object
      description: How to show a metric, from the project's metrics file or the code that returns it.
      properties:
        label: {type: string}
        short_label: {type: string}
        smaller_is_better: {type: [boolean, "null"], description: "null: QA-Board doesn't know which way is better."}
        target: {type: [number, "null"]}
        suffix: {type: string, description: "A unit, e.g. ` ms`."}
        scale: {type: number, description: Values are multiplied by it before they're shown.}
        group: {type: string, description: "Metrics shown together, levels separated by `/`, e.g. `Tests` or `Benchmarks/codec`."}
        aggregation: {type: string, enum: [sum, average, median], description: "How a commit's value comes from its runs'. Default: median."}
        part_of: {type: string, description: "The key of the metric this one is a part of, e.g. `passed` of `tests`."}
        intent: {type: string, enum: [success, warning, danger, none], description: The color of a part in stacked charts.}
      additionalProperties: true

    ProjectSummary:
      type: object
      properties:
        data:
          type: object
          description: >-
            The project's data: with `summary=true`, only `git` (name, description, web URL, avatar, default branch...)
            and `qatools_config.project` (the `project` section of its *qaboard.yaml*).
          additionalProperties: true
        latest_output_datetime: {type: [string, "null"], format: date-time}
        latest_commit_datetime: {type: string, format: date-time}
        total_commits: {type: integer}
        latest_human_activity:
          type: [string, "null"]
          format: date-time
          description: When a batch from the web app or someone's terminal last got a run, in the last 90 days.
        activity:
          type: [array, "null"]
          items: {type: integer}
          description: Batches that got runs on each of the last 30 days (UTC), oldest first.
        views_90d: {type: integer, description: Users who viewed it in the last 90 days.}
        my_last_view: {type: [string, "null"], format: date-time}
        my_latest_activity:
          type: [string, "null"]
          format: date-time
          description: Your latest batch or commit in the last 90 days. Only for signed-in users.

    ProjectData:
      type: object
      properties:
        qatools_config: {type: object, description: The project's latest *qaboard.yaml*, as JSON., additionalProperties: true}
        qatools_metrics:
          type: object
          description: The project's metrics definitions.
          properties:
            available_metrics:
              type: object
              additionalProperties: {$ref: "#/components/schemas/MetricDefinition"}
            default_metric: {type: string}
            summary_metrics: {type: array, items: {type: string}}
            main_metrics: {type: array, items: {type: string}}
          additionalProperties: true
        git: {type: object, description: What the git host says about the repository., additionalProperties: true}
      additionalProperties: true

    Commit:
      type: object
      properties:
        id: {type: string, description: The full commit sha.}
        branch: {type: string, description: "The branch, without `origin/`. Empty when the client didn't know it."}
        message: {type: string}
        committer_name: {type: string}
        committer_avatar_url: {type: [string, "null"]}
        authored_datetime: {type: string, format: date-time}
        authored_date: {type: string, format: date}
        latest_output_datetime: {type: [string, "null"], format: date-time}
        deleted: {type: [boolean, "null"], description: Whether the commit's artifacts were deleted.}
        data:
          type: object
          description: >-
            What QA-Board and clients saved with the commit: its *qaboard.yaml* (`qatools_config`), metrics definitions
            (`qatools_metrics`), who sent it (`submitted_by`), and any metadata clients add.
          additionalProperties: true
        outputs_url: {type: string, description: Where the commit's runs are saved, as a path on the server (`/s/...`).}
        artifacts_url: {type: string, description: Where the commit's artifacts (builds, configurations) are saved.}
        repo_artifacts_url: {type: string, description: The artifacts of the git repository, for sub-projects.}
        batches:
          type: object
          description: The commit's batches, by label. The CI batch's label is `default`.
          additionalProperties: {$ref: "#/components/schemas/Batch"}

    CommitWithRuns:
      allOf:
        - $ref: "#/components/schemas/Commit"
        - type: object
          properties:
            artifacts:
              type: object
              description: Whether the commit's artifacts are there, to run tests from the web app.
              properties:
                ok: {type: boolean}
                problems: {type: array, items: {type: string}}
              additionalProperties: true
          example:
            id: 7622c33790d16cf1a04ad6a5c7b1a1d2a3b4c5d6
            branch: quant/int8
            message: "feat(quant): percentile calibration (99.99)"
            committer_name: Arjun Sethuraman
            committer_avatar_url: null
            authored_datetime: "2026-11-05T13:58:40+00:00"
            authored_date: "2026-11-05"
            latest_output_datetime: "2026-11-05T14:02:11.391000"
            deleted: false
            data: {qatools_config: {project: {reference_branch: main}}}
            outputs_url: /s/mnt/qaboard/kitefin/detector/outputs/7622c337
            artifacts_url: /s/mnt/qaboard/kitefin/detector/artifacts/7622c337
            repo_artifacts_url: /s/mnt/qaboard/kitefin/detector/artifacts/7622c337
            batches:
              default:
                id: 1204
                commit_id: 7622c33790d16cf1a04ad6a5c7b1a1d2a3b4c5d6
                label: default
                created_date: "2026-11-05T13:59:02.120000"
                origin: ci
                user_name: ci-runner
                latest_output_datetime: "2026-11-05T14:02:11.391000"
                data: {}
                batch_dir_url: /s/mnt/qaboard/kitefin/detector/outputs/7622c337/default
                valid_outputs: 1
                pending_outputs: 0
                running_outputs: 0
                failed_outputs: 0
                deleted_outputs: 0
                aggregated_metrics: {}
                outputs:
                  "184467":
                    id: 184467
                    output_type: ""
                    platform: linux
                    configurations: [fp32, size-320]
                    extra_parameters: {}
                    metrics: {mAP: 0.612, latency_ms: 18.4, is_failed: false}
                    is_failed: false
                    is_pending: false
                    is_running: false
                    data: {}
                    deleted: false
                    created_date: "2026-11-05T13:59:02.381000"
                    queued_at: "2026-11-05T13:59:02Z"
                    started_at: "2026-11-05T13:59:30Z"
                    finished_at: "2026-11-05T14:02:11Z"
                    output_dir_url: /s/mnt/qaboard/kitefin/detector/outputs/7622c337/default/slices-indoor
                    test_input_database: /mnt/datasets/kitefin
                    test_input_path: slices/indoor
                    test_input_metadata: {}
            artifacts: {ok: true, problems: []}

    Batch:
      type: object
      description: >-
        A batch: runs started together with the same label, e.g. by the CI (`default`) or from the web app.
      properties:
        id: {type: integer}
        commit_id: {type: string, description: The commit's sha.}
        label: {type: string, description: "`default` for the CI batch, shown as **CI** in the web app."}
        created_date: {type: string, format: date-time}
        origin: {type: [string, "null"], description: "Where it was started: `ci`, `webapp` or `local`."}
        user_name: {type: [string, "null"], description: Who started it.}
        latest_output_datetime: {type: [string, "null"], format: date-time}
        data: {type: object, description: The batch's settings and bookkeeping., additionalProperties: true}
        batch_dir_url: {type: string, description: "Where its runs are saved, as a path on the server (`/s/...`)."}
        valid_outputs: {type: integer, description: Runs that finished without failing.}
        pending_outputs: {type: integer, description: Runs that wait or run.}
        running_outputs: {type: integer}
        failed_outputs: {type: integer}
        deleted_outputs: {type: integer, description: Runs whose files were deleted.}
        aggregated_metrics:
          type: object
          description: "With the `metrics` parameter: `<metric>_median`, `<metric>_average` and `<metric>_sum`."
          additionalProperties: {type: number}
        outputs:
          type: object
          description: The runs, by id. Only when runs are asked for.
          additionalProperties: {$ref: "#/components/schemas/Run"}

    BatchWithCommit:
      allOf:
        - $ref: "#/components/schemas/Batch"
        - type: object
          properties:
            project: {type: string}
            commit:
              type: object
              properties:
                id: {type: string}
                branch: {type: string}
                message: {type: string}
                committer_name: {type: string}
                authored_datetime: {type: [string, "null"], format: date-time}
            default_metric: {type: [string, "null"], description: "With `metrics=default`: the project's default metric."}
            default_metric_info:
              description: "With `metrics=default`: how to show it."
              oneOf:
                - $ref: "#/components/schemas/MetricDefinition"
                - type: "null"

    Run:
      type: object
      description: A run of the code on an input with configurations (an *output* in the API).
      properties:
        id: {type: integer}
        output_type:
          type: string
          description: "`optim_iteration` for the evaluations of automated tunings, else usually empty."
        test_input_database: {type: string, description: "The input's database, e.g. a dataset's folder."}
        test_input_path: {type: string, description: The input's path, relative to its database.}
        test_input_metadata: {type: object, description: The input's metadata, from the batch definition., additionalProperties: true}
        platform: {type: string}
        configurations:
          type: array
          description: "The configurations (`qa --config`): strings and mappings."
          items: {}
        extra_parameters: {type: object, description: The tuning parameters., additionalProperties: true}
        metrics:
          type: object
          description: The run's metrics, and those added by scripts.
          additionalProperties: true
        is_pending: {type: boolean, description: The run waits or runs.}
        is_running: {type: boolean}
        is_failed: {type: boolean}
        deleted: {type: [boolean, "null"], description: The run's files were deleted.}
        data:
          type: object
          description: >-
            What else the server knows: e.g. who sent it (`submitted_by`), the parameters the run reported
            (`params`), metrics added by scripts and who added them (`added_metrics`). When the run was done again,
            `attempt` is the number of the attempt these results are from, and `previous_attempts` says how the
            earlier ones ended (`attempt`, `status`: success, failed or unfinished, `started_at`, `finished_at`, `user`,
            their `metrics`, and `in_place` when the run was done again in the same folder). `attempt_logs` lists the
            earlier attempts whose logs are in the run's folder, as `log.attempt<N>.txt`.
          additionalProperties: true
        created_date: {type: string, format: date-time}
        queued_at: {type: [string, "null"], format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        output_dir_url:
          type: string
          description: "The run's folder, as a path on the server: download files from `<server><output_dir_url>/<file>`."

    AddedMetric:
      type: object
      properties:
        value: {type: [number, boolean, string, "null"]}
        at: {type: string, format: date-time}
        user: {type: string, description: "The token's user: who added it."}
        token: {type: string, description: The token's name.}
        script: {type: string}
        script_sha256: {type: string}
        qaboard_version: {type: string}
        note: {type: string}
        replaced: {description: The value it replaced.}

    ComparedCommit:
      type: object
      properties:
        id: {type: [string, "null"], description: "The sha, `null` when no reference was found."}
        branch: {type: string}
        message: {type: string}
        committer_name: {type: string}
        authored_datetime: {type: [string, "null"], format: date-time}
        batch: {type: string}
        runs:
          type: object
          properties:
            total: {type: integer}
            valid: {type: integer}
            failed: {type: integer}
            pending: {type: integer}
            running: {type: integer}

    Comparison:
      type: object
      properties:
        project: {type: string}
        status:
          type: string
          enum: [complete, running, missing]
          description: >-
            `complete`: the numbers are final. `running`: some runs aren't finished. `missing`: runs or the reference
            are missing, `messages` says what.
        messages: {type: array, items: {type: string}, description: Why the comparison is incomplete, and warnings.}
        commit:
          allOf:
            - $ref: "#/components/schemas/ComparedCommit"
            - type: object
              properties:
                reruns:
                  type: object
                  description: The runs of the batch that were done again.
                  properties:
                    runs: {type: integer, description: How many runs were done again.}
                    after_failure: {type: integer, description: Those that succeeded after an attempt that failed.}
                    after_unfinished: {type: integer, description: Those that succeeded after an attempt that never said how it ended.}
        reference:
          allOf:
            - $ref: "#/components/schemas/ComparedCommit"
            - type: object
              properties:
                requested: {type: string, description: The reference you asked for, or the default.}
                type: {type: string, enum: [milestone, commit, branch]}
                milestone: {type: [string, "null"], description: The milestone's label.}
                gate:
                  type: [object, "null"]
                  description: >-
                    The `gate:` section of the *qaboard.yaml* the reference's results were sent with, `{}` if it had
                    none, `null` if QA-Board doesn't have it. `qa gate` says when a commit loosens the rules.
                  additionalProperties: true
        metrics:
          type: object
          description: The **Summary**'s numbers, by metric.
          additionalProperties:
            type: object
            properties:
              label: {type: string}
              short_label: {type: string}
              suffix: {type: string}
              scale: {type: number}
              smaller_is_better: {type: [boolean, "null"], description: "null: QA-Board doesn't know which way is better."}
              target: {type: [number, "null"]}
              declared: {type: boolean, description: Whether the metric has a definition.}
              new: {$ref: "#/components/schemas/MetricStats"}
              ref: {$ref: "#/components/schemas/MetricStats"}
              delta: {type: [number, "null"], description: New median minus reference median.}
              delta_relative: {type: [number, "null"], description: "`delta` divided by the reference median's absolute value."}
        tests:
          type: array
          description: The **Metrics Diff**'s rows, one per run of the commit.
          items:
            type: object
            properties:
              id: {type: integer, description: The run's id.}
              reference_id: {type: [integer, "null"], description: The reference run it's compared with.}
              reference_mismatch:
                type: [object, "null"]
                description: >-
                  `null` when the reference run is the same test. Otherwise what differs (`test_input_path`,
                  `configurations`, `platform`, `extra_parameters`), with the reference run's value.
                additionalProperties: true
              test_input_path: {type: string}
              test_input_database: {type: string}
              label: {type: [string, "null"]}
              platform: {type: string}
              configurations: {type: array, items: {}}
              extra_parameters: {type: object, additionalProperties: true}
              is_failed: {type: boolean}
              batch:
                type: [string, "null"]
                description: >-
                  The batch of *qaboard.yaml* the run comes from (`qa batch <name>`), `null` if it doesn't say.
                  `qa gate` uses it for the rules on some batches and `expect_batches`.
              attempts:
                type: object
                description: Only for runs that were done again.
                properties:
                  attempt: {type: integer, description: The attempt these results are from.}
                  previous: {type: array, items: {type: string, enum: [success, failed, unfinished, unknown]}, description: "How the earlier attempts ended, the oldest first."}
                  in_place: {type: boolean, description: Whether the run was done again in the same folder.}
              metrics:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    new: {type: number}
                    ref: {type: [number, "null"]}
                    delta: {type: [number, "null"]}
                    delta_relative: {type: [number, "null"]}
              bit_accurate: {type: [boolean, "null"], description: "With `bit_accuracy=true`: whether the files are the same."}
              bit_accuracy_mismatch: {type: array, items: {type: string}, description: The files that differ.}
        bit_accuracy:
          type: [object, "null"]
          description: "With `bit_accuracy=true`: how many runs were checked, mismatched, or couldn't be checked."
          properties:
            checked: {type: integer}
            mismatched: {type: integer}
            unavailable: {type: integer}
        project_gate:
          type: [object, "null"]
          description: >-
            The gate settings the project's owners set in the web app (**Admin → Quality gate**), `null` if they set
            none: `rules` in *qaboard.yaml*'s format, `max_failed_runs`, `require_bit_accuracy`, and `on_looser_rules`
            (`warn` or `fail`). `qa gate` checks them on top of the commit's own rules.
          additionalProperties: true

    MetricStats:
      type: object
      properties:
        median: {type: [number, "null"]}
        count: {type: integer, description: Runs with a number for this metric.}
        pass_rate: {type: [number, "null"], description: Share of runs that meet the target (0 to 1).}

    Milestone:
      type: object
      properties:
