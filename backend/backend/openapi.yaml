        notes: {type: string}
        shared: {type: boolean}
        commit: {type: string, description: The commit's sha.}
        commit_project: {type: [string, "null"], description: The commit's project, when it's another project's.}
        batch: {type: string}
        filter: {type: string, description: "The runs' filter, as in the web app's filter box."}
        branch: {type: [string, "null"]}
        committer_name: {type: [string, "null"]}
        message: {type: [string, "null"]}
        runs: {type: [object, "null"], description: What its runs used (datasets, batches, platforms)., additionalProperties: true}
        owner:
          type: [object, "null"]
          properties:
            user_name: {type: string}
            full_name: {type: [string, "null"]}
        is_mine: {type: boolean}
        can_edit: {type: boolean}
        is_favorite: {type: boolean}
        slug: {type: string}
        created_at: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}

    Input:
      type: object
      description: An input runs used. Inputs are global, a database and a path in it.
      properties:
        id: {type: integer}
        database: {type: string}
        path: {type: string, description: Relative to the database.}
        name: {type: string, description: "The path's last part, e.g. `street.raw`."}
        folder: {type: string, description: "The path's folder, e.g. `night` (`\"\"` at the database's root)."}
        full_path: {type: string, description: "The database and the path joined, e.g. `/data/night/street.raw`: what the web app shows and copies."}
        data: {type: object, additionalProperties: true, description: "What runs said about it, e.g. `metadata`."}
        runs: {type: integer, description: "How many runs of the project (and its subprojects) used it, deleted ones included."}
        first_run_at: {type: [string, "null"], format: date-time}
        last_run_at: {type: [string, "null"], format: date-time}
        thumbnail_url: {type: string, description: "`/api/v1/inputs/<id>/thumbnail`: add `?size=`."}
        url: {type: [string, "null"], description: "The file under `/s/`, like runs' `output_dir_url`. `null` when the database isn't an absolute path."}

    InputRun:
      type: object
      properties:
        id: {type: integer}
        project: {type: string, description: The run's project, the project asked or a subproject.}
        batch: {type: string}
        commit: {type: string}
        branch: {type: [string, "null"]}
        user: {type: [string, "null"]}
        origin: {type: [string, "null"], description: "`ci`, `local`, `webapp`..."}
        platform: {type: [string, "null"]}
        configurations: {type: array, items: {}}
        created_date: {type: [string, "null"], format: date-time}
        deleted: {type: boolean}
        is_failed: {type: boolean}
        is_pending: {type: boolean}
        is_running: {type: boolean}
        output_dir_url: {type: [string, "null"]}

    UserRef:
      type: [object, "null"]
      properties:
        id: {type: integer}
        user_name: {type: [string, "null"]}
        full_name: {type: [string, "null"]}

    Collection:
      type: object
      description: A named, versioned list of inputs of a project. Its subprojects see it too.
      properties:
        id: {type: integer}
        project: {type: string}
        name: {type: string, description: "`/` nests groups, e.g. `night/hard-cases`."}
        description: {type: string}
        created_by: {$ref: "#/components/schemas/UserRef"}
        updated_by: {$ref: "#/components/schemas/UserRef", description: Who saved the latest version.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived: {type: boolean}
        archived_at: {type: [string, "null"], format: date-time}
        latest_version: {type: integer}
        size: {type: integer, description: How many inputs the latest version has.}
        favorite: {type: boolean, description: In your favorites.}
        pinned_for:
          type: array
          description: The groups it's pinned for. `id` null is everyone on the project.
          items: {$ref: "#/components/schemas/PinnedFor"}
        pinned: {type: boolean, description: Pinned for everyone or for one of your groups.}
        can_edit: {type: boolean, description: You can save versions, rename and archive it.}
        shared: {type: boolean, description: "Seen by everyone on the project. `false`: personal, only its creator sees it."}
        mine: {type: boolean, description: You created it.}
        can_pin_everyone: {type: boolean, description: "You own its project: you can pin it for everyone. With `can_edit`, you can pin it for your groups."}
        ref: {type: string, description: "How the project asked about names it: `name`, or `project:name` when it's an ancestor's."}
        inherited: {type: boolean, description: "It's an ancestor's collection."}

    PinnedFor:
      type: object
      properties:
        id: {type: [integer, "null"]}
        name: {type: [string, "null"]}

    CollectionVersion:
      type: object
      description: Versions never change once saved.
      properties:
        version: {type: integer}
        created_by: {$ref: "#/components/schemas/UserRef"}
        created_at: {type: string, format: date-time}
        notes: {type: string}
        size: {type: integer}

    Pin:
      type: object
      properties:
        group: {type: [integer, "null"], description: "A group's id, `null` for everyone."}

    Me:
      type: object
      properties:
        is_authenticated: {type: boolean}
        is_anonymous: {type: boolean}
        user_id: {type: integer}
        user_name: {type: string}
        full_name: {type: [string, "null"]}
        email: {type: [string, "null"]}
        login_type: {type: [string, "null"]}
        kind: {type: string, description: "`human`, or `service` for service accounts."}
        status: {type: string}
        is_admin: {type: boolean}
        avatar_url:
          type: [string, "null"]
          description: >-
            Your picture, from your sign-in method, served by QA-Board to signed-in users (`/api/v1/users/<id>/picture?v=…`).
            `null` when it has none.
        profile:
          type: object
          description: What your sign-in method says about you, updated at each sign-in.
          properties:
            title: {type: string}
            department: {type: string}
            organization: {type: string}
            source: {type: string, description: The sign-in method these fields come from.}
            updated_at: {type: string, format: date-time}
            picture_source: {type: string, description: The sign-in method the picture comes from.}
            picture_updated_at: {type: string, format: date-time}
        token:
          type: object
          description: The token you sent, if any.
          properties:
            id: {type: integer}
            name: {type: string}
            prefix: {type: string, description: The token's first characters, to recognize it.}
            kind: {type: string}
            scopes: {type: array, items: {type: string, enum: [read, ingest, act, admin]}}
            projects: {type: array, items: {type: string}, description: "The projects it's restricted to, empty: all."}
            expires_at: {type: [string, "null"], format: date-time}
            idle_expiry_days: {type: [integer, "null"]}
            last_used_at: {type: [string, "null"], format: date-time, description: Before this request.}
        reason: {type: string}
        error: {type: string}
      required: [is_authenticated]
