project:
  name: my_group/sample_project
  type: git
  url: git@gitlab-srv/my_group/sample_project
  # the latest commit on this branch is the reference for bit-accuracy tests
  # typical choices are master, develop, or release
  reference_branch: master
  # Where the script implementing `run` and `postprocess` functions is located (relative to the project's root)
  entrypoint: qatools/main.py


# Depending on your project, you should use different job queues
# in our LSF cluster. Those defaults are reasonnable.
# In doubt, ask advice from your manager or the CAD team.
# Find some quota information with `bqueues`
lsf:
  # errors will be sent to this email
  email: arthur.flam@samsung.com
  # This queue doesn't have a max number of pending jobs and has medium priority
  queue: alg_q
  # we will use a fast queue to launch jobs that create subsequent LSF jobs
  # it helps get a fast feeback about which outputs are pending
  fast_queue: alg_fast_q



inputs:
  # the default configuration.
  # Usually you will use it in your `run` function to read from $configuration.json/yaml
  configuration: base
  # Your inputs are located at $database/$path
  # In other words, your database is the longest common prefix of your inputs
  # It's usually a different path on linux and windows
  database:
    linux: /net/f2/algo_archive/DVS_SLAM_Database
    windows: F:/DVS_SLAM_Database

  # where we define groups
  # relative to the root of the project
  groups: qatools/input_groups.yaml

  # if you want to run all recordings under $database/sub_folder
  # you need a way to identify test inputs
  # either your inputs are files/directories, matching a globbing expression
  glob: '*.bin'
  # maybe your tests are actually the folder containing the match (eg movies with Frame0, Frame1...)
  use_parent_folder: false


outputs:
  # Each metric should have a label, a quality treshold, a scale, unit...
  # It is all defined in this file
  metrics: qatools/metrics.yaml

  # To view the qualitative results, we must describe to the UI application
  # what type of results we computed (images, movies...) and where.
  # We describe them with an array of results.
  detailed_views:
  - name: My plot
    # If you use plotly, it is very simple to view yours plots in the web UI
    type: plotly/json 
    # Save your plot's data and layout in a json file
    # Note: To find the data they will display, some viewers might rely on conventions
    #       but it is best to be explicit
    path: data.json
    # { 
    #   layout: {...},        // regular plotly layout
    #   data: [{...}, {...}]  // data (array) of regular plotly traces
    # }
    #
    # If you add parameters, they will be passed down to the viewer
    # For instance, you may want to adjust optionnal displays, styling, etc.
    # Each viewer will have its own options....
    # 
    # Some results are too heavy to show all the time, or are only there for debug purposes.
    # You can define them as optionnal:
    # default_hidden: true

  - name: Augmented frames
    type: video/mp4 # shows synced videos
    path: movie.mp4

  # [OPTIONNAL] We style the card where we display the results with
  # those CSS style attributes
  # style:
  #   width: 840px


  # How can we create viewers that 
  # ...optionnaly/incrementally  show more complex data?
  # ...on the same plots, on a shared axis
  # ...with downloading data twice

  # [OPTIONNAL] The UI will let you control optional parameters passed down to all viewers
  controls:
    # - type: toggle   # TODO: Only toggle is supported for now.
    #                  #       Soon all HTML inputs: text_input, select, ...
    #                  #       It would be fairly easy to implement
    #   label: Debug   # shown near the input
    #   name: show_debug
    #   default: false
    #   # other parameters would be passed down as appropriate:
    #   # default: false
    #   # options: [A, B, C]



# After the build, you must defined what is needed to run your software:
# binaries, libraries, configuration files...
# These are called artifacts.
# The qatools give you (TODO) a command, `save_artifacts`, to save them
# Note: we don't use standard (even gitlab's) tools for artifact management. Maybe we should.
#
# Note: .qatools.yaml and qatools/ are saved automatically
artifacts:
  # this entry is special, those files will be shown in the UI
  configurations: 
    glob: configurations/*.json
  binary:
    glob: 'build/sample_project'

  # results will be saved as:
  # 
  # commit_folder
  # ├── .qatools.yaml
  # ├── qatools/*
  # ├── build
  # │  └── sample_project
  # └── configurations
  #    ├── params.json
  #    └── low-light.json


# Bit accuray tests will look for those files
bit_accuracy:
  patterns:
    - output.csv
    # - *.hex ...

# You artifacts will be saved under this location.
# Note: for now there is not support for migrations...
ci_root:
  linux: /home/arthurf/ci
  # it's useful to write the windows path,
  # it lets your run locally bit-accuracy tests
  windows: '\\\\netapp\\vol10\\users\\arthurf\\ci'
