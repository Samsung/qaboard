---
# Tests that you want to run together are organized in groups.
# To run the tests in a group:
#   $ qa batch --group my-group
#   $ qa batch --help
#
#
# You have lots of options to specify each batch's configuration.
# The examples below describe all the ways you can do it.
#
# 
# Tip: From the `run(context)` function qatools requires you to implement,
# the configuration for each test is available via:
#     ```
#     context.obj['configurations'] : list of strings/objects
#     context.obj['configuration']  : *deprecated* serialized string representation.
#     ```
# Your code does whatever it wants with it :)
#

basic-list-of-tests:
  # Those tests will run with the project's default configuration,
  # or the one specified on the CLI with --configuration
  tests:
  - DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2
  - DualGen3_WideAngle_IMU_BL15cm/Demo_set/Scene_5-1/Scene_5-1.bin
# context.obj['configurations'] => ["the default config defined in qatools.yaml"]


you-can-override-the-default-configuration:
  configuration: test
  tests:
  - DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2
  - DualGen3_WideAngle_IMU_BL15cm/Demo_set/Scene_5-1/Scene_5-1.bin
# context.obj['configurations'] => ["test"]


configurations-can-be-arrays:
  configuration:
    - base
    - low-light
  tests:
  - DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2
  - DualGen3_WideAngle_IMU_BL15cm/Demo_set/Scene_5-1/Scene_5-1.bin
# context.obj['configurations'] => ["base", "low-light"]


configurations-can-be-arrays-of-objects:
  configuration:
    - base
    - low-light
    - cde:
      - "--my-flag"
      - "--my-other-flag"
  tests:
  - DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2
  - DualGen3_WideAngle_IMU_BL15cm/Demo_set/Scene_5-1/Scene_5-1.bin
# context.obj['configurations'] => ["base", "low-light", {"cde": ["-DD"]}]


each-test-can-have-its-own-configuration:
  configuration:
    - base
  tests:
    DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2/10-scene_8a:
    # context.obj['configurations'] => ["base"]
    DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2/10-scene_3a:
      - low-light
    # context.obj['configurations'] => ["base", "low-light"]
    DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2/10-scene_7c:
      - low-light
      - extra-light
      - cde:
        - "-DD"
    # context.obj['configurations'] => ["base", "low-light", "extra-low-light", {"cde": ["-DD"]}]


## LSF configuration ##########################################################
you-can-also-give-an-LSF-configuration:
  lsf:
    memory: 1000
    threads: 1000
  configuration:
    - base
  tests:
  - DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2
  - DualGen3_WideAngle_IMU_BL15cm/Demo_set/Scene_5-1/Scene_5-1.bin


you-can-also-give-an-LSF-configuration-per-test:
  lsf:
    memory: 1000
  configuration:
    - base
  tests:
    DualGen3_WideAngle_IMU_BL10cm_mark25/Demo2:
    DualGen3_WideAngle_IMU_BL15cm/Demo_set/Scene_5-1/Scene_5-1.bin:
      lsf:
        memory: 200


## Reusable configurations/tests ##############################################
# Sometimes you want to mix and match reusabe definitions of configs and tests
# YAML anchors let you do it:

# You want to reuse those lists of tests across all HDR tests
.tests_hdr: &tests_hdr
  tests:
    - A
    - B

.lots_of_tests_hdr: &tests_hdr
  tests:
    - A
    - B
    - C
    - D
    - E
    - F

.HDR: &HDR
  configuration:
    - base
    - hdr_base
    - hdr_motion

.HDR-disabled: &HDR-disabled
  configuration:
    - base

hdr:
  <<: *HDR
  <<: *tests_hdr
no-hdr:
  <<: *HDR-disabled
  <<: *tests_hdr
# qa --batch-label hdr    batch --group hdr
# qa --batch-label no-hdr batch --group no-hdr

# Maybe on nightly runs you want to run lots of tests:
lots-of-hdr-tests:
  <<: *HDR
  <<: *lots_of_tests_hdr
lots-of-no-hdr-tests:
  <<: *HDR-disabled
  <<: *lots_of_tests_hdr




...

