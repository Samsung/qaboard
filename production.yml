
services:
  frontend:
    build:
      target: production
  db:
    shm_size: 1g
    restart: always
    # PostgreSQL writes its dirty buffers (a checkpoint) before stopping: give it time instead of being killed after
    # docker's default 10s, which would make the next start replay the WAL (crash recovery)
    stop_grace_period: 120s
    # On-prem, it can be helpful to expose the database and use various analytics products
    # ports:
    # - 5432:5432
  pgadmin:
    restart: always
  redis:
    restart: always
  backend:
    restart: always
    environment:
    - FLASK_ENV=production
    # To use values beyond 128, read
    # * https://stackoverflow.com/a/36452474/5993501
    # * https://uwsgi-docs.readthedocs.io/en/latest/articles/TheArtOfGracefulReloading.html#the-listen-queue
    # * https://stackoverflow.com/questions/43243483/docker-container-increase-listen-queue-size-beyond-128
    # * https://serverfault.com/questions/271380/how-can-i-increase-the-value-of-somaxconn
    - UWSGI_LISTEN_QUEUE_SIZE=1024
    - UWSGI_CHEAPER_ALGO_BUSYNESS=true
    # Per replica: divide by QABOARD_BACKEND_REPLICAS to keep the same capacity
    - UWSGI_CHEAPER_INITIAL=${QABOARD_UWSGI_CHEAPER_INITIAL:-16}  # initial number of processes
    - UWSGI_PROCESSES=${QABOARD_UWSGI_PROCESSES:-16}              # max
    - UWSGI_CHEAPER=${QABOARD_UWSGI_CHEAPER:-8}                   # minimum
    - UWSGI_CHEAPER_OVERLOAD=15
    # values in bytes
    - UWSGI_CHEAPER_RSS_LIMIT_SOFT=17179869184 #16GB
    - UWSGI_CHEAPER_RSS_LIMIT_HARD=
    - UWSGI_STATS=true
    # Several replicas behind nginx survive crashes and allow zero-downtime deploys with deployments/deploy.py
    # Note: we don't publish ports on the host (it would conflict between replicas). To debug without nginx:
    #   docker compose exec backend wget -qO- localhost:3001/api/v1/health
    deploy:
      replicas: ${QABOARD_BACKEND_REPLICAS:-1}
    # https://github.com/compose-spec/compose-spec/blob/master/spec.md#sysctls
    sysctls:
    - net.core.somaxconn=1024

  proxy:
    restart: always
  cantaloupe:
    restart: always
  rabbitmq:
    restart: always
  flower:
    restart: always

  # Adapted from https://devopsheaven.com/cron/docker/alpine/linux/2017/10/30/run-cron-docker-alpine.html
  # To trigger a backup manually call: docker compose -f docker-compose.yml -f production.yml up -d cron-backup-db
  # docker compose run cron-backup-db /etc/periodic/daily/backup
  cron-backup-db:
    image: postgres:12-alpine
    restart: always
    depends_on:
      - db
    environment:
      # https://www.postgresql.org/docs/9.3/libpq-envars.html
      PGHOST: ${PGHOST:-db}
      PGDATABASE: qaboard
      PGUSER: qaboard
      PGPASSWORD: password
      # Daily backups (YYYY-MM-DD.dump) older than this are deleted, but never the newest 3. 0: keep them all.
      # Other dumps (e.g. before-upgrade.dump) are never deleted. See services/db/backup
      BACKUP_RETENTION_DAYS: ${QABOARD_BACKUP_RETENTION_DAYS:-14}
      # Uncomment and set to run backups as a specific user (useful with NFS)
      # AS_USER_NAME: qaboard
      # AS_USER_GROUP: qaboard
      # AS_USER_UID: "1000"
      # AS_USER_GID: "1000"
    # https://busybox.net/downloads/BusyBox.html
    # -f: foreground
    # -d: log to stderr, 0 is the most verbose, default 8
    command: crond -f -d 0
    volumes:
    - ./services/db/backup:/etc/periodic/daily/backup:ro
    # Set the backup destination in your site overlay, e.g.:
    # - /path/to/backups:/backups
