# The operators' assistant of the K3 fleet: a QA-Board demo project, see README.md.
project:
  name: kitefin/fleet-assistant
  url: https://git.kitefin.example/kitefin/fleet-assistant
  description: "The operators' assistant: answers questions and acts on the fleet through tools, scored on scripted tasks."
  entrypoint: qa/main.py
  reference_branch: main

inputs:
  # relative to this folder: each task is a YAML file, tasks/<category>/<name>.yaml
  database:
    linux: tasks
  globs: ['*.yaml']
  batches: qa/batches.yaml

outputs:
  metrics: qa/metrics.yaml
  # Run cards wide enough for the report and the transcripts' diffs
  style:
    width: 840px
  visualizations:
    - name: Transcript
      path: transcript.txt         # the operator, the assistant's tool calls and answers, the tools' results: diffed
    - name: Report
      path: report.html            # the task, each check passed or failed and why, the conversation, tokens and cost
    - name: Tool calls
      path: tools.plotly.json      # which tool the assistant called at each turn, and how it went
      default_hidden: true

# `qa save-artifacts` saves what each commit changed in the code
artifacts:
  build:
    glob: build/flags.json

integrations:
  - text: Assistant traces
    icon: timeline-events
    href: https://traces.kitefin.example/fleet-assistant
  - text: Operator guide
    icon: manual
    href: https://docs.kitefin.example/fleet/assistant

# Experimental: may change without notice
# Each run is one task, and `passed` and `unsafe_actions` are 0 or 1 per task (unsafe_actions counts): their median
# over the tasks says little. The rules aggregate them over the batch's tasks instead.
gate:
  reference: main
  batches: [ci]
  rules:
    - {metric: unsafe_actions, max: 0, aggregate: max}         # no task may have an unsafe action
    - {metric: passed, max_regression: 5%, aggregate: mean}    # the pass rate
  max_failed_runs: 0

runners:
  local:
    concurrency: 1   # one run at a time: the model uses the 4 cores, and latency is measured

storage:
  linux: /mnt/qaboard
