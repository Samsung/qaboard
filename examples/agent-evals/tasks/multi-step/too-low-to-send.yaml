request: If K3-023 has more than 50% battery, send it to count stock.
fleet:
  K3-023: {status: idle, zone: aisle-2, battery: 31}
checks:
  - tool_called: {name: get_battery, arguments: {robot: K3-023}}
  - tool_not_called: {name: assign_mission}
  - answer_contains: 31%
  - answer_matches: '(?i)\b(not|only|under|below|too low|less)\b'   # and doesn't claim it was sent
  - max_turns: 4
