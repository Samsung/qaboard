<div class="container" id="histograms-{{commits.new.short_id}}"></div>
<script>
  var trace_new = {
    x: {{ commits.new.drifts() | tojson }},
    name: 'New',
    // autobinx: false, 
    histnorm: "count", 
    marker: {
      color: "#11DFC7", 
       line: {
        color:  "#11DFC7", 
        width: 1
      }
    },  
    opacity: 0.5, 
    type: "histogram", 
    xbins: {
      end: 100.0, 
      size: 1, 
      start: 0.0
    }
  };
  var trace_ref = {
    x: {{ commits.ref.drifts() | tojson }},
    name: 'Milestone',
    // autobinx: false, 
    histnorm: "count", 
    marker: {
      color: "rgba(100, 100, 102, 0.7)", 
       line: {
        color:  "rgba(100, 100, 102, 0.7)", 
        width: 1
      }
    },  
    opacity: 0.75, 
    type: "histogram", 
    xbins: {
      end: 100.0, 
      size: 1, 
      start: 0.0
    }
  };  
  var data = [trace_new, trace_ref];
  var layout = {
    bargap: 0., 
    bargroupgap: 0., 
    barmode: "overlay", 
    yaxis: {title: "#", color: "rgba(244,255,255,0.8)", showgrid: false, fixedrange: true},
    xaxis: {title: "Drift", color: "rgba(244,255,255,0.8)", fixedrange: true}, 
    plot_bgcolor: 'rgba(0,0,0,0)',
    legend: {font: {color: "rgba(244,255,255,0.8)"}},
    paper_bgcolor: 'rgba(0,0,0,0)',
    height: {{height}},
    margin: {
        // l: 50,
        // r: 50,
        // b: 50,
        // t: 0,
        // pad: 4
    },
    {%if width%} width:{{width}},{%endif%}
  };
  Plotly.newPlot('histograms-{{commits.new.short_id}}', data, layout, {displayModeBar: false});
</script>
