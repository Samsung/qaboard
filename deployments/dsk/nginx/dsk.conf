# DSK-specific nginx configuration
# Mounted by deployments/dsk/dsk.yml into /etc/nginx/conf.d/dsk.conf

server {
  server_name qaboard;
  listen 443 ssl default_server;

  ssl_certificate /etc/nginx/ssl/server.crt;
  ssl_certificate_key /etc/nginx/ssl/server.key;

  absolute_redirect off;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 600;
    include cors;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }

  # DSK file serving
  location ^~ /s/algo/ {
    alias /algo/;
    autoindex on;
    access_log off;
    include cors;
    gzip_static on;
    gunzip on;
  }

  location ^~ /s/mnt/ {
    alias /mnt/;
    autoindex on;
    access_log off;
    include cors;
  }

  # WebDAV
  location /davs/algo/ {
    alias /algo/;
    include /etc/nginx/webdav.conf;
  }

  # IIIF Cantaloupe
  location /iiif/2 {
    proxy_pass http://cantaloupe:8182/iiif/2;
  }

  # IIIF CDE
  location /iiif/cde {
    proxy_pass http://iiif-cde:9000;
  }

  # Metabase
  # location /metabase/ {
  #   proxy_pass http://metabase:3000/;
  #   proxy_connect_timeout 600;
  #   proxy_send_timeout 600;
  #   proxy_read_timeout 600;
  #   send_timeout 600;
  # }

  location ~ ^/metabase/(https?.*) {
    return 302 $1;
  }

  # Flower
  location /flower/ {
    proxy_pass http://flower:8888/flower/;
    proxy_set_header Host $host;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
