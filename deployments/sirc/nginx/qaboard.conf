# SIRC-specific nginx configuration
# deployments/sirc/sirc.yml mounts this folder, services/nginx/configure.sh copies it to /etc/nginx/conf.d
# Supports several replicas and zero-downtime deploys, see the comments in upstreams/backend.conf
upstream backend {
    include /etc/nginx/upstreams/backend.conf;
}

server {
  server_name qa qatools01 proxy;
  # default_server: we also answer for other host names (e.g. staging's alginfra1, FQDNs, IPs),
  # without it nginx would pick the first server listening on the port, e.g. dvd.conf on 5003
  listen 443 ssl default_server;
  listen 5000 default_server;
  listen 5002 default_server;
  listen 5003 default_server;
  listen 8080 default_server;
  # 80: http://qa, used by scripts and CI. production.env publishes it with QABOARD_PORT_HTTP=80
  listen 80 default_server;
  
  ssl_certificate /ssl/cert.cer;
  ssl_certificate_key /ssl/cert.key;

  absolute_redirect off;

  location /docs {
    alias /docs/;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location /docs/cis_utils/ {
    alias /algo/ws/ispq/docs/cis_utils/build/html;
    try_files $uri $uri/index.html $uri.html /index.html;
  }

  location / {
    root /builds;
    try_files $uri $uri/index.html $uri.html /index.html;
    # index.html must be revalidated to pick up new deploys
    add_header Cache-Control "no-cache";
  }

  # The webapp's bundles have a hash of their content in their names
  location /assets/ {
    root /builds;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /api {
    include uwsgi_params;
    uwsgi_pass backend;
    uwsgi_read_timeout 300;
    include cors;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Path /;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ^~ /webhook {
    include uwsgi_params;
    uwsgi_pass backend;
    include cors;
  }


  # SIRC-specific file serving locations
  # Browsers opening a folder get QA-Board's file browser, see services/nginx/snippets/qaboard-files.conf
  # qaboard-files-auth.conf: nginx asks the backend if users can read files (restricted projects, Unix permissions in
  # $QABOARD_FILES_UNIX_PERMISSIONS). Keep it in *all* the locations: else users can reach files via symlinks.
  # No WebDAV: it would bypass these checks. To bring it back, see deployments/dsk/nginx/dsk.conf
  location ^~ /s/algo/ {
    alias /algo/;
    include snippets/qaboard-files.conf;
    include snippets/qaboard-files-auth.conf;
    gzip_static on;
    gunzip on;
  }

  location ^~ /s/stage/ {
    alias /stage/;
    include snippets/qaboard-files.conf;
    include snippets/qaboard-files-auth.conf;
    gzip_static on;
    gunzip on;
  }

  location ^~ /s/sim/ {
    alias /sim/;
    include snippets/qaboard-files.conf;
    include snippets/qaboard-files-auth.conf;
  }

  location ^~ /s/data/ {
    alias /data/;
    include snippets/qaboard-files.conf;
    include snippets/qaboard-files-auth.conf;
  }

  location ^~ /s/home/ {
    alias /home/;
    include snippets/qaboard-files.conf;
    include snippets/qaboard-files-auth.conf;
  }

  location ^~ /s/home/ispq {
    deny all;
  }

  include snippets/qaboard-files-server.conf;

  # Metabase
  location /metabase/ {
    proxy_pass http://docker-prod-srv-1:3005/;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
  }

  location ~ ^/metabase/(https?.*) {
    return 302 $1;
  }

  # pgAdmin
  location /pgadmin4/ {
    proxy_set_header X-Script-Name /pgadmin4;
    proxy_set_header Host $host;
    proxy_set_header X-Scheme $scheme;
    proxy_pass http://pgadmin:80/;
    proxy_redirect off;
  }
}
