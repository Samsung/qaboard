default:
  tags: [lsf]

variables:
  SIRC_LSF_QUEUE: alg_isp_q
  SIRC_USER: ispq
  # https://docs.gitlab.com/ee/ci/yaml/#git-clean-flags
  GIT_CLEAN_FLAGS: -ffdx --exclude=webapp/node_modules/
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - test
  - deploy  # Internally
  - publish # To Pypi

before_script:
  - source ./.envrc
  # Use ssh-agent to build container images that access private repositories
  - eval $(ssh-agent -s)
  - ssh-add $HOME/.ssh/id_rsa
  - echo "${SSH_AGENT_PID}" > ssh-agent.pid

after_script:
  # don't leave ssh agents running
  - if [ -f ssh-agent.pid ] ; then kill $(cat ssh-agent.pid) ; fi


unit-tests:
  stage: test
  retry: 2 # solves frequent filesystem sync issues
  script:
    - green -vvv --quiet-stdout --run-coverage

type-check:
  stage: test
  script:
  - mypy -p qaboard --ignore-missing-imports

lint:
  stage: test
  script:
  - flake8 backend qaboard --count --select=E9,F63,F7,F82 --show-source --statistics


deploy:qa:
  stage: deploy
  only:
    - master
  script:
    - export PROXY_STUFF='--trusted-host pypi.org --trusted-host files.pythonhosted.org  --trusted-host pypi.python.org'
    - umask 022
    - pip install $PROXY_STUFF .

deploy:qa:windows:
  stage: deploy
  only:
    - master
  before_script: [] # Overrides the global before_script since it changes LD_LIBRARY_PATH which causes curl to fail
  script:
    -   - 'curl --header "Content-Type: application/json" --request POST --data ''{"build_url": "http://jenmaster1:8080/job/ALGO/job/Install_qaboard_on_windows_nodes", "cause": "cde-python updated", "params": {}}'' http://qa/api/v1/jenkins/build/trigger/'

publish:PyPi:
  stage: publish
  when: manual
  script:
  - ssh arthurf@planet31 'cd qaboard; twine upload --verbose -u __token__ dist/*'


