deploy:staging:
  stage: deploy
  script:
    - cd qaboard-webapp && GENERATE_SOURCEMAP=true npm ci && rsync -r build/* /home/ispq/qaboard/webapp_builds && cd ..
    - ssh qa docker pull $DOCKER_IMAGE:$CI_ENVIRONMENT_SLUG
    - ssh qa "docker stop qaboard-$CI_ENVIRONMENT_SLUG; docker rm qaboard-$CI_ENVIRONMENT_SLUG"
    - ssh qa "CI_ENVIRONMENT_SLUG=$CI_ENVIRONMENT_SLUG $(pwd)/qaboard-backend/deployment/start-docker.sh"
  environment:
    name: staging
    url: http://qa:9000
  only:
  - master

deploy:production:
  stage: deploy
  script:
    - cd qaboard-webapp && GENERATE_SOURCEMAP=true npm ci && rsync -r build/* /home/ispq/qaboard/webapp_builds && cd ..
    - ssh qa "cd $(pwd)/qaboard-backend && docker build --ssh default -m 12g --tag $DOCKER_IMAGE:$CI_ENVIRONMENT_SLUG . && docker push $DOCKER_IMAGE:$CI_ENVIRONMENT_SLUG"
    - ssh qa docker pull $DOCKER_IMAGE:$CI_ENVIRONMENT_SLUG
    - ssh qa "docker stop qaboard-$CI_ENVIRONMENT_SLUG; docker rm qaboard-$CI_ENVIRONMENT_SLUG"
    - ssh qa "CI_ENVIRONMENT_SLUG=$CI_ENVIRONMENT_SLUG $(pwd)/qaboard-backend/deployment/start-docker.sh"
  environment:
    name: production
    url: https://qa
  only:
  - master
  when: manual
