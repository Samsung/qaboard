default:
  tags: [lsf]

variables:
  SIRC_LSF_QUEUE: alg_isp_q
  SIRC_USER: ispq
  # https://docs.gitlab.com/ee/ci/yaml/#git-clean-flags
  GIT_CLEAN_FLAGS: -ffdx --exclude=webapp/node_modules/
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - test
  - deploy  # Internally
  - smoke-test
  - production  # Prod deploy, gated by smoke-test:dev
  - cleanup
  - publish # To Pypi

before_script:
  - source ./deployments/sirc/.envrc
  - eval $(ssh-agent -s)
  - ssh-add $HOME/.ssh/id_rsa
  - echo "${SSH_AGENT_PID}" > ssh-agent.pid

after_script:
  # don't leave ssh agents running
  - if [ -f ssh-agent.pid ] ; then kill $(cat ssh-agent.pid) ; fi


unit-tests:
  stage: test
  retry: 2 # solves frequent filesystem sync issues
  script:
    - green -vvv --quiet-stdout --run-coverage tests

type-check:
  stage: test
  script:
  - mypy -p qaboard --ignore-missing-imports

lint:
  stage: test
  script:
  - flake8 backend qaboard

webapp-tests:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd webapp
    - npm install --legacy-peer-deps
    - npm test -- --coverage --coverageReporters=cobertura --coverageReporters=text --watchAll=false --ci --forceExit --detectOpenHandles --reporters=default --reporters=jest-junit --testEnvironment=jsdom
    - pip install diff-cover
    - |
      TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-master}"
      echo "Target branch is: $TARGET_BRANCH"
      git fetch --unshallow || true
      git fetch origin "$TARGET_BRANCH"
      diff-cover coverage/cobertura-coverage.xml --compare-branch "origin/$TARGET_BRANCH"
      DIFF_COV="$(diff-cover coverage/cobertura-coverage.xml --compare-branch "origin/$TARGET_BRANCH" \
        | grep -E '^Coverage:' | grep -Eo '[0-9]+(\.[0-9]+)?%' || echo '0.00%')"
      echo "Diff coverage: $DIFF_COV"
  coverage: '/Diff coverage:\s+\d+(?:\.\d+)?%/'
  artifacts:
    when: always
    reports:
      junit: webapp/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: webapp/coverage/cobertura-coverage.xml

