stages:
  - test
  - deploy

before_script:
  - export PATH=/home/ispq/miniconda3/bin:$PATH

test:
  stage: test
  script:
    - python -munittest

deploy:
  stage: deploy
  only:
    - master
  script:
    - export PROXY_STUFF='--trusted-host pypi.org --trusted-host files.pythonhosted.org  --trusted-host pypi.python.org'
    - pip install $PROXY_STUFF .
